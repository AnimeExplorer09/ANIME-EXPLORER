<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Access</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c4dff">
<meta name="apple-mobile-web-app-capable" content="yes">

    <style>
        :root {
            --primary: #7c4dff;
            --primary-glow: rgba(124, 77, 255, 0.5);
            --accent: #00e5ff;
            --bg-dark: #050507;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%; height: 100%;
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: white;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-container {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at 50% 50%, #12121c 0%, #050507 100%);
        }

        .blob {
            position: absolute; width: 400px; height: 400px;
            background: var(--primary);
            filter: blur(100px); border-radius: 50%; opacity: 0.2;
            animation: move 25s infinite alternate;
        }
        .blob-2 { background: var(--accent); animation-duration: 18s; right: 0; bottom: 0; }

        @keyframes move {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(150px, 100px) scale(1.3); }
        }

        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 35px;
            padding: 50px 40px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            position: relative;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
            animation: cardEntrance 1s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: scale(0.9) translateY(30px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .brand-logo {
            font-size: 36px; font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #b39dff 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 8px; letter-spacing: -1.5px;
        }

        .subtitle {
            color: rgba(255,255,255,0.5);
            font-size: 14px; margin-bottom: 35px;
        }

        /* Crown badge */
        .admin-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(255,215,0,0.1);
            border: 1px solid rgba(255,215,0,0.25);
            color: #FFD700; font-size: 12px; font-weight: 700;
            padding: 5px 14px; border-radius: 20px;
            margin-bottom: 28px;
            letter-spacing: 0.5px;
        }

        /* Google Button */
        .google-btn {
            width: 100%;
            padding: 16px;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.06);
            color: white;
            font-size: 15px; font-weight: 700;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 12px;
            font-family: inherit;
            transition: 0.3s;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .google-btn:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-2px);
            border-color: rgba(255,255,255,0.2);
        }
        .google-btn:active { transform: scale(0.98); }
        .google-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .google-icon {
            width: 22px; height: 22px;
        }

        .btn-spinner {
            display: none;
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #status {
            margin-top: 20px; font-size: 13px; font-weight: 600;
            min-height: 20px;
        }
        #status.error   { color: #ff6b6b; }
        #status.info    { color: #b39dff; }
        #status.success { color: #4ade80; }

        .security-note {
            margin-top: 24px;
            font-size: 12px;
            color: rgba(255,255,255,0.2);
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .security-note i { font-size: 11px; }
    </style>
</head>
<body>

    <div class="bg-container">
        <div class="blob"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="login-card">
        <div class="brand-logo">AnimeExplorer</div>
        <div class="admin-badge">
            <i class="fa-solid fa-crown"></i> Admin Access
        </div>
        <p class="subtitle">Sign in with your Google account</p>

        <button class="google-btn" id="googleBtn" onclick="googleLogin()">
            <svg class="google-icon" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            <span id="btnText">Continue with Google</span>
            <div class="btn-spinner" id="btnSpinner"></div>
        </button>

        <p id="status"></p>

        <div class="security-note">
            <i class="fa-solid fa-lock"></i>
            Restricted access — Admins only
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDLd3TW-y89lwShUmcIHw3YGzDjo4cg3y4",
            authDomain: "animea2z.firebaseapp.com",
            projectId: "animea2z",
            storageBucket: "animea2z.firebasestorage.app",
            messagingSenderId: "673605765684",
            appId: "1:673605765684:web:a6f851e0d79836b79b1861"
        };

        const app  = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db   = getFirestore(app);

        const ADMIN_EMAIL = "animeofficiala2z@gmail.com";

        const googleBtn  = document.getElementById('googleBtn');
        const btnText    = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const status     = document.getElementById('status');

        function setLoading(on) {
            googleBtn.disabled = on;
            btnText.style.display = on ? 'none' : 'inline';
            btnSpinner.style.display = on ? 'block' : 'none';
        }

        function setStatus(msg, type) {
            status.textContent = msg;
            status.className = type;
        }

        // Page load pe redirect result check karo
        (async () => {
            try {
                setLoading(true);
                setStatus('Checking...', 'info');
                const result = await getRedirectResult(auth);
                if (result) {
                    const user = result.user;
                    if (user.email !== ADMIN_EMAIL) {
                        await signOut(auth);
                        setLoading(false);
                        setStatus('❌ Access denied. Admins only.', 'error');
                        return;
                    }
                    try {
                        const userRef = doc(db, "users", user.uid);
                        const snap = await getDoc(userRef);
                        if (snap.exists()) {
                            await updateDoc(userRef, { isOnline: true });
                        }
                    } catch(e) {}
                    setStatus('✓ Welcome back, Admin!', 'success');
                    setTimeout(() => window.location.href = 'admin.html', 800);
                } else {
                    setLoading(false);
                    setStatus('', '');
                }
            } catch(e) {
                setLoading(false);
                setStatus('', '');
            }
        })();

        window.googleLogin = async () => {
            setLoading(true);
            setStatus('Redirecting to Google...', 'info');
            try {
                const provider = new GoogleAuthProvider();
                provider.setCustomParameters({ login_hint: ADMIN_EMAIL });
                await signInWithRedirect(auth, provider);
            } catch(e) {
                setLoading(false);
                setStatus('Login failed. Try again.', 'error');
            }
        };
    </script>
</body>
</html>
