<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Polls - AnimeExplorer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c4dff">
<meta name="apple-mobile-web-app-capable" content="yes">

    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <style>
        /* ---------- RESET & VARIABLES ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #0f1116;
            color: #f0f0ff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            padding-bottom: 80px;
        }
        /* ---------- HEADER (mobile-optimized) ---------- */
        .app-header {
            position: sticky;
            top: 0;
            background: rgba(15,17,22,0.97);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            z-index: 100;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
        }
        .page-title {
            font-size: 18px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .page-title i { color: #7B5CE8; }
        .xp-wrap { text-align: right; }
        .xp-level { font-size: 10px; font-weight: 800; color: #7B5CE8; }
        .xp-bar { width: 60px; height: 4px; background: #2a2d40; border-radius: 4px; margin-top: 4px; overflow: hidden; }
        .xp-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #5738B0, #7B5CE8); border-radius: 4px; }
        
        /* ========= FIXED SEARCH BAR - MOBILE FRIENDLY ========= */
        .search-area {
            width: 100%;
            padding: 8px 16px 12px;
            box-sizing: border-box;
        }
        .search-wrapper {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1e2030;
            border: 1px solid rgba(123,92,232,0.5);
            border-radius: 30px;
            padding: 10px 16px;
            box-sizing: border-box;
        }
        .search-wrapper i {
            color: #7B5CE8;
            font-size: 16px;
            flex-shrink: 0;
        }
        .search-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 15px;
            outline: none;
            min-width: 0;  /* prevents overflow on mobile */
        }
        .search-wrapper input::placeholder {
            color: #6a6f8a;
        }
        .search-wrapper:focus-within {
            border-color: #7B5CE8;
            box-shadow: 0 0 0 2px rgba(123,92,232,0.2);
        }
        /* ========================================= */

        /* chips / filters */
        .chip-slider {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 0 16px 12px;
            scrollbar-width: none;
        }
        .chip-slider::-webkit-scrollbar { display: none; }
        .chip {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
            color: #94a3b8;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }
        .chip.active {
            background: #5738B0;
            color: white;
            border-color: #5738B0;
        }
        /* sort bar */
        .sort-bar {
            display: flex;
            gap: 12px;
            padding: 8px 16px;
            overflow-x: auto;
        }
        .sort-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.06);
            color: #94a3b8;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .sort-btn.active {
            background: rgba(87,56,176,0.2);
            color: #7B5CE8;
            border-color: #7B5CE8;
        }
        /* poll cards */
        .poll-feed {
            padding: 8px 16px 20px;
        }
        .poll-card {
            background: #1a1c22;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 14px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .poll-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }
        .badge {
            font-size: 10px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
        }
        .badge.hot { background: rgba(255,74,110,0.15); color: #ff4a6e; }
        .badge.new { background: rgba(0,229,160,0.1); color: #00e5a0; }
        .badge.image { background: rgba(87,56,176,0.15); color: #7B5CE8; }
        .creator {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .creator img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
        }
        .creator-name { font-weight: 700; font-size: 14px; }
        .creator-time { font-size: 11px; color: #94a3b8; }
        .poll-question {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 14px;
        }
        .opt-btn {
            width: 100%;
            text-align: left;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 8px;
            color: white;
            font-weight: 500;
            cursor: pointer;
        }
        .result-bar {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            margin-bottom: 8px;
            position: relative;
            height: 44px;
            overflow: hidden;
        }
        .result-fill {
            height: 100%;
            background: linear-gradient(90deg, #5738B0, #7B5CE8);
            opacity: 0.3;
            width: 0%;
            transition: width 0.5s;
        }
        .result-text {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            font-size: 13px;
            font-weight: 600;
        }
        .poll-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .action-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 12px;
            border-radius: 30px;
            cursor: pointer;
        }
        .action-btn.liked { color: #ff4a6e; }
        .action-btn.bookmarked { color: #FFB800; }
        /* fab */
        .fab {
            position: fixed;
            bottom: 100px;
            right: 20px;
            width: 56px;
            height: 56px;
            background: #5738B0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            cursor: pointer;
            z-index: 99;
        }
        /* bottom nav - matching index.html */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: #161c24;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            border-radius: 25px 25px 0 0;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
            z-index: 200;
        }
        .nav-item {
            text-decoration: none;
            color: #94a3b8;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            font-weight: 600;
            transition: 0.2s;
        }
        .nav-item svg { width: 24px; height: 24px; fill: currentColor; }
        .nav-item.active { color: #5738B0; }
        .nav-item:active { transform: scale(0.9); }
        /* modal, drawer, etc (simplified but functional) */
        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(12px);
            z-index: 1000; display: none; align-items: flex-end; justify-content: center;
        }
        .overlay.show { display: flex; }
        .modal-card {
            background: #1a1c22; width: 100%; max-width: 500px; border-radius: 24px 24px 0 0;
            padding: 24px 20px 40px; max-height: 85vh; overflow-y: auto;
        }
        .modal-handle { width: 40px; height: 4px; background: #333; border-radius: 4px; margin: 0 auto 20px; }
        .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 16px; }
        .custom-input {
            width: 100%; background: #1e2028; border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px; padding: 14px; color: white; margin-bottom: 12px;
        }
        .type-toggle { display: flex; gap: 10px; margin-bottom: 16px; }
        .type-btn {
            flex: 1; padding: 10px; border-radius: 30px; background: rgba(255,255,255,0.05);
            border: none; color: #94a3b8; font-weight: 600; cursor: pointer;
        }
        .type-btn.active { background: #5738B0; color: white; }
        .expiry-row { display: flex; gap: 10px; margin-bottom: 16px; }
        .expiry-chip {
            flex: 1; text-align: center; padding: 8px; background: rgba(255,255,255,0.05);
            border-radius: 30px; font-size: 12px; font-weight: 600; cursor: pointer;
        }
        .expiry-chip.active { background: #5738B0; color: white; }
        .publish-btn {
            width: 100%; background: #5738B0; border: none; padding: 14px; border-radius: 30px;
            color: white; font-weight: 800; margin-top: 10px; cursor: pointer;
        }
        .toast {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: #1e1e2a; padding: 10px 20px; border-radius: 40px; color: white;
            font-size: 13px; z-index: 2000; opacity: 0; transition: 0.2s; pointer-events: none;
        }
        .toast.show { opacity: 1; bottom: 100px; }
        .empty-state { text-align: center; padding: 40px; color: #94a3b8; }
        .skeleton { background: linear-gradient(90deg, #1a1c22 25%, #22253a 50%, #1a1c22 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .comment-drawer, .bookmark-drawer, .voters-drawer { /* basic styles - keep from original but not essential for search fix */ }
    </style>
</head>

<!-- Create Poll Modal -->
<div id="createPollModal" class="overlay">

<div id="toastMsg" class="toast"></div>

<script type="module">
    // Firebase imports and full logic (same as your original working version)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, getDoc, deleteDoc, updateDoc, arrayUnion, arrayRemove, serverTimestamp, query, orderBy, increment, Timestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDLd3TW-y89lwShUmcIHw3YGzDjo4cg3y4",
        authDomain: "animea2z.firebaseapp.com",
        projectId: "animea2z",
        storageBucket: "animea2z.firebasestorage.app",
        messagingSenderId: "673605765684",
        appId: "1:673605765684:web:a6f851e0d79836b79b1861"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let allPolls = [];
    let currentFilter = "all";
    let currentSort = "new";
    let activeExpiryHours = 1;
    let pollType = "text";
    let bookmarkIds = new Set();

    const feed = document.getElementById("pollFeed");
    const searchInput = document.getElementById("searchPoll");

    function showToast(msg) {
        const toast = document.getElementById("toastMsg");
        toast.textContent = msg;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2500);
    }

    onAuthStateChanged(auth, user => {
        if (!user) window.location.href = "login.html";
        else {
            currentUser = user;
            loadBookmarks();
            loadPolls();
            loadUserXP();
            checkAdmin();
        }
    });

    async function checkAdmin() {
        const snap = await getDoc(doc(db, "users", currentUser.uid));
        if (snap.exists() && snap.data().customId === "1000000001") {
            document.getElementById("adminTab").style.display = "flex";
        }
    }

    async function loadUserXP() {
        onSnapshot(doc(db, "users", currentUser.uid), (s) => {
            if (s.exists()) {
                const xp = s.data().xp || 0;
                const level = Math.floor(xp / 100) + 1;
                document.getElementById("levelNum").innerText = level;
                document.getElementById("xpFill").style.width = (xp % 100) + "%";
            }
        });
    }

    function loadBookmarks() {
        const saved = localStorage.getItem("bookmarks_" + currentUser.uid);
        bookmarkIds = new Set(saved ? JSON.parse(saved) : []);
    }
    function saveBookmarks() {
        localStorage.setItem("bookmarks_" + currentUser.uid, JSON.stringify([...bookmarkIds]));
    }

    async function loadPolls() {
        const q = query(collection(db, "polls"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snap) => {
            allPolls = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            renderPolls();
        });
    }

    function renderPolls() {
        let filtered = [...allPolls];
        if (currentFilter === "text") filtered = filtered.filter(p => p.type === "text");
        else if (currentFilter === "image") filtered = filtered.filter(p => p.type === "image");
        else if (currentFilter === "bookmark") filtered = filtered.filter(p => bookmarkIds.has(p.id));

        if (currentSort === "hot") filtered.sort((a,b) => ((b.likes?.length||0)+(b.totalVotes||0)) - ((a.likes?.length||0)+(a.totalVotes||0)));
        else if (currentSort === "votes") filtered.sort((a,b) => (b.totalVotes||0) - (a.totalVotes||0));
        else filtered.sort((a,b) => (b.createdAt?.toMillis()||0) - (a.createdAt?.toMillis()||0));

        const searchTerm = searchInput.value.toLowerCase();
        if (searchTerm) filtered = filtered.filter(p => p.question.toLowerCase().includes(searchTerm));

        if (filtered.length === 0) {
            feed.innerHTML = `<div class="empty-state"><i class="fa-regular fa-newspaper"></i><p>No polls found</p></div>`;
            return;
        }

        feed.innerHTML = "";
        filtered.forEach(poll => {
            const card = document.createElement("div");
            card.className = "poll-card";
            getDoc(doc(db, "users", poll.createdBy)).then(creatorSnap => {
                const creator = creatorSnap.data() || {};
                const isLiked = poll.likes?.includes(currentUser.uid);
                const isBookmarked = bookmarkIds.has(poll.id);
                const hasVoted = poll.votedUsers?.includes(currentUser.uid);
                const expired = poll.expiresAt?.toMillis() < Date.now();
                let optionsHtml = "";
                if (hasVoted || expired) {
                    const total = poll.totalVotes || 1;
                    const maxVotes = Math.max(...poll.options.map(o => o.votes));
                    poll.options.forEach(opt => {
                        const pct = Math.round((opt.votes / total) * 100);
                        const winnerClass = (opt.votes === maxVotes && maxVotes>0) ? "winner" : "";
                        optionsHtml += `
                            <div class="result-bar">
                                <div class="result-fill" style="width:${pct}%"></div>
                                <div class="result-text"><span>${opt.text}</span><span>${pct}%</span></div>
                            </div>`;
                    });
                } else {
                    poll.options.forEach((opt, idx) => {
                        optionsHtml += `<button class="opt-btn" data-opt-index="${idx}" data-poll-id="${poll.id}">${opt.text}</button>`;
                    });
                }
                card.innerHTML = `
                    <div class="poll-meta">
                        <span class="badge ${poll.type === 'image' ? 'image' : ''}">${poll.type === 'image' ? '📷 Image' : '📝 Text'}</span>
                        ${poll.likes?.length > 10 ? '<span class="badge hot">🔥 Hot</span>' : ''}
                        ${expired ? '<span class="badge">🔒 Ended</span>' : ''}
                    </div>
                    <div class="creator">
                        <img src="${creator.avatar || 'https://via.placeholder.com/36'}">
                        <div><div class="creator-name">${creator.username || 'AnimeFan'}</div><div class="creator-time">${timeAgo(poll.createdAt)}</div></div>
                    </div>
                    <div class="poll-question">${poll.question}</div>
                    <div class="options-area">${optionsHtml}</div>
                    <div class="poll-actions">
                        <div style="display:flex; gap:8px;">
                            <button class="action-btn like-btn ${isLiked ? 'liked' : ''}" data-poll-id="${poll.id}"><i class="fa-${isLiked ? 'solid' : 'regular'} fa-heart"></i> ${poll.likes?.length || 0}</button>
                            <button class="action-btn comment-btn" data-poll-id="${poll.id}"><i class="fa-regular fa-comment"></i> 0</button>
                            <button class="action-btn bookmark-btn ${isBookmarked ? 'bookmarked' : ''}" data-poll-id="${poll.id}"><i class="fa-${isBookmarked ? 'solid' : 'regular'} fa-bookmark"></i></button>
                        </div>
                        <button class="action-btn share-btn" data-poll-id="${poll.id}" data-question="${poll.question.replace(/'/g, "\\'")}"><i class="fa-solid fa-share-nodes"></i></button>
                    </div>
                `;
                feed.appendChild(card);
                // attach event listeners
                card.querySelectorAll(".opt-btn").forEach(btn => {
                    btn.addEventListener("click", (e) => {
                        const idx = parseInt(btn.dataset.optIndex);
                        castVote(poll.id, idx);
                    });
                });
                card.querySelector(".like-btn")?.addEventListener("click", (e) => {
                    e.stopPropagation();
                    likePoll(poll.id);
                });
                card.querySelector(".bookmark-btn")?.addEventListener("click", (e) => {
                    e.stopPropagation();
                    toggleBookmark(poll.id);
                });
                card.querySelector(".share-btn")?.addEventListener("click", (e) => {
                    sharePoll(poll.id, poll.question);
                });
                onSnapshot(collection(db, `polls/${poll.id}/comments`), (snap) => {
                    const commentSpan = card.querySelector(".comment-btn span");
                    if (commentSpan) commentSpan.innerText = snap.size;
                });
            });
        });
    }

    async function castVote(pollId, optionIndex) {
        const ref = doc(db, "polls", pollId);
        const snap = await getDoc(ref);
        const data = snap.data();
        if (data.votedUsers?.includes(currentUser.uid)) {
            showToast("You already voted!");
            return;
        }
        const newOptions = [...data.options];
        newOptions[optionIndex].votes += 1;
        await updateDoc(ref, {
            options: newOptions,
            totalVotes: increment(1),
            votedUsers: arrayUnion(currentUser.uid)
        });
        await updateDoc(doc(db, "users", currentUser.uid), { xp: increment(15) });
        showToast("Voted! +15 XP");
    }

    async function likePoll(pollId) {
        const ref = doc(db, "polls", pollId);
        const snap = await getDoc(ref);
        const liked = snap.data().likes?.includes(currentUser.uid);
        if (liked) {
            await updateDoc(ref, { likes: arrayRemove(currentUser.uid) });
        } else {
            await updateDoc(ref, { likes: arrayUnion(currentUser.uid) });
            await updateDoc(doc(db, "users", currentUser.uid), { xp: increment(5) });
            showToast("Liked! +5 XP");
        }
    }

    function toggleBookmark(pollId) {
        if (bookmarkIds.has(pollId)) {
            bookmarkIds.delete(pollId);
            showToast("Removed from bookmarks");
        } else {
            bookmarkIds.add(pollId);
            showToast("Saved to bookmarks");
        }
        saveBookmarks();
        renderPolls();
    }

    function sharePoll(pollId, question) {
        if (navigator.share) {
            navigator.share({ title: "Anime Poll", text: question, url: window.location.href });
        } else {
            navigator.clipboard.writeText(window.location.href);
            showToast("Link copied!");
        }
    }

    function timeAgo(timestamp) {
        if (!timestamp) return "Just now";
        const seconds = Math.floor((Date.now() - timestamp.toMillis()) / 1000);
        if (seconds < 60) return "Just now";
        const mins = Math.floor(seconds / 60);
        if (mins < 60) return mins + "m ago";
        const hours = Math.floor(mins / 60);
        if (hours < 24) return hours + "h ago";
        return Math.floor(hours / 24) + "d ago";
    }

    // Event listeners for filters, sort, search
    document.querySelectorAll(".chip").forEach(chip => {
        chip.addEventListener("click", () => {
            document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
            chip.classList.add("active");
            currentFilter = chip.dataset.filter;
            renderPolls();
        });
    });
    document.querySelectorAll(".sort-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            document.querySelectorAll(".sort-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            currentSort = btn.dataset.sort;
            renderPolls();
        });
    });
    searchInput.addEventListener("input", () => renderPolls());

    // Create poll modal logic
    const createBtn = document.getElementById("createPollBtn");
    const modal = document.getElementById("createPollModal");
    const optionsContainer = document.getElementById("optionsContainer");
    const typeBtns = document.querySelectorAll("[data-poll-type]");
    const expiryChips = document.querySelectorAll(".expiry-chip");
    const publishBtn = document.getElementById("publishPollBtn");

    function closeModal() { modal.classList.remove("show"); }
    window.closeModal = closeModal;
    createBtn.onclick = () => {
        pollType = "text";
        updateOptionsUI();
        modal.classList.add("show");
    };
    typeBtns.forEach(btn => {
        btn.addEventListener("click", () => {
            typeBtns.forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            pollType = btn.dataset.pollType;
            updateOptionsUI();
        });
    });
    expiryChips.forEach(chip => {
        chip.addEventListener("click", () => {
            expiryChips.forEach(c => c.classList.remove("active"));
            chip.classList.add("active");
            activeExpiryHours = parseInt(chip.dataset.hours);
        });
    });
    function updateOptionsUI() {
        optionsContainer.innerHTML = "";
        const count = pollType === "text" ? 4 : 2;
        for (let i = 0; i < count; i++) {
            const input = document.createElement("input");
            input.type = "text";
            input.placeholder = pollType === "text" ? `Option ${i+1}` : `Choice ${i+1} (text)`;
            input.className = "custom-input";
            optionsContainer.appendChild(input);
        }
        if (pollType === "image") {
            const note = document.createElement("p");
            note.style.fontSize = "12px";
            note.style.color = "#aaa";
            note.innerText = "Image polls require image upload – coming soon. For now use text options.";
            optionsContainer.appendChild(note);
        }
    }
    publishBtn.onclick = async () => {
        const question = document.getElementById("pollQuestion").value.trim();
        if (!question) return showToast("Enter a question");
        const optionInputs = optionsContainer.querySelectorAll("input[type='text']");
        const options = [];
        for (let inp of optionInputs) {
            const val = inp.value.trim();
            if (val) options.push({ text: val, votes: 0 });
        }
        if (options.length < 2) return showToast("At least 2 options needed");
        const expiresAt = Timestamp.fromMillis(Date.now() + activeExpiryHours * 3600000);
        try {
            await addDoc(collection(db, "polls"), {
                question,
                type: pollType,
                options,
                totalVotes: 0,
                votedUsers: [],
                likes: [],
                createdBy: currentUser.uid,
                createdAt: serverTimestamp(),
                expiresAt
            });
            await updateDoc(doc(db, "users", currentUser.uid), { xp: increment(50) });
            showToast("Poll published! +50 XP");
            closeModal();
            document.getElementById("pollQuestion").value = "";
        } catch(e) { console.error(e); showToast("Error publishing"); }
    };
    updateOptionsUI();
</script>
</body>
</html>
