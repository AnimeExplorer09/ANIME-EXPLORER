<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c4dff">
<meta name="apple-mobile-web-app-capable" content="yes">

    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="components.css">
    <style>
        /* ═══════════ TOKENS ═══════════ */
        :root {
            --p:       #5738B0;
            --p-light: #7B5CE8;
            --p-dim:   rgba(87,56,176,0.15);
            --p-glow:  rgba(87,56,176,0.3);
            --bg:      #0b0c10;
            --bg1:     #111318;
            --bg2:     #161b22;
            --bg3:     #1d2128;
            --border:  rgba(255,255,255,0.06);
            --border2: rgba(255,255,255,0.10);
            --txt:     #ffffff;
            --txt2:    #8b949e;
            --txt3:    #4a5568;
            --green:   #00c853;
            --nav-h:   70px;
        }

        /* ═══════════ RESET ═══════════ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 0; }
        body {
            background: var(--bg);
            color: var(--txt);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ═══════════ SEARCH BAR ═══════════ */
        .search-container {
            padding: 12px 16px;
            background: var(--bg1);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg3);
            padding: 11px 15px;
            border-radius: 14px;
            border: 1px solid var(--border2);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-box:focus-within {
            border-color: var(--p);
            box-shadow: 0 0 0 3px var(--p-dim);
        }
        .search-box i { color: var(--txt3); font-size: 14px; }
        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--txt);
            margin-left: 10px;
            font-size: 14px;
            outline: none;
        }
        .search-box input::placeholder { color: var(--txt3); }

        /* ═══════════ SEARCH OVERLAY ═══════════ */
        #searchOverlay {
            position: absolute;
            top: 120px; /* below search+tabs */
            left: 0; right: 0;
            bottom: var(--nav-h);
            background: var(--bg);
            z-index: 1500;
            display: none;
            overflow-y: auto;
            padding: 10px 16px;
        }

        /* ═══════════ TABS ═══════════ */
        .tabs {
            display: flex;
            padding: 10px 16px;
            gap: 10px;
            background: var(--bg1);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .tab-btn {
            flex: 1;
            padding: 11px 10px;
            border: 1px solid var(--border2);
            border-radius: 14px;
            background: var(--bg3);
            color: var(--txt2);
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s, color 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        .tab-btn.active {
            background: var(--p);
            color: #fff;
            border-color: var(--p);
            box-shadow: 0 4px 16px var(--p-glow);
        }
        .tab-btn:active { transform: scale(0.96); }

        /* ═══════════ LISTS ═══════════ */
        #directArea, #groupsArea {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px 90px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* ═══════════ ITEM CARD ═══════════ */
        .item-card {
            display: flex;
            align-items: center;
            padding: 13px 14px;
            background: var(--bg2);
            border-radius: 18px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            position: relative;
            overflow: hidden;
        }
        .item-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: var(--p);
            opacity: 0;
            transition: opacity 0.2s;
            border-radius: 0 2px 2px 0;
        }
        .item-card:active { background: var(--bg3); border-color: var(--p); }
        .item-card:active::before { opacity: 1; }

        .pfp {
            width: 46px; height: 46px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--p);
            flex-shrink: 0;
        }
        .pfp-letter {
            width: 46px; height: 46px;
            border-radius: 50%;
            background: var(--p-dim);
            border: 2px solid var(--p);
            display: flex; align-items: center; justify-content: center;
            color: var(--p-light);
            font-size: 18px; font-weight: 800;
            flex-shrink: 0;
        }

        .meta {
            flex: 1;
            margin-left: 12px;
            overflow: hidden;
        }
        .meta h4 {
            font-size: 14px; font-weight: 700;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            margin-bottom: 3px;
        }
        .meta p {
            font-size: 11px;
            color: var(--txt2);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .meta-badge {
            font-size: 10px; color: var(--txt3);
            background: var(--bg3);
            padding: 2px 8px; border-radius: 8px;
            border: 1px solid var(--border);
            display: inline-block; margin-top: 3px;
        }

        /* ═══════════ ACTION BUTTONS ═══════════ */
        .action-btn {
            padding: 7px 16px;
            border-radius: 10px;
            border: none;
            color: white;
            font-size: 12px; font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .action-btn:active { transform: scale(0.94); }
        .follow-btn { background: var(--p); box-shadow: 0 3px 10px var(--p-glow); }
        .join-btn   { background: var(--green); box-shadow: 0 3px 10px rgba(0,200,83,0.3); }
        .joined-btn { background: var(--bg3); color: var(--txt3); cursor: default; border: 1px solid var(--border2); }

        /* ═══════════ EMPTY STATE ═══════════ */
        .empty-state {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 50px 20px; gap: 12px;
            color: var(--txt3);
        }
        .empty-state i { font-size: 40px; color: var(--p-dim); }
        .empty-state p { font-size: 13px; text-align: center; }

        /* ═══════════ FAB ═══════════ */
        .fab {
            position: fixed;
            bottom: calc(var(--nav-h) + 16px);
            right: 18px;
            width: 50px; height: 50px;
            background: var(--p);
            border-radius: 50%;
            display: none;
            align-items: center; justify-content: center;
            color: white; font-size: 20px;
            border: none;
            box-shadow: 0 6px 20px var(--p-glow);
            z-index: 99;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .fab:active { transform: scale(0.9); }

        /* ═══════════ BOTTOM NAV (FIXED - MATCH INDEX.HTML) ═══════════ */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: #161c24 !important;
            border-top: 1px solid rgba(255,255,255,0.05) !important;
            border-radius: 25px 25px 0 0;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
            padding-bottom: env(safe-area-inset-bottom);
            z-index: 2000;
        }
        .nav-item {
            text-decoration: none;
            color: #94a3b8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            gap: 4px;
            transition: 0.2s ease;
        }
        .nav-item svg, .nav-item i {
            width: 24px;
            height: 24px;
            font-size: 20px;
        }
        .nav-item span {
            font-size: 10px;
            font-weight: 600;
        }
        .nav-item.active {
            color: #5738B0;
        }
        .nav-item:active {
            transform: scale(0.9);
        }

        /* ═══════════ CHAT SCREEN ═══════════ */
        #chatScreen {
            position: fixed; inset: 0;
            background: var(--bg);
            z-index: 2500;
            display: none;
            flex-direction: column;
        }
        #chatScreen.active { display: flex; }

        .chat-header {
            padding: 12px 16px;
            background: var(--bg1);
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            gap: 4px;
        }
        .chat-back-btn {
            width: 38px; height: 38px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 12px; cursor: pointer;
            color: var(--txt2); font-size: 18px;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .chat-back-btn:active { background: var(--bg3); }

        .chat-header-info { flex: 1; margin-left: 6px; overflow: hidden; }
        .chat-header-name { font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-header-sub  { font-size: 11px; color: var(--p-light); margin-top: 1px; }

        /* ═══════════ MESSAGE LIST ═══════════ */
        .msg-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* ═══════════ BUBBLE ═══════════ */
        .bubble-container {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            max-width: 85%;
        }
        .bubble-container.me-align  { align-self: flex-end;  flex-direction: row-reverse; }
        .bubble-container.other-align { align-self: flex-start; flex-direction: row; }

        .chat-pfp-tiny {
            width: 28px; height: 28px;
            border-radius: 50%; object-fit: cover;
            border: 1.5px solid var(--p);
            flex-shrink: 0;
        }

        .bubble {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14px; line-height: 1.5;
            max-width: 100%;
            word-break: break-word;
        }
        .me {
            background: var(--p);
            border-bottom-right-radius: 4px;
            color: #fff;
        }
        .other {
            background: var(--bg3);
            border-top-left-radius: 4px;
            border: 1px solid var(--border2);
        }

        .sender-info {
            display: flex; align-items: center; gap: 5px;
            margin-bottom: 4px; font-size: 11px; font-weight: 700;
        }
        .lvl-tag {
            background: linear-gradient(135deg, #ffd700, #ff9800);
            color: #000;
            padding: 1px 6px; border-radius: 5px;
            font-size: 9px; font-weight: 800;
        }

        /* Date divider */
        .date-divider {
            align-self: center;
            font-size: 10px; color: var(--txt3);
            background: var(--bg2);
            border: 1px solid var(--border);
            padding: 3px 12px; border-radius: 10px;
            margin: 8px 0;
        }

        /* ═══════════ INPUT BAR ═══════════ */
        .input-bar {
            padding: 12px 16px 28px;
            background: var(--bg1);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
        }
        .input-attach {
            width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 12px; cursor: pointer;
            color: var(--p-light); font-size: 22px;
            flex-shrink: 0; transition: background 0.2s;
        }
        .input-attach:active { background: var(--p-dim); }

        .input-bar input[type="text"] {
            flex: 1;
            background: var(--bg3);
            border: 1px solid var(--border2);
            border-radius: 14px;
            padding: 11px 16px;
            color: var(--txt);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-bar input[type="text"]:focus {
            border-color: var(--p);
            box-shadow: 0 0 0 3px var(--p-dim);
        }
        .input-bar input[type="text"]::placeholder { color: var(--txt3); }

        .send-btn {
            width: 42px; height: 42px;
            background: var(--p);
            border: none; border-radius: 13px;
            color: white; font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; flex-shrink: 0;
            box-shadow: 0 4px 14px var(--p-glow);
            transition: 0.2s;
        }
        .send-btn:active { transform: scale(0.9); background: var(--p-light); }

        /* ═══════════ ONLINE DOT ═══════════ */
        .online-dot {
            width: 9px; height: 9px;
            background: var(--green);
            border-radius: 50%;
            border: 2px solid var(--bg1);
            position: absolute;
            bottom: 0; right: 0;
        }
        .pfp-wrap { position: relative; flex-shrink: 0; }
    </style>
</head>

    <!-- ══════════ ALL JS UNCHANGED ══════════ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, where, doc, getDocs, getDoc, setDoc, addDoc, serverTimestamp, orderBy, updateDoc, arrayUnion, arrayRemove, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyDLd3TW-y89lwShUmcIHw3YGzDjo4cg3y4", authDomain: "animea2z.firebaseapp.com", projectId: "animea2z", storageBucket: "animea2z.firebasestorage.app", messagingSenderId: "673605765684", appId: "1:673605765684:web:a6f851e0d79836b79b1861" };
        const app  = initializeApp(firebaseConfig);
        const db   = getFirestore(app);
        const auth = getAuth(app);

        let me = null, activeRoom = null, msgUnsub = null;

        onAuthStateChanged(auth, u => {
            if (u) { me = u; loadDirects(); loadGroups(); }
            else { window.location.href = "login.html"; }
        });

        window.setView = (v) => {
            document.getElementById('directArea').style.display = v === 'direct' ? 'flex' : 'none';
            document.getElementById('groupsArea').style.display = v === 'groups' ? 'flex' : 'none';
            document.getElementById('addGroupBtn').style.display = v === 'groups' ? 'flex' : 'none';
            document.getElementById('tDirect').classList.toggle('active', v === 'direct');
            document.getElementById('tGroups').classList.toggle('active', v === 'groups');
        };

        window.uploadImage = async (input) => {
            const file = input.files[0];
            if (!file || !activeRoom) return;
            const box = document.getElementById('typeBox');
            box.placeholder = "Uploading...";
            const fd = new FormData();
            fd.append('file', file);
            fd.append('upload_preset', 'anime_chat_preset');
            try {
                const res  = await fetch(`https://api.cloudinary.com/v1_1/dw2j3sgsd/image/upload`, { method: 'POST', body: fd });
                const data = await res.json();
                if (data.secure_url) {
                    const type     = document.getElementById('chatId').innerText === 'Public' ? 'groups' : 'chats';
                    const userDoc  = await getDoc(doc(db, "users", me.uid));
                    const userData = userDoc.data();
                    await addDoc(collection(db, type, activeRoom, "messages"), {
                        senderId: me.uid,
                        senderName: userData.username || "User",
                        senderImg: userData.avatar || "https://via.placeholder.com/50",
                        senderLevel: Math.floor((userData.xp || 0) / 100) + 1,
                        image: data.secure_url,
                        createdAt: serverTimestamp()
                    });
                }
            } catch (err) { alert("Upload failed!"); }
            box.placeholder = "Message...";
            input.value = "";
        };

        window.realtimeSearch = async (val) => {
            const overlay = document.getElementById('searchOverlay');
            if (val.length < 2) { overlay.style.display = 'none'; return; }
            overlay.style.display = 'block';
            const q      = query(collection(db, "users"), limit(15));
            const snap   = await getDocs(q);
            const myData = (await getDoc(doc(db, "users", me.uid))).data();
            const following = myData.following || [];
            overlay.innerHTML = '';
            snap.forEach(uDoc => {
                const u = uDoc.data();
                if (u.uid === me.uid) return;
                if (u.username.toLowerCase().includes(val.toLowerCase()) || (u.customId && u.customId.includes(val))) {
                    const isFollowing = following.includes(u.uid);
                    const div = document.createElement('div');
                    div.className = 'item-card';
                    div.style.marginBottom = '8px';
                    div.innerHTML = `
                        <div class="pfp-wrap" onclick="startChat('${u.uid}','${u.username}','${u.avatar}','${u.customId}')">
                            <img src="${u.avatar || 'https://via.placeholder.com/50'}" class="pfp">
                        </div>
                        <div class="meta" onclick="startChat('${u.uid}','${u.username}','${u.avatar}','${u.customId}')">
                            <h4>${u.username}</h4>
                            <p>ID: ${u.customId}</p>
                        </div>
                        <button class="action-btn follow-btn" onclick="toggleFollow('${u.uid}', ${isFollowing})"
                            style="${isFollowing ? 'background:#1d2128;color:#4a5568;box-shadow:none;border:1px solid rgba(255,255,255,0.08);' : ''}">
                            ${isFollowing ? 'Unfollow' : 'Follow'}
                        </button>`;
                    overlay.appendChild(div);
                }
            });
        };

        window.toggleFollow = async (uid, isFollowing) => {
            const myRef  = doc(db, "users", me.uid);
            const tRef   = doc(db, "users", uid);
            if (isFollowing) {
                await updateDoc(myRef, { following: arrayRemove(uid) });
                await updateDoc(tRef,  { followers: arrayRemove(me.uid) });
            } else {
                await updateDoc(myRef, { following: arrayUnion(uid) });
                await updateDoc(tRef,  { followers: arrayUnion(me.uid) });
            }
            realtimeSearch(document.getElementById('searchInput').value);
        };

        window.startChat = async (uid, name, pfp, cid) => {
            const rid    = [me.uid, uid].sort().join("_");
            const mySnap = await getDoc(doc(db, "users", me.uid));
            await setDoc(doc(db, "chats", rid), {
                participants: [me.uid, uid],
                lastMsg: "Connected",
                uData: {
                    [me.uid]: { name: mySnap.data().username, pfp: mySnap.data().avatar || "" },
                    [uid]:    { name, pfp: pfp || "", cid }
                },
                updated: serverTimestamp()
            }, { merge: true });
            document.getElementById('searchOverlay').style.display = 'none';
            openRoom(rid, name, pfp, cid, 'chats');
        };

        window.openRoom = (id, name, pfp, cid, type) => {
            activeRoom = id;
            document.getElementById('chatName').innerText = name;
            document.getElementById('chatPfp').src = pfp || 'https://via.placeholder.com/50';
            document.getElementById('chatId').innerText = cid === 'Group' ? 'Public' : 'ID: ' + cid;
            document.getElementById('chatScreen').classList.add('active');
            if (msgUnsub) msgUnsub();

            const q = query(collection(db, type, id, "messages"), orderBy("createdAt", "asc"));
            msgUnsub = onSnapshot(q, snap => {
                const stream = document.getElementById('msgStream');
                stream.innerHTML = '';
                snap.forEach(mDoc => {
                    const m    = mDoc.data();
                    const isMe = m.senderId === me.uid;
                    const div  = document.createElement('div');
                    div.className = `bubble-container ${isMe ? 'me-align' : 'other-align'}`;
                    div.innerHTML = `
                        ${!isMe ? `<img src="${m.senderImg || 'https://via.placeholder.com/50'}" class="chat-pfp-tiny">` : ''}
                        <div class="bubble ${isMe ? 'me' : 'other'}">
                            ${!isMe ? `<div class="sender-info">
                                <span style="color:var(--p-light)">${m.senderName || 'User'}</span>
                                <span class="lvl-tag">LVL ${m.senderLevel || 1}</span>
                            </div>` : ''}
                            ${m.image ? `<img src="${m.image}" style="width:100%;border-radius:12px;display:block;">` : m.text}
                        </div>`;
                    stream.appendChild(div);
                });
                stream.scrollTop = stream.scrollHeight;
            });
        };

        document.getElementById('sendBtn').onclick = async () => {
            const box  = document.getElementById('typeBox');
            const text = box.value.trim();
            if (!text || !activeRoom) return;
            try {
                const userDoc  = await getDoc(doc(db, "users", me.uid));
                const userData = userDoc.data();
                const type     = document.getElementById('chatId').innerText === 'Public' ? 'groups' : 'chats';
                await addDoc(collection(db, type, activeRoom, "messages"), {
                    senderId: me.uid,
                    senderName: userData.username || "User",
                    senderImg: userData.avatar || "https://via.placeholder.com/50",
                    senderLevel: Math.floor((userData.xp || 0) / 100) + 1,
                    text,
                    createdAt: serverTimestamp()
                });
                if (type === 'chats') await updateDoc(doc(db, "chats", activeRoom), { lastMsg: text, updated: serverTimestamp() });
                box.value = '';
            } catch (err) { console.error("Send error:", err); }
        };

        // Enter key to send
        document.getElementById('typeBox').addEventListener('keypress', e => {
            if (e.key === 'Enter') document.getElementById('sendBtn').click();
        });

        window.joinGroup = async (gid) => {
            await updateDoc(doc(db, "groups", gid), { members: arrayUnion(me.uid) });
        };

        window.createGroup = async () => {
            const n = prompt("Group Name:");
            if (n) await addDoc(collection(db, "groups"), { name: n, members: [me.uid], createdAt: serverTimestamp() });
        };

        function loadDirects() {
            onSnapshot(query(collection(db, "chats"), where("participants", "array-contains", me.uid)), snap => {
                const area = document.getElementById('directArea');
                if (snap.empty) {
                    area.innerHTML = `<div class="empty-state"><i class="fa-solid fa-paper-plane"></i><p>No conversations yet.<br>Search a user to start chatting.</p></div>`;
                    return;
                }
                area.innerHTML = '';
                snap.forEach(d => {
                    const data    = d.data();
                    const otherId = data.participants.find(i => i !== me.uid);
                    const other   = data.uData[otherId];
                    const div     = document.createElement('div');
                    div.className = 'item-card';
                    div.innerHTML = `
                        <div class="pfp-wrap">
                            <img src="${other.pfp || 'https://via.placeholder.com/50'}" class="pfp">
                        </div>
                        <div class="meta">
                            <h4>${other.name}</h4>
                            <p>${data.lastMsg}</p>
                        </div>
                        <i class="fa-solid fa-chevron-right" style="color:var(--txt3);font-size:12px;flex-shrink:0;"></i>`;
                    div.onclick = () => openRoom(d.id, other.name, other.pfp, other.cid, 'chats');
                    area.appendChild(div);
                });
            });
        }

        function loadGroups() {
            onSnapshot(collection(db, "groups"), snap => {
                const area = document.getElementById('groupsArea');
                area.innerHTML = '';
                snap.forEach(d => {
                    const g       = d.data();
                    const gid     = d.id;
                    const members = g.members || [];
                    const isMember = members.includes(me.uid);
                    const div     = document.createElement('div');
                    div.className = 'item-card';
                    div.innerHTML = `
                        <div class="pfp-letter">${g.name[0].toUpperCase()}</div>
                        <div class="meta">
                            <h4>${g.name}</h4>
                            <p>${members.length} member${members.length !== 1 ? 's' : ''}</p>
                        </div>
                        ${isMember
                            ? `<button class="action-btn joined-btn">Joined</button>`
                            : `<button class="action-btn join-btn" onclick="joinGroup('${gid}')">Join</button>`}`;
                    div.onclick = (e) => {
                        if (e.target.tagName !== 'BUTTON') {
                            if (isMember) openRoom(gid, g.name, '', 'Group', 'groups');
                            else alert("Please join the group first!");
                        }
                    };
                    area.appendChild(div);
                });
            });
        }

        window.closeChat = () => document.getElementById('chatScreen').classList.remove('active');
    </script>
</body>
</html>
