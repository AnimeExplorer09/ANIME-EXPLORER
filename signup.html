<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Signup - AnimeExplorer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c4dff">
<meta name="apple-mobile-web-app-capable" content="yes">

    <style>
        :root {
            --primary: #7c4dff;
            --primary-glow: rgba(124,77,255,0.5);
            --bg-dark: #050507;
            --glass-bg: rgba(255,255,255,0.03);
            --glass-border: rgba(255,255,255,0.08);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body, html {
            width:100%; height:100%;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-dark);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bg-container { position:fixed; inset:0; background:radial-gradient(circle at 50% 50%, #12121c 0%, #050507 100%); z-index:-1; }
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 35px;
            padding: 40px;
            width: 90%;
            max-width: 420px;
            text-align: center;
        }
        .brand-logo { font-size: 32px; font-weight:800; margin-bottom:30px; }
        .auth-form { display:flex; flex-direction:column; gap:16px; }
        .input-group { position:relative; }
        .input-group i { position:absolute; left:18px; top:50%; transform:translateY(-50%); color:rgba(255,255,255,0.3); }
        .input-group input {
            width:100%; padding:15px 15px 15px 50px;
            background:rgba(255,255,255,0.04);
            border:1px solid transparent;
            border-radius:16px;
            color:white;
            outline:none;
        }
        .input-group input:focus { border-color:var(--primary); }
        .signup-btn {
            background:var(--primary); color:white; border:none; padding:16px;
            border-radius:16px; font-weight:700; cursor:pointer;
            width:100%;
            margin-top:10px;
        }
        #status { margin-top:15px; font-size:13px; }
        .error { color:#ff6b6b; }
        .success { color:#4caf50; }
        .info-box {
            background:rgba(124,77,255,0.15);
            border:1px solid rgba(124,77,255,0.3);
            border-radius:16px;
            padding:16px;
            margin-top:20px;
            display:none;
        }
        .footer-link { margin-top:20px; font-size:14px; color:#888; }
        .footer-link a { color:var(--primary); }
    </style>
</head>
<body>
<div class="bg-container"></div>
<div class="card">
    <div class="brand-logo">AnimeExplorer</div>
    <div id="signupForm">
        <div class="auth-form">
            <div class="input-group"><i class="fas fa-user"></i><input type="text" id="username" placeholder="Full Name"></div>
            <div class="input-group"><i class="fas fa-envelope"></i><input type="email" id="email" placeholder="Email Address"></div>
            <div class="input-group"><i class="fas fa-lock"></i><input type="password" id="password" placeholder="Password (6+ chars)"></div>
            <div class="input-group"><i class="fas fa-lock"></i><input type="password" id="confirmPassword" placeholder="Confirm Password"></div>
            <button id="signupBtn" class="signup-btn">Create Account</button>
        </div>
        <p id="status"></p>
        <div class="info-box" id="infoBox">
            <i class="fa-solid fa-envelope"></i> Verification email sent to <b id="infoEmail"></b>. Please check inbox/spam and click the link to verify.
        </div>
        <div class="footer-link">Already have an account? <a href="login.html">Login</a></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, sendEmailVerification, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDLd3TW-y89lwShUmcIHw3YGzDjo4cg3y4",
        authDomain: "animea2z.firebaseapp.com",
        projectId: "animea2z",
        storageBucket: "animea2z.firebasestorage.app",
        messagingSenderId: "673605765684",
        appId: "1:673605765684:web:a6f851e0d79836b79b1861"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById('signupBtn').onclick = async () => {
        const name = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const pass = document.getElementById('password').value;
        const confirm = document.getElementById('confirmPassword').value;
        const status = document.getElementById('status');

        if (!name || !email || pass.length < 6) {
            status.innerText = "Fill all fields (Password min 6 chars)";
            status.className = "error";
            return;
        }
        if (pass !== confirm) {
            status.innerText = "Passwords do not match!";
            status.className = "error";
            return;
        }

        const btn = document.getElementById('signupBtn');
        btn.disabled = true;
        btn.innerText = "Creating...";

        try {
            // 1. Create Firebase Auth user
            const cred = await createUserWithEmailAndPassword(auth, email, pass);
            const user = cred.user;

            // 2. Set display name (will be used later when Firestore doc is created)
            await updateProfile(user, { displayName: name });

            // 3. Send verification email
            await sendEmailVerification(user);

            // 4. Show success message
            document.getElementById('infoEmail').innerText = email;
            document.getElementById('infoBox').style.display = 'block';
            status.innerText = "Verification email sent! Please verify and then login.";
            status.className = "success";
            document.querySelector('.auth-form').style.display = 'none';
            btn.style.display = 'none';

            setTimeout(() => {
                window.location.href = "login.html";
            }, 5000);
        } catch (err) {
            btn.disabled = false;
            btn.innerText = "Create Account";
            status.innerText = err.message;
            status.className = "error";
            console.error(err);
        }
    };
</script>
</body>
</html>
