<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Join - AnimeExplorer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #7c4dff;
            --primary-glow: rgba(124, 77, 255, 0.5);
            --accent: #00e5ff;
            --bg-dark: #050507;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%; height: 100%;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: white;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        .bg-container {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at 50% 50%, #12121c 0%, #050507 100%);
        }

        .blob {
            position: absolute; width: 450px; height: 450px;
            background: var(--primary);
            filter: blur(120px); border-radius: 50%; opacity: 0.15;
            animation: move 20s infinite alternate;
        }
        .blob-2 { background: var(--accent); animation-duration: 15s; right: -100px; top: -100px; }

        @keyframes move {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-100px, 150px) scale(1.2); }
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 35px;
            padding: 45px 40px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
            animation: cardEntrance 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-logo {
            font-size: 32px; font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #b39dff 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .subtitle { color: rgba(255,255,255,0.4); font-size: 14px; margin-bottom: 30px; }

        .auth-form { display: flex; flex-direction: column; gap: 16px; }

        .input-group { position: relative; text-align: left; }
        .input-group i.field-icon {
            position: absolute; left: 18px; top: 50%;
            transform: translateY(-50%); color: rgba(255,255,255,0.3);
            font-size: 14px; pointer-events: none;
        }

        .input-group input {
            width: 100%; padding: 15px 15px 15px 50px;
            background: rgba(255,255,255,0.04);
            border: 1px solid transparent; border-radius: 16px;
            color: white; font-size: 14px; transition: 0.4s;
            outline: none; font-family: inherit;
        }
        .input-group input::placeholder { color: rgba(255,255,255,0.25); }
        .input-group input:focus {
            background: rgba(255,255,255,0.08);
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(124, 77, 255, 0.2);
        }

        .eye-btn {
            position: absolute; right: 16px; top: 50%;
            transform: translateY(-50%);
            background: none; border: none;
            color: rgba(255,255,255,0.3);
            cursor: pointer; font-size: 14px; padding: 4px;
        }

        .signup-btn {
            background: var(--primary);
            color: white; border: none; padding: 16px;
            border-radius: 16px; font-weight: 700; font-size: 16px;
            cursor: pointer; transition: 0.3s;
            box-shadow: 0 10px 20px var(--primary-glow);
            margin-top: 10px; font-family: inherit; width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .signup-btn:active { transform: scale(0.98); }
        .signup-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn-spinner {
            display: none; width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white; border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #status {
            margin-top: 18px; font-size: 13px; font-weight: 500; min-height: 20px;
        }
        #status.error   { color: #ff6b6b; }
        #status.info    { color: #b39dff; }
        #status.success { color: #4caf50; }

        /* OTP Screen */
        .otp-screen { display: none; text-align: center; }
        .otp-icon { font-size: 50px; margin-bottom: 16px; }
        .otp-screen h3 { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
        .otp-screen p { color: rgba(255,255,255,0.5); font-size: 13px; line-height: 1.6; margin-bottom: 20px; }
        .otp-email { color: var(--primary); font-weight: 700; }

        .otp-input {
            width: 100%; padding: 18px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(124,77,255,0.4);
            border-radius: 16px; color: white;
            font-size: 24px; font-weight: 800;
            text-align: center; letter-spacing: 10px;
            outline: none; font-family: inherit;
            transition: 0.3s;
        }
        .otp-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(124,77,255,0.25);
            background: rgba(255,255,255,0.09);
        }

        .resend-link {
            margin-top: 14px; font-size: 13px;
            color: rgba(255,255,255,0.3);
        }
        .resend-link span {
            color: var(--primary); cursor: pointer;
            font-weight: 700;
        }
        .resend-link span.disabled { color: rgba(255,255,255,0.2); cursor: not-allowed; }

        #otpStatus {
            margin-top: 12px; font-size: 13px; font-weight: 600; min-height: 18px;
        }

        .footer-link {
            margin-top: 25px; font-size: 14px; color: rgba(255,255,255,0.4);
        }
        .footer-link a { color: var(--primary); text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>

<div class="bg-container">
    <div class="blob"></div>
    <div class="blob blob-2"></div>
</div>

<div class="card">
    <div class="brand-logo">AnimeExplorer</div>
    <p class="subtitle">Create an account to start exploring</p>

    <!-- ── SIGNUP FORM ── -->
    <div id="signupForm">
        <div class="auth-form">
            <div class="input-group">
                <input type="text" id="username" placeholder="Your Name">
                <i class="fas fa-user field-icon"></i>
            </div>
            <div class="input-group">
                <input type="email" id="email" placeholder="Email Address">
                <i class="fas fa-envelope field-icon"></i>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password (Min 6 chars)">
                <i class="fas fa-lock field-icon"></i>
                <button class="eye-btn" id="eyeBtn" type="button">
                    <i class="fa-regular fa-eye" id="eyeIcon"></i>
                </button>
            </div>
            <button id="signupBtn" class="signup-btn">
                <span id="btnText">Get Started</span>
                <div class="btn-spinner" id="btnSpinner"></div>
            </button>
        </div>

        <p id="status"></p>

        <div class="footer-link">
            Already have an account? <a href="login.html">Sign In</a>
        </div>
    </div>

    <!-- ── OTP VERIFY SCREEN ── -->
    <div class="otp-screen" id="otpScreen">
        <div class="otp-icon">📧</div>
        <h3>Check your email!</h3>
        <p>
            We sent a 6-digit code to<br>
            <span class="otp-email" id="otpEmailText"></span>
        </p>
        <input type="text" class="otp-input" id="otpInput"
               maxlength="6" placeholder="------"
               oninput="this.value = this.value.toUpperCase()">
        <button class="signup-btn" style="margin-top:16px;" onclick="verifyOTP()">
            <span id="verifyBtnText">Verify Account</span>
            <div class="btn-spinner" id="verifySpinner"></div>
        </button>
        <p id="otpStatus"></p>
        <div class="resend-link">
            Didn't receive? <span id="resendBtn" onclick="resendCode()">Resend Code</span>
        </div>
        <div class="footer-link" style="margin-top:16px;">
            <a href="login.html">← Back to Login</a>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDLd3TW-y89lwShUmcIHw3YGzDjo4cg3y4",
        authDomain: "animea2z.firebaseapp.com",
        projectId: "animea2z",
        storageBucket: "animea2z.firebasestorage.app",
        messagingSenderId: "673605765684",
        appId: "1:673605765684:web:a6f851e0d79836b79b1861"
    };

    // ── RESEND API KEY ──
    const RESEND_API_KEY = "re_3ddgYL8v_DyeM8fzSyNPLTwMbWoiVWDdh";

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    const signupBtn  = document.getElementById('signupBtn');
    const btnText    = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const status     = document.getElementById('status');
    const eyeBtn     = document.getElementById('eyeBtn');
    const eyeIcon    = document.getElementById('eyeIcon');
    const pwdInput   = document.getElementById('password');

    let currentEmail = '';
    let currentUID   = '';
    let resendCooldown = false;

    // Eye toggle
    eyeBtn.onclick = () => {
        const show = pwdInput.type === 'password';
        pwdInput.type = show ? 'text' : 'password';
        eyeIcon.className = show ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
    };

    // Enter key
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') signupBtn.click();
    });

    function setLoading(on) {
        signupBtn.disabled = on;
        btnText.style.display = on ? 'none' : 'inline';
        btnSpinner.style.display = on ? 'block' : 'none';
    }

    function setStatus(msg, type) {
        status.textContent = msg;
        status.className = type;
    }

    function setOtpStatus(msg, color) {
        const el = document.getElementById('otpStatus');
        el.textContent = msg;
        el.style.color = color;
    }

    // Generate 6-digit code
    function generateCode() {
        return Math.floor(100000 + Math.random() * 900000).toString();
    }

    // Resend se email bhejo
    async function sendOTPEmail(email, username, code) {
        const res = await fetch("https://api.resend.com/emails", {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${RESEND_API_KEY}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                from: "onboarding@resend.dev",
                to: email,
                subject: "Your AnimeExplorer Verification Code",
                html: `
                    <div style="font-family:sans-serif; max-width:400px; margin:auto; padding:30px; background:#0f1014; border-radius:16px; color:white;">
                        <h2 style="color:#7c4dff; margin-bottom:8px;">AnimeExplorer</h2>
                        <p style="color:#aaa;">Hi <b style="color:white;">${username}</b>, welcome!</p>
                        <p style="color:#aaa; margin-top:12px;">Your verification code is:</p>
                        <div style="font-size:36px; font-weight:900; letter-spacing:10px; color:#7c4dff; margin:20px 0; text-align:center; background:rgba(124,77,255,0.1); padding:16px; border-radius:12px;">
                            ${code}
                        </div>
                        <p style="color:#666; font-size:12px;">This code expires in 10 minutes. If you didn't sign up, ignore this email.</p>
                    </div>
                `
            })
        });
        return res.ok;
    }

    // Signup button
    signupBtn.addEventListener('click', async () => {
        const username = document.getElementById('username').value.trim();
        const email    = document.getElementById('email').value.trim();
        const password = pwdInput.value;

        if (!username || !email || !password) {
            setStatus("Please fill all fields", "error"); return;
        }
        if (password.length < 6) {
            setStatus("Password must be at least 6 characters", "error"); return;
        }

        setLoading(true);
        setStatus("Creating account...", "info");

        try {
            // 1. Firebase Auth
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;
            currentUID   = user.uid;
            currentEmail = email;

            // 2. Sequential ID
            let customId = Date.now().toString().slice(-7);
            try {
                customId = await runTransaction(db, async (transaction) => {
                    const counterRef = doc(db, "userCounter", "counter");
                    const counterDoc = await transaction.get(counterRef);
                    let nextId = 1000000001;
                    if (counterDoc.exists()) {
                        nextId = (counterDoc.data().count || 1000000000) + 1;
                    }
                    transaction.set(counterRef, { count: nextId });
                    return String(nextId);
                });
            } catch(e) { console.error("Counter:", e); }

            // 3. Firestore profile — isVerified: false
            await setDoc(doc(db, "users", user.uid), {
                uid: user.uid,
                customId,
                username,
                email,
                avatar: `https://ui-avatars.com/api/?name=${encodeURIComponent(username)}&background=7c4dff&color=fff`,
                xp: 0, coins: 0,
                isOnline: false,
                isVerified: false,
                isBanned: false,
                joinedAt: new Date().toLocaleDateString(),
                bio: "Anime fan on AnimeExplorer!",
                activeBorder: "", banner: "", lastClaim: ""
            });

            // 4. OTP generate + Firestore mein save karo
            const code = generateCode();
            await setDoc(doc(db, "verificationCodes", user.uid), {
                code,
                email,
                createdAt: new Date(),
                expiresAt: new Date(Date.now() + 10 * 60 * 1000), // 10 min
                verified: false
            });

            // 5. Email bhejo
            setStatus("Sending verification code...", "info");
            const sent = await sendOTPEmail(email, username, code);

            if (!sent) {
                setStatus("Failed to send email. Try again.", "error");
                setLoading(false);
                return;
            }

            // 6. OTP screen dikhao
            document.getElementById('signupForm').style.display = 'none';
            document.getElementById('otpEmailText').innerText = email;
            document.getElementById('otpScreen').style.display = 'block';

        } catch (error) {
            setLoading(false);
            const msg =
                error.code === 'auth/email-already-in-use' ? 'This email is already registered.' :
                error.code === 'auth/invalid-email'        ? 'Invalid email address.' :
                error.code === 'auth/weak-password'        ? 'Password is too weak.' :
                error.message;
            setStatus(msg, "error");
        }
    });

    // OTP Verify
    window.verifyOTP = async () => {
        const code = document.getElementById('otpInput').value.trim();
        if (code.length !== 6) {
            setOtpStatus("Enter 6-digit code", "#ff6b6b"); return;
        }

        const verifyBtn     = document.getElementById('verifyBtnText');
        const verifySpinner = document.getElementById('verifySpinner');
        verifyBtn.style.display    = 'none';
        verifySpinner.style.display = 'block';

        try {
            const snap = await getDoc(doc(db, "verificationCodes", currentUID));
            if (!snap.exists()) {
                setOtpStatus("Code expired. Resend karo.", "#ff6b6b");
                verifyBtn.style.display    = 'inline';
                verifySpinner.style.display = 'none';
                return;
            }

            const data = snap.data();

            // Expiry check
            if (new Date() > data.expiresAt.toDate()) {
                setOtpStatus("Code expired. Resend karo.", "#ff6b6b");
                verifyBtn.style.display    = 'inline';
                verifySpinner.style.display = 'none';
                return;
            }

            if (data.code === code) {
                // Verified!
                await updateDoc(doc(db, "verificationCodes", currentUID), { verified: true });
                await updateDoc(doc(db, "users", currentUID), { isVerified: true, isOnline: true });
                setOtpStatus("✓ Verified! Redirecting...", "#4caf50");
                setTimeout(() => window.location.href = "index.html", 1000);
            } else {
                setOtpStatus("❌ Wrong code. Try again.", "#ff6b6b");
                verifyBtn.style.display    = 'inline';
                verifySpinner.style.display = 'none';
            }
        } catch(e) {
            setOtpStatus("Error. Try again.", "#ff6b6b");
            verifyBtn.style.display    = 'inline';
            verifySpinner.style.display = 'none';
        }
    };

    // Resend code
    window.resendCode = async () => {
        if (resendCooldown) return;
        resendCooldown = true;

        const resendBtn = document.getElementById('resendBtn');
        resendBtn.classList.add('disabled');

        const username = document.getElementById('username')?.value || currentEmail.split('@')[0];
        const code = generateCode();

        try {
            await setDoc(doc(db, "verificationCodes", currentUID), {
                code,
                email: currentEmail,
                createdAt: new Date(),
                expiresAt: new Date(Date.now() + 10 * 60 * 1000),
                verified: false
            });
            await sendOTPEmail(currentEmail, username, code);
            setOtpStatus("New code sent! Check inbox.", "#4caf50");
        } catch(e) {
            setOtpStatus("Failed to resend. Try again.", "#ff6b6b");
        }

        // 60 second cooldown
        let secs = 60;
        resendBtn.textContent = `Resend (${secs}s)`;
        const timer = setInterval(() => {
            secs--;
            resendBtn.textContent = `Resend (${secs}s)`;
            if (secs <= 0) {
                clearInterval(timer);
                resendBtn.textContent = 'Resend Code';
                resendBtn.classList.remove('disabled');
                resendCooldown = false;
            }
        }, 1000);
    };
</script>
</body>
</html>
