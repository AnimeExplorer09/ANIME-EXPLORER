    <style>
        :root { --accent: #7c4dff; --bg-card: #16161e; --bg-dark: #0b0c10; --danger: #ff5252; }
        
        body { 
            background: var(--bg-dark); 
            color: #fff; 
            padding-bottom: 100px; 
            font-family: 'Inter', sans-serif; 
            margin: 0;
            overflow-x: hidden;
        }

        /* --- MODAL FIXES --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none; align-items: center; 
            justify-content: center; z-index: 6000; backdrop-filter: blur(5px);
        }
        .modal-overlay.show { display: flex; }
        
        .modal-box { 
            background: var(--bg-card); width: 90%; max-width: 400px; 
            padding: 25px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1); 
        }

        .modal-inp {
            width: 100%; background: #000; border: 1px solid #333;
            color: white; padding: 12px; border-radius: 12px; margin-bottom: 15px;
            box-sizing: border-box; outline: none;
        }

        /* --- UI COMPONENTS --- */
        .profile-header { width: 100%; position: relative; }
        .profile-banner { 
            width: 100%; height: 180px; 
            background: linear-gradient(to bottom, transparent 50%, var(--bg-dark)), #1a1a2e;
            background-size: cover; background-position: center;
        }
        
        .profile-info-wrap { 
            margin-top: -60px; display: flex; flex-direction: column; 
            align-items: center; position: relative; z-index: 10; 
        }

      .avatar-box {
    position: relative;
    width: 130px; /* Thoda bada space taaki border na kate */
    height: 130px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 5px;
}
        .profile-avatar {
    width: 90px !important;
    height: 90px !important;
    border-radius: 50% !important; /* Force circle */
    z-index: 5;
    position: relative;
    object-fit: cover; /* Photo kategi nahi, fit hogi */
    border: 3px solid var(--bg-dark) !important;
}
.anime-border-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%); 
    width: 125px !important; /* Photo se thoda bada */
    height: 125px !important;
    z-index: 10; /* Border photo ke upar aayega */
    pointer-events: none; /* Click photo pe ho sake */
    object-fit: contain;
    display: none; /* Default hidden */
}
       .lvl-tag-new {
    background: linear-gradient(90deg, #7c4dff, #b099ff); /* Purple Gradient */
    color: white;
    font-size: 10px;
    font-weight: 800;
    padding: 3px 12px;
    border-radius: 6px;
    margin-bottom: 8px; /* Name se thoda upar */
    display: inline-block;
    text-transform: uppercase;
    letter-spacing: 1px;
    box-shadow: 0 4px 10px rgba(124, 77, 255, 0.3);
}

        .user-name { font-size: 24px; font-weight: 800; margin: 0; color: white; }
        .id-container { 
            display: inline-flex; align-items: center; gap: 8px; 
            background: rgba(124,77,255,0.15); padding: 5px 12px;
            border-radius: 30px; margin-top: 8px; border: 1px solid rgba(124,77,255,0.3);
        }
        .id-val { font-size: 12px; color: #b099ff; font-family: monospace; font-weight: bold; }
        .copy-icon { color: #fff; cursor: pointer; font-size: 12px; opacity: 0.7; }

        .f-stats-row { 
    display: flex; 
    justify-content: center; /* Center alignment */
    gap: 40px; 
    margin: 15px 0; 
    width: 100%;
}

        .f-item { text-align: center; }
        .f-num { display: block; font-size: 18px; font-weight: 800; }
        .f-lab { font-size: 10px; color: #555; text-transform: uppercase; }

        .lvl-container { width: 100%; margin-top: 15px; background: var(--bg-card); padding: 15px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.03); box-sizing: border-box;}
        .lvl-info-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .lvl-text { font-size: 12px; font-weight: 700; color: #888; }
        .xp-needed { font-size: 11px; color: var(--accent); font-weight: 600; }
        .progress-bar-bg { width: 100%; height: 8px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #b099ff); width: 0%; transition: width 1s ease; }

        .main-content { padding: 0 20px; }
        .bio-box { background: var(--bg-card); padding: 18px; border-radius: 20px; text-align: center; font-size: 14px; color: #bbb; border: 1px solid rgba(255,255,255,0.03); }
        .joined-text { font-size: 11px; color: #444; margin-top: 10px; display: block; text-align: center; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .s-card { background: var(--bg-card); padding: 15px; border-radius: 18px; text-align: center; border-bottom: 2px solid var(--accent); }

        .social-bar { display: flex; justify-content: center; gap: 15px; margin: 20px 0; }
        .soc-link { width: 42px; height: 42px; background: var(--bg-card); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #444; border: 1px solid rgba(255,255,255,0.05); text-decoration: none; }
        .soc-link.active { color: var(--accent); border-color: var(--accent); }

        .btn-list { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .btn-wide { background: var(--bg-card); color: white; border: none; padding: 15px; border-radius: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; border: 1px solid rgba(255,255,255,0.02); width: 100%; }
        .btn-follow { background: var(--accent); width: 100%; height: 50px; border-radius: 15px; border: none; color: white; font-weight: 800; display: none; margin-bottom: 15px; cursor: pointer; }

        #cropperModal { position: fixed; inset: 0; background: #000; z-index: 7000; display: none; flex-direction: column; }
        .croppie-container { height: 80vh !important; }

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 80px;
    display: flex;
    justify-content: space-around;

    z-index: 2000; /* Chat screen (2500) ke niche rahega */

}

.nav-item:active {
    transform: scale(0.9);
}
/* Gold Badge Styling */
.badge-gold { 
    color: #FFD700; 
    margin-left: 8px; 
    font-size: 18px; 
    vertical-align: middle;
    filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.5));
}

.profile-avatar.verified-border {
    border: 4px solid #FFD700 !important;

}
/* --- CLEAN MINIMALIST STORE ICON --- */
.store-header-btn {

}

.store-header-btn i {
    font-size: 20px;

    /* Glow aur shadow puri tarah hata di gayi hai */
    text-shadow: none;
}

.store-header-btn:active i {
    transform: scale(0.85);
    color: #fff; /* Click karne par white hoga */
}

/* Purane borders ko isse replace karein */
.profile-avatar.b-neon-blue { border: 4px solid #00d2ff !important; box-shadow: 0 0 15px rgba(0, 210, 255, 0.5); }

.profile-avatar.b-gold, .profile-avatar.verified-border { border: 4px solid #FFD700 !important; box-shadow: 0 0 15px rgba(255, 215, 0, 0.4); }
.store-header-group {
    position: absolute;
    top: 15px;
    right: 15px;
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(0, 0, 0, 0.4);

}

.profile-coin-wrap {
    display: flex;

    font-weight: 800;
    color: #FFD700;
}

.store-header-btn-new {
    text-decoration: none;
    color: white;
    font-size: 16px;

    border-left: 1px solid rgba(255,255,255,0.2);

}

.store-header-btn-new:active { transform: scale(0.9); }
/* Purane .profile-avatar ko isse badlein */
.profile-avatar {
    width: 90px !important; 
    height: 90px !important;
    border-radius: 50%;
    z-index: 1; /* Sabse niche photo */
    border: 3px solid var(--bg-dark) !important;
    position: relative;
}

/* Purane .lvl-badge ko isse badlein */
.lvl-badge { 
    position: absolute;

    background: var(--accent);

    font-weight: 900; 
    padding: 3px 10px; 
    border-radius: 20px; 
    border: 2px solid var(--bg-dark);

}

/* Naruto Border Overlay */
/* Is hisse ko replace karein */
.anime-border-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%); 
    width: 140px !important; /* Border avatar se bada hona chahiye */
    height: 140px !important;
    z-index: 10; /* Photo ke upar */
    pointer-events: none;
    object-fit: contain;
}

        } else {
            document.getElementById('myActions').style.display = 'none';
            document.getElementById('followBtn').style.display = 'block';
            checkFollowStatus(u.uid, target);
        }
        fetchData(target);
    });

    // 2. Main Data Fetch Function (With GIF & Alignment Fix)
    async function fetchData(uid) {
        try {
            const s = await getDoc(doc(db, "users", uid));
            if(!s.exists()) return;
            const d = s.data();
            
            const avatarImg = document.getElementById('userAvatar');
            const borderOverlay = document.getElementById('borderOverlay');
            const nameElement = document.getElementById('userName');

            // Verified Badge Fix
            nameElement.innerHTML = (d.username || "User") + 
                (d.isVerified ? ' <i class="fa-solid fa-circle-check badge-gold"></i>' : '');
            
            document.getElementById('userId').innerText = "ID: " + (d.customId || "---");
            document.getElementById('userBio').innerText = d.bio || "No bio yet.";
            
            if(d.avatar) avatarImg.src = d.avatar;
            if(d.banner) document.getElementById('userBanner').style.backgroundImage = `url('${d.banner}')`;

                                    // --- AVATAR & BANNER LOAD ---
            if(d.avatar) {
                avatarImg.src = d.avatar;
            } else {
                avatarImg.src = "https://via.placeholder.com/90"; // Default image
            }
            if(d.banner) document.getElementById('userBanner').style.backgroundImage = `url('${d.banner}')`;

            // --- BORDER & GIF RENDER SYSTEM ---
            const currentBox = document.getElementById('avatarBox'); 
            const oldOverlay = document.getElementById('borderOverlay');
            
            if (oldOverlay) oldOverlay.remove(); // Purana border hatao

            // Reset classes lekin 'profile-avatar' ko barkrar rakho
            avatarImg.className = "profile-avatar"; 

            if (d.activeBorder && d.activeBorder.startsWith('http')) {
                // GIF BORDER LOGIC
                const newOverlay = document.createElement('img');
                newOverlay.id = 'borderOverlay';
                newOverlay.className = 'anime-border-overlay';
                newOverlay.src = d.activeBorder + "?t=" + new Date().getTime();
                newOverlay.style.display = "block"; // Force display
                currentBox.appendChild(newOverlay);
            } else if (d.activeBorder) {
                // Static Border (neon-blue etc.)
                avatarImg.classList.add(d.activeBorder);
            } else if (d.isVerified) {
                // Verified Gold Border
                avatarImg.classList.add('verified-border');
            }


            // Level & XP Logic
            const totalXP = d.xp || 0;
            const currentLevel = Math.floor(totalXP / 100) + 1;
            const xpInLevel = totalXP % 100;

            document.getElementById('userLevel').innerText = currentLevel;
            document.getElementById('currentLvlNum').innerText = currentLevel;
            document.getElementById('xpValue').innerText = totalXP;
            document.getElementById('xpToNext').innerText = xpInLevel + " / 100 XP";
            document.getElementById('lvlFill').style.width = xpInLevel + "%";

            if(document.getElementById('profileCoinsTop')) {
                document.getElementById('profileCoinsTop').innerText = d.coins || 0;
            }

            // Stats counts alignment fix
            loadStats(uid);

        } catch (err) { console.error("Error fetching profile:", err); }
    }

    // 3. Stats Loader
    async function loadStats(uid) {
        try {
            const w = await getDocs(collection(db, "users", uid, "watchlist"));
            document.getElementById('watchCount').innerText = w.size;
            const fers = await getDocs(collection(db, "users", uid, "followers"));
            document.getElementById('followerCount').innerText = fers.size;
            const fing = await getDocs(collection(db, "users", uid, "following"));
            document.getElementById('followingCount').innerText = fing.size;
        } catch (err) { console.error(err); }
    }

    // AB YAHA SE AAPKE "GLOBAL FUNCTIONS FOR BUTTONS" START HONGE... 
    // (Inke niche ka code aapka purana hi rehne dein)

    // --- GLOBAL FUNCTIONS FOR BUTTONS ---
    window.openEdit = () => document.getElementById('editModal').classList.add('show');
    window.closeEdit = () => document.getElementById('editModal').classList.remove('show');
    
    window.copyId = () => {
        const id = document.getElementById('userId').innerText.replace("ID: ", "");
        navigator.clipboard.writeText(id).then(() => alert("ID Copied!"));
    };

    window.handleLogout = () => { 
        if(confirm("Logout from account?")) signOut(auth).then(() => location.href="login.html"); 
    };

    // --- IMAGE CROP & UPLOAD LOGIC ---
    window.startCrop = (input, mode) => {
        if (!input.files || !input.files[0]) return;
        cpMode = mode;
        const reader = new FileReader();
        reader.onload = (e) => {
            document.getElementById('cropperModal').style.display = 'flex';
            if (cp) cp.destroy();
            cp = new Croppie(document.getElementById('cropArea'), {
                viewport: { 
                    width: mode === 'avatar' ? 200 : 320, 
                    height: mode === 'avatar' ? 200 : 180, 
                    type: mode === 'avatar' ? 'circle' : 'square' 
                },
                boundary: { width: 350, height: 350 },
                showZoomer: true
            });
            cp.bind({ url: e.target.result });
        };
        reader.readAsDataURL(input.files[0]);
    };

    window.uploadToCloud = async () => {
        const btn = document.getElementById('upBtn');
        btn.innerText = "Processing...";
        btn.disabled = true;

        try {
            const blob = await cp.result({ type: 'blob', size: 'viewport', format: 'jpeg' });
            const formData = new FormData();
            formData.append('image', blob);

            // ImgBB API Integration
            const res = await fetch("https://api.imgbb.com/1/upload?key=eab281e4cee2c8c755ed3f7594fd120b", {
                method: "POST",
                body: formData
            });
            
            const json = await res.json();
            if(json.success) {
                newUrls[cpMode] = json.data.url;
                alert(cpMode.toUpperCase() + " Updated! Please Save Changes.");
                document.getElementById('cropperModal').style.display = 'none';
            } else {
                alert("Upload failed. Try again.");
            }
        } catch (e) {
            console.error(e);
            alert("Error uploading image.");
        } finally {
            btn.innerText = "Apply Crop";
            btn.disabled = false;
        }
    };

    window.saveAll = async () => {
        const btn = document.getElementById('saveBtn');
        btn.innerText = "Saving...";
        
        const data = {
            username: document.getElementById('inpName').value.trim() || document.getElementById('userName').innerText,
            bio: document.getElementById('inpBio').value.trim() || document.getElementById('userBio').innerText,
            insta: document.getElementById('inpInsta').value.trim() || ""
        };

        // Add new image URLs if they were uploaded
        if (newUrls.avatar) data.avatar = newUrls.avatar;
        if (newUrls.banner) data.banner = newUrls.banner;

        try {
            await updateDoc(doc(db, "users", auth.currentUser.uid), data);
            location.reload();
        } catch (e) {
            alert("Error saving changes");
            btn.innerText = "Save Changes";
        }
    };

    // --- FOLLOW SYSTEM ---
    async function checkFollowStatus(myId, targetId) {
        const btn = document.getElementById('followBtn');
        const s = await getDoc(doc(db, "users", targetId, "followers", myId));
        if(s.exists()) {
            btn.innerHTML = '<i class="fa-solid fa-user-check"></i> Following';
            btn.style.background = "#222";
            btn.onclick = () => window.unfollow(myId, targetId);
        } else {
            btn.innerHTML = '<i class="fa-solid fa-plus"></i> Follow';
            btn.style.background = "var(--accent)";
            btn.onclick = () => window.follow(myId, targetId);
        }
    }

    window.follow = async (myId, targetId) => {
        await setDoc(doc(db, "users", targetId, "followers", myId), {time: Date.now()});
        await setDoc(doc(db, "users", myId, "following", targetId), {time: Date.now()});
        location.reload();
    }

    window.unfollow = async (myId, targetId) => {
        await deleteDoc(doc(db, "users", targetId, "followers", myId));
        await deleteDoc(doc(db, "users", myId, "following", targetId));
        location.reload();
    }
</script>
