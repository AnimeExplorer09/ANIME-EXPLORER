<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AnimeExplorer - Schedule</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c4dff">
<meta name="apple-mobile-web-app-capable" content="yes">

    <style>
        :root {
            --primary: #5738B0;
            --primary-light: #7B5CE8;
            --primary-glow: rgba(87, 56, 176, 0.2);
            --bg: #0f1116;
            --bg-card: #1a1c22;
            --bg-surface: #13151b;
            --bg-chip: #23252b;
            --border: rgba(255,255,255,0.07);
            --border-card: rgba(255,255,255,0.05);
            --text: #ffffff;
            --text-dim: #94a3b8;
            --text-mid: #6b7280;
            --accent-gold: #FFB800;
            --shadow-soft: 0 4px 20px rgba(0,0,0,0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { display: none; }

        html, body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100dvh;
            overflow-x: hidden;
            padding-bottom: 30px;
        }

        /* ══ HEADER ══ */
        .app-header {
            position: sticky; top: 0; z-index: 1000;
            background: rgba(15,17,22,0.97);
            backdrop-filter: blur(24px) saturate(180%);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center;
            padding: 0 16px;
            height: 58px;
            gap: 12px;
        }
        .back-btn {
            width: 36px; height: 36px; border-radius: 11px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            color: var(--text-dim); text-decoration: none;
            transition: 0.2s; flex-shrink: 0;
        }
        .back-btn:active { transform: scale(0.9); background: rgba(87,56,176,0.2); color: var(--primary-light); }
        .back-btn i { font-size: 14px; }
        .header-title {
            font-size: 19px; font-weight: 900;
            color: #fff; letter-spacing: -0.3px; flex: 1;
        }
        .header-title span { color: var(--primary-light); }
        .header-date-pill {
            background: rgba(87,56,176,0.12);
            border: 1px solid rgba(87,56,176,0.25);
            border-radius: 9px; padding: 5px 11px;
            font-size: 11px; font-weight: 700; color: var(--primary-light);
            white-space: nowrap;
        }

        /* ══ DAY HERO ══ */
        .day-hero {
            padding: 16px 16px 0;
            display: flex; align-items: flex-end; justify-content: space-between;
        }
        .day-hero-title {
            font-size: 28px; font-weight: 900; line-height: 1; color: #fff;
        }
        .day-hero-sub {
            font-size: 12px; color: #5738B0; font-weight: 500; margin-top: 4px;
        }
        .today-pill {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white; font-size: 10px; font-weight: 800;
            padding: 5px 13px; border-radius: 20px;
            letter-spacing: 0.5px; text-transform: uppercase;
            box-shadow: 0 4px 14px var(--primary-glow);
        }

        /* ══ WEEK STRIP ══ */
        .week-strip {
            display: flex; gap: 7px;
            padding: 14px 16px 6px;
            overflow-x: auto;
        }
        .day-chip {
            display: flex; flex-direction: column; align-items: center;
            min-width: 48px; padding: 9px 5px; border-radius: 14px;
            border: 1px solid var(--border-card); background: var(--bg-chip);
            cursor: pointer; transition: 0.2s; flex-shrink: 0;
        }
        .day-chip .day-short {
            font-size: 9px; font-weight: 800; color: var(--text-mid);
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .day-chip .day-num {
            font-size: 17px; font-weight: 800; color: var(--text-dim);
            margin: 2px 0;
        }
        .day-chip .day-dot {
            width: 4px; height: 4px; border-radius: 50%;
            background: transparent; transition: 0.2s;
        }
        .day-chip.active {
            background: var(--primary); border-color: var(--primary);
            box-shadow: 0 5px 16px var(--primary-glow);
        }
        .day-chip.active .day-short { color: rgba(255,255,255,0.6); }
        .day-chip.active .day-num   { color: #fff; }
        .day-chip.active .day-dot   { background: rgba(255,255,255,0.5); }
        .day-chip.today-chip:not(.active) .day-dot { background: var(--primary-light); }
        .day-chip:not(.active):active { background: rgba(87,56,176,0.15); border-color: var(--primary); }

        /* ══ STATS BAR ══ */
        .stats-bar {
            display: flex; gap: 8px; padding: 10px 16px 10px;
            overflow-x: auto;
        }
        .stat-pill {
            background: var(--bg-surface); border: 1px solid var(--border-card);
            border-radius: 10px; padding: 7px 13px;
            display: flex; align-items: center; gap: 6px;
            font-size: 12px; font-weight: 600; color: var(--text-dim);
            white-space: nowrap; flex-shrink: 0;
        }
        .stat-pill i  { font-size: 12px; color: var(--primary-light); }
        .stat-pill b  { color: #fff; font-weight: 800; }

        /* ══ SECTION LABEL ══ */
        .section-label {
            padding: 2px 16px 10px;
            font-size: 11px; font-weight: 800; color: var(--primary-light);
            text-transform: uppercase; letter-spacing: 1.2px;
            display: flex; align-items: center; gap: 8px;
        }
        .section-label::after {
            content: ''; flex: 1; height: 1px; background: var(--border);
        }

        /* ══ GRID — index.html style: 2 columns ══ */
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            padding: 0 15px 30px;
        }

        /* ══ CARD — exact index.html style ══ */
        .anime-card {
            background: var(--bg-card);
            border-radius: 9px;
            overflow: hidden;
            position: relative;
            border: 1px solid var(--border-card);
            box-shadow: var(--shadow-soft);
            transition: all 0.3s ease;
            aspect-ratio: 0.75 / 1;
            cursor: pointer;
            animation: cardIn 0.35s cubic-bezier(0.18,0.89,0.32,1.28) both;
        }
        .anime-card:nth-child(1)  { animation-delay: 0.02s; }
        .anime-card:nth-child(2)  { animation-delay: 0.05s; }
        .anime-card:nth-child(3)  { animation-delay: 0.08s; }
        .anime-card:nth-child(4)  { animation-delay: 0.11s; }
        .anime-card:nth-child(5)  { animation-delay: 0.14s; }
        .anime-card:nth-child(6)  { animation-delay: 0.17s; }
        .anime-card:nth-child(7)  { animation-delay: 0.20s; }
        .anime-card:nth-child(8)  { animation-delay: 0.23s; }
        .anime-card:nth-child(9)  { animation-delay: 0.26s; }
        .anime-card:nth-child(10) { animation-delay: 0.29s; }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(14px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0)    scale(1);    }
        }

        .anime-card:active { transform: scale(0.96); border-color: var(--primary); }

        .anime-card img {
            width: 100%; height: 100%;
            object-fit: cover; opacity: 0.85; display: block;
        }

        /* Gradient overlay — bottom */
        .card-content {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 12px;
            background: linear-gradient(transparent, rgba(15,17,22,0.97));
        }

        .card-title {
            font-size: 12px; font-weight: 700;
            color: #fff; line-height: 1.25; margin-bottom: 5px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-meta-row {
            display: flex; justify-content: space-between; align-items: center;
        }
        .card-score {
            font-size: 11px; color: var(--text-dim);
            display: flex; align-items: center; gap: 3px;
        }
        .card-score i { color: var(--accent-gold); font-size: 10px; }

        /* Time badge top-left */
        .time-badge {
            position: absolute; top: 7px; left: 7px; z-index: 2;
            background: rgba(15,17,22,0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(87,56,176,0.4);
            color: var(--primary-light);
            font-size: 9px; font-weight: 800;
            padding: 3px 7px; border-radius: 6px;
            display: flex; align-items: center; gap: 3px;
        }

        /* ══ SKELETON ══ */
        .skeleton-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px; padding: 0 15px 30px;
        }
        .skeleton-card {
            background: var(--bg-card);
            border-radius: 9px;
            border: 1px solid var(--border-card);
            overflow: hidden;
            aspect-ratio: 0.75 / 1;
            position: relative;
        }
        .sk {
            background: linear-gradient(110deg, #1a1c22 8%, #23252b 18%, #1a1c22 33%);
            background-size: 200% 100%;
            animation: shimmer 1.5s linear infinite;
        }
        .sk-full { position: absolute; inset: 0; }
        @keyframes shimmer { to { background-position-x: -200%; } }

        /* ══ EMPTY STATE ══ */
        .empty-state {
            grid-column: 1 / -1; text-align: center; padding: 50px 20px;
        }
        .empty-state i { font-size: 34px; color: #2a2d3a; display: block; margin-bottom: 12px; }
        .empty-state p { color: var(--text-mid); font-size: 14px; line-height: 1.6; }
    </style>
</head>
<body>

<!-- ══ HEADER ══ -->
<header class="app-header">
    <a href="index.html" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i>
    </a>
    <div class="header-title">Airing <span>Schedule</span></div>
    <div class="header-date-pill" id="headerDatePill">Today</div>
</header>

<!-- ══ DAY HERO ══ -->
<div class="day-hero">
    <div>
        <div class="day-hero-title" id="heroDay">—</div>
        <div class="day-hero-sub"   id="heroDate">—</div>
    </div>
    <div class="today-pill" id="todayPill" style="display:none;">Today</div>
</div>

<!-- ══ WEEK STRIP ══ -->
<div class="week-strip" id="weekStrip"></div>

<!-- ══ STATS ══ -->
<div class="stats-bar">
    <div class="stat-pill"><i class="fa-solid fa-tv"></i><b id="countStat">—</b> airing</div>
    <div class="stat-pill"><i class="fa-solid fa-star"></i>Top:&nbsp;<b id="topStat" style="max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle;">—</b></div>
</div>

<!-- ══ SECTION LABEL ══ -->
<div class="section-label" id="sectionLabel">Schedule</div>

<!-- ══ GRID ══ -->
<div id="animeGrid"></div>

<script>
    const DAYS   = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
    const DAYS_S = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const DAYS_F = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const todayIdx = new Date().getDay();

    /* build week strip */
    function buildStrip() {
        const strip = document.getElementById('weekStrip');
        const now   = new Date();
        DAYS.forEach((day, i) => {
            const d = new Date(now);
            d.setDate(now.getDate() - now.getDay() + i);
            const chip = document.createElement('div');
            chip.className = 'day-chip' +
                (i === todayIdx ? ' today-chip active' : '');
            chip.innerHTML = `
                <span class="day-short">${DAYS_S[i]}</span>
                <span class="day-num">${d.getDate()}</span>
                <span class="day-dot"></span>`;
            chip.addEventListener('click', () => selectDay(day, i, chip));
            strip.appendChild(chip);
        });
    }

    function selectDay(day, idx, chipEl) {
        document.querySelectorAll('.day-chip').forEach(c => c.classList.remove('active'));
        chipEl.classList.add('active');
        document.getElementById('heroDay').textContent = DAYS_F[idx];
        document.getElementById('todayPill').style.display = idx === todayIdx ? 'block' : 'none';
        chipEl.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        fetchSchedule(day, idx);
    }

    function showSkeleton() {
        let html = '<div class="skeleton-grid">';
        for (let i = 0; i < 10; i++)
            html += `<div class="skeleton-card"><div class="sk sk-full"></div></div>`;
        html += '</div>';
        document.getElementById('animeGrid').innerHTML = html;
        document.getElementById('countStat').textContent = '—';
        document.getElementById('topStat').textContent   = '—';
    }

    async function fetchSchedule(day, idx) {
        showSkeleton();
        document.getElementById('sectionLabel').textContent = DAYS_F[DAYS.indexOf(day)] + ' Schedule';
        try {
            const res  = await fetch(`https://api.jikan.moe/v4/schedules?filter=${day}&limit=25`);
            const data = await res.json();
            const grid = document.getElementById('animeGrid');

            if (!data.data || !data.data.length) {
                grid.innerHTML = `<div class="anime-grid"><div class="empty-state">
                    <i class="fa-solid fa-moon"></i>
                    <p>No anime airing.<br>Try another day!</p>
                </div></div>`;
                return;
            }

            /* stats */
            const scored = [...data.data].filter(a => a.score).sort((a,b) => b.score - a.score);
            document.getElementById('countStat').textContent = data.data.length;
            document.getElementById('topStat').textContent   = scored[0]
                ? scored[0].title.split(' ').slice(0,3).join(' ') : '—';

            /* cards */
            let html = '<div class="anime-grid">';
            data.data.forEach(item => {
                const time  = item.broadcast?.time || 'TBA';
                const score = item.score ? item.score.toFixed(1) : 'N/A';
                html += `
                    <div class="anime-card"
                         onclick="location.href='details.html?id=${item.mal_id}&type=anime'">
                        <img src="${item.images.jpg.image_url}" loading="lazy" alt="">
                        <div class="time-badge">
                            <i class="fa-regular fa-clock"></i>${time}
                        </div>
                        <div class="card-content">
                            <div class="card-title">${item.title}</div>
                            <div class="card-meta-row">
                                <div class="card-score">
                                    <i class="fa-solid fa-star"></i>${score}
                                </div>
                            </div>
                        </div>
                    </div>`;
            });
            html += '</div>';
            grid.innerHTML = html;

        } catch(e) {
            console.error(e);
            document.getElementById('animeGrid').innerHTML = `<div class="anime-grid">
                <div class="empty-state">
                    <i class="fa-solid fa-wifi"></i>
                    <p>Failed to load.<br>Check your connection.</p>
                </div></div>`;
        }
    }

    function init() {
        const now     = new Date();
        const dateStr = now.toLocaleDateString('en-IN', { day:'numeric', month:'long', year:'numeric' });
        document.getElementById('heroDay').textContent       = DAYS_F[todayIdx];
        document.getElementById('heroDate').textContent      = dateStr;
        document.getElementById('headerDatePill').textContent = DAYS_F[todayIdx];
        document.getElementById('todayPill').style.display   = 'block';
        buildStrip();
        fetchSchedule(DAYS[todayIdx], todayIdx);
    }

    init();
</script>
</body>
</html>
