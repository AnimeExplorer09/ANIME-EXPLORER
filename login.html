<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - AnimeExplorer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c4dff">
<meta name="apple-mobile-web-app-capable" content="yes">

    <style>
        :root {
            --primary: #7c4dff;
            --primary-glow: rgba(124,77,255,0.5);
            --bg-dark: #050507;
            --glass-bg: rgba(255,255,255,0.03);
            --glass-border: rgba(255,255,255,0.08);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body, html {
            width:100%; height:100%;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-dark);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bg-container { position:fixed; inset:0; background:radial-gradient(circle at 50% 50%, #12121c 0%, #050507 100%); z-index:-1; }
        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 35px;
            padding: 50px 40px;
            width: 90%;
            max-width: 420px;
            text-align: center;
        }
        .brand-logo { font-size: 36px; font-weight:800; margin-bottom:8px; }
        .subtitle { color:rgba(255,255,255,0.5); font-size:14px; margin-bottom:35px; }
        .auth-form { display:flex; flex-direction:column; gap:18px; }
        .input-group { position:relative; }
        .input-group i { position:absolute; left:18px; top:50%; transform:translateY(-50%); color:rgba(255,255,255,0.3); }
        .input-group input {
            width:100%; padding:16px 16px 16px 52px;
            background:rgba(255,255,255,0.04);
            border:1px solid transparent;
            border-radius:18px;
            color:white;
            outline:none;
        }
        .input-group input:focus { border-color:var(--primary); }
        .login-btn {
            background:var(--primary); color:white; border:none; padding:16px;
            border-radius:18px; font-weight:700; cursor:pointer;
            width:100%;
            margin-top:10px;
        }
        #status { margin-top:20px; font-size:13px; }
        .error { color:#ff6b6b; }
        .success { color:#4caf50; }
        .info { color:#b39dff; }
        .footer-link { margin-top:30px; font-size:14px; color:#888; }
        .footer-link a { color:var(--primary); }
        .resend-info { margin-top:15px; font-size:12px; display:none; }
        .resend-info a { color:var(--primary); cursor:pointer; }
    </style>
</head>
<body>
<div class="bg-container"></div>
<div class="login-card">
    <div class="brand-logo">AnimeExplorer</div>
    <p class="subtitle">Enter your credentials to continue</p>
    <div class="auth-form">
        <div class="input-group"><i class="fas fa-envelope"></i><input type="email" id="email" placeholder="Email Address"></div>
        <div class="input-group"><i class="fas fa-lock"></i><input type="password" id="password" placeholder="Password"></div>
        <button id="loginBtn" class="login-btn">Sign In</button>
    </div>
    <p id="status"></p>
    <div class="resend-info" id="resendInfo">Didn't get verification email? <a id="resendLink">Resend</a></div>
    <div class="footer-link">Don't have an account? <a href="signup.html">Create One</a></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, sendEmailVerification, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, serverTimestamp, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDLd3TW-y89lwShUmcIHw3YGzDjo4cg3y4",
        authDomain: "animea2z.firebaseapp.com",
        projectId: "animea2z",
        storageBucket: "animea2z.firebasestorage.app",
        messagingSenderId: "673605765684",
        appId: "1:673605765684:web:a6f851e0d79836b79b1861"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let lastEmail = "";

    // ========== AUTO-REDIRECT IF ALREADY LOGGED IN ==========
    onAuthStateChanged(auth, (user) => {
        if (user) {
            // User already logged in, redirect to home page
            window.location.href = "index.html";
        }
    });
    // ========================================================

    document.getElementById('loginBtn').onclick = async () => {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const status = document.getElementById('status');
        const loginBtn = document.getElementById('loginBtn');
        const resendInfo = document.getElementById('resendInfo');

        if (!email || !password) {
            status.innerText = "Please fill all fields.";
            status.className = "error";
            return;
        }
        lastEmail = email;

        loginBtn.disabled = true;
        loginBtn.innerText = "Logging in...";
        status.innerText = "Checking...";
        status.className = "info";
        resendInfo.style.display = "none";

        try {
            const cred = await signInWithEmailAndPassword(auth, email, password);
            const user = cred.user;

            // Check email verification
            if (!user.emailVerified) {
                await signOut(auth);
                status.innerText = "❌ Email not verified. Please check your inbox/spam and click the verification link.";
                status.className = "error";
                resendInfo.style.display = "block";
                loginBtn.disabled = false;
                loginBtn.innerText = "Sign In";
                return;
            }

            // Ensure Firestore document exists for this verified user
            const userRef = doc(db, "users", user.uid);
            const userSnap = await getDoc(userRef);

            if (!userSnap.exists()) {
                // Create new user document with custom sequential ID
                let customId = Date.now().toString().slice(-7);
                try {
                    customId = await runTransaction(db, async (transaction) => {
                        const counterRef = doc(db, "userCounter", "counter");
                        const snap = await transaction.get(counterRef);
                        let next = 1000000001;
                        if (snap.exists()) next = (snap.data().count || 1000000000) + 1;
                        transaction.set(counterRef, { count: next });
                        return String(next);
                    });
                } catch(e) { console.warn("Counter fallback", e); }

                const username = user.displayName || user.email.split('@')[0];
                await setDoc(userRef, {
                    uid: user.uid,
                    customId: customId,
                    username: username,
                    email: user.email,
                    avatar: `https://ui-avatars.com/api/?name=${encodeURIComponent(username)}&background=7c4dff&color=fff`,
                    coins: 0,
                    isVerified: true,
                    joinedAt: new Date().toLocaleDateString(),
                    lastLogin: serverTimestamp()
                });
            } else {
                // Update last login time
                await updateDoc(userRef, { lastLogin: serverTimestamp() });
            }

            status.innerText = "Login successful! Redirecting...";
            status.className = "success";
            setTimeout(() => window.location.href = "index.html", 1000);
        } catch (err) {
            console.error(err);
            status.innerText = "Invalid email or password.";
            status.className = "error";
            loginBtn.disabled = false;
            loginBtn.innerText = "Sign In";
        }
    };

    // Resend verification email
    document.getElementById('resendLink').onclick = async () => {
        const status = document.getElementById('status');
        if (!lastEmail) {
            status.innerText = "Please enter your email first.";
            status.className = "error";
            return;
        }
        try {
            const password = document.getElementById('password').value;
            if (!password) {
                status.innerText = "Please enter your password to resend verification.";
                status.className = "error";
                return;
            }
            const cred = await signInWithEmailAndPassword(auth, lastEmail, password);
            await sendEmailVerification(cred.user);
            await signOut(auth);
            status.innerText = "Verification email resent! Check your inbox/spam.";
            status.className = "success";
        } catch (err) {
            status.innerText = "Failed to resend. Please try again.";
            status.className = "error";
        }
    };
</script>
</body>
</html>
