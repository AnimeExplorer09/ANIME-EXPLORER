<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - AnimeExplorer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #7c4dff;
            --primary-glow: rgba(124, 77, 255, 0.5);
            --accent: #00e5ff;
            --bg-dark: #050507;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%; height: 100%;
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: white;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        .bg-container {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at 50% 50%, #12121c 0%, #050507 100%);
        }

        .blob {
            position: absolute; width: 400px; height: 400px;
            background: var(--primary);
            filter: blur(100px); border-radius: 50%; opacity: 0.2;
            animation: move 25s infinite alternate;
        }
        .blob-2 { background: var(--accent); animation-duration: 18s; right: 0; bottom: 0; }

        @keyframes move {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(150px, 100px) scale(1.3); }
        }

        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 35px;
            padding: 50px 40px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            position: relative;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
            animation: cardEntrance 1s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: scale(0.9) translateY(30px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .brand-logo {
            font-size: 36px; font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #b39dff 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 8px; letter-spacing: -1.5px;
        }

        .subtitle { color: rgba(255,255,255,0.5); font-size: 14px; margin-bottom: 35px; }

        .auth-form { display: flex; flex-direction: column; gap: 18px; }
        
        .input-group { position: relative; text-align: left; }
        .input-group .field-icon { 
            position: absolute; left: 18px; top: 50%; 
            transform: translateY(-50%); color: rgba(255,255,255,0.3);
            transition: 0.3s; pointer-events: none;
        }

        .input-group input {
            width: 100%; padding: 16px 16px 16px 52px;
            background: rgba(255,255,255,0.04);
            border: 1px solid transparent; border-radius: 18px;
            color: white; font-size: 15px; transition: 0.4s;
            outline: none; font-family: inherit;
        }
        .input-group input::placeholder { color: rgba(255,255,255,0.25); }
        .input-group input:focus {
            background: rgba(255,255,255,0.08);
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(124, 77, 255, 0.2);
        }

        .eye-btn {
            position: absolute; right: 16px; top: 50%;
            transform: translateY(-50%);
            background: none; border: none;
            color: rgba(255,255,255,0.3);
            cursor: pointer; font-size: 14px; padding: 4px;
            transition: color 0.2s;
        }
        .eye-btn:hover { color: var(--primary); }

        .login-btn {
            background: var(--primary);
            color: white; border: none; padding: 16px;
            border-radius: 18px; font-weight: 700; font-size: 16px;
            cursor: pointer; transition: 0.3s;
            box-shadow: 0 10px 25px var(--primary-glow);
            margin-top: 10px; font-family: inherit; width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .login-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 35px var(--primary-glow); }
        .login-btn:active { transform: scale(0.98); }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .btn-spinner {
            display: none; width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white; border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #status {
            margin-top: 20px; font-size: 13px; font-weight: 600; min-height: 20px;
        }
        #status.error   { color: #ff6b6b; }
        #status.info    { color: #b39dff; }
        #status.success { color: #4caf50; }

        .footer-link {
            margin-top: 30px; font-size: 14px; color: rgba(255,255,255,0.4);
        }
        .footer-link a { color: var(--primary); text-decoration: none; font-weight: 700; transition: 0.3s; }
        .footer-link a:hover { color: var(--accent); }

        .resend-info {
            margin-top: 15px;
            font-size: 12px;
            color: rgba(255,255,255,0.3);
        }
        .resend-info a {
            color: var(--primary);
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="bg-container">
    <div class="blob"></div>
    <div class="blob blob-2"></div>
</div>

<div class="login-card">
    <div class="brand-logo">AnimeExplorer</div>
    <p class="subtitle">Enter your credentials to continue</p>

    <div class="auth-form">
        <div class="input-group">
            <input type="email" id="email" placeholder="Email Address" autocomplete="email">
            <i class="fas fa-envelope field-icon"></i>
        </div>
        <div class="input-group">
            <input type="password" id="password" placeholder="Password" autocomplete="current-password">
            <i class="fas fa-lock field-icon"></i>
            <button class="eye-btn" id="eyeBtn" type="button" tabindex="-1">
                <i class="fa-regular fa-eye" id="eyeIcon"></i>
            </button>
        </div>
        <button id="loginBtn" class="login-btn">
            <span id="btnText">Sign In</span>
            <div class="btn-spinner" id="btnSpinner"></div>
        </button>
    </div>

    <p id="status"></p>

    <div class="resend-info" id="resendInfo" style="display: none;">
        Didn't get verification email? <a id="resendLink">Resend verification email</a>
    </div>

    <div class="footer-link">
        Don't have an account? <a href="signup.html">Create One</a>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDLd3TW-y89lwShUmcIHw3YGzDjo4cg3y4",
        authDomain: "animea2z.firebaseapp.com",
        projectId: "animea2z",
        storageBucket: "animea2z.firebasestorage.app",
        messagingSenderId: "673605765684",
        appId: "1:673605765684:web:a6f851e0d79836b79b1861"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let lastAttemptedEmail = "";

    const loginBtn = document.getElementById('loginBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const status = document.getElementById('status');
    const pwdInput = document.getElementById('password');
    const emailInput = document.getElementById('email');
    const resendInfo = document.getElementById('resendInfo');
    const resendLink = document.getElementById('resendLink');

    function setLoading(on) {
        loginBtn.disabled = on;
        btnText.style.display = on ? 'none' : 'inline';
        btnSpinner.style.display = on ? 'block' : 'none';
    }

    // Resend verification email
    resendLink.onclick = async () => {
        if (!lastAttemptedEmail) {
            status.innerText = "Please enter your email first.";
            status.className = "error";
            return;
        }
        try {
            // Sign in temporarily to get user object (only if not signed in)
            let user = auth.currentUser;
            if (!user || user.email !== lastAttemptedEmail) {
                // We need to sign in to send verification? Actually sendEmailVerification requires currentUser.
                // Better approach: user tries to login, fails because not verified, then we can resend using the same credentials.
                // For simplicity, we'll just tell user to go to signup page and request new link.
                // But here's a workaround: try to sign in again, get user, send verification, then sign out.
                status.innerText = "Attempting to resend...";
                status.className = "info";
                const pwd = pwdInput.value;
                if (!pwd) {
                    status.innerText = "Please enter your password to resend verification.";
                    status.className = "error";
                    return;
                }
                const cred = await signInWithEmailAndPassword(auth, lastAttemptedEmail, pwd);
                user = cred.user;
                await sendEmailVerification(user);
                await signOut(auth);
                status.innerText = "Verification email resent! Check your inbox/spam.";
                status.className = "success";
            } else {
                await sendEmailVerification(user);
                status.innerText = "Verification email resent! Check your inbox/spam.";
                status.className = "success";
            }
        } catch (err) {
            console.error(err);
            status.innerText = "Failed to resend. Please try again or sign up again.";
            status.className = "error";
        }
    };

    loginBtn.onclick = async () => {
        const email = emailInput.value.trim();
        const pwd = pwdInput.value;
        lastAttemptedEmail = email;

        if (!email || !pwd) {
            status.innerText = "Please fill all fields.";
            status.className = "error";
            return;
        }

        setLoading(true);
        status.innerText = "Checking credentials...";
        status.className = "info";
        resendInfo.style.display = "none";

        try {
            const cred = await signInWithEmailAndPassword(auth, email, pwd);
            const user = cred.user;

            // Check if email is verified
            if (!user.emailVerified) {
                await signOut(auth);
                status.innerText = "❌ Email not verified. Please check your inbox/spam and click the verification link.";
                status.className = "error";
                resendInfo.style.display = "block";
                setLoading(false);
                return;
            }

            // Check if user is banned (optional, add if needed)
            // const userSnap = await getDoc(doc(db, "users", user.uid));
            // if (userSnap.exists() && userSnap.data().isBanned === true) { ... }

            // Update last login
            await updateDoc(doc(db, "users", user.uid), { lastLogin: serverTimestamp() });

            status.innerText = "Login Successful! Redirecting...";
            status.className = "success";
            setTimeout(() => window.location.href = "index.html", 1000);
        } catch (e) {
            setLoading(false);
            console.error(e);
            if (e.code === 'auth/user-not-found' || e.code === 'auth/wrong-password') {
                status.innerText = "Invalid email or password.";
            } else if (e.code === 'auth/too-many-requests') {
                status.innerText = "Too many attempts. Try again later.";
            } else {
                status.innerText = "Login failed. Try again.";
            }
            status.className = "error";
        }
    };

    // Password Toggle
    document.getElementById('eyeBtn').onclick = () => {
        const type = pwdInput.type === 'password' ? 'text' : 'password';
        pwdInput.type = type;
        document.getElementById('eyeIcon').className = type === 'password' ? 'fa-regular fa-eye' : 'fa-regular fa-eye-slash';
    };
</script>
</body>
</html>
