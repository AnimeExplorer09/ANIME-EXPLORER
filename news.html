<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime News - AnimeExplorer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c4dff">
<meta name="apple-mobile-web-app-capable" content="yes">

    <style>
        :root {
            --primary: #5738B0;
            --primary-light: #7c5fd4;
            --primary-glow: rgba(87, 56, 176, 0.25);
            --bg: #0f1116;
            --card: #1a1c22;
            --card2: #13151d;
            --border: rgba(255,255,255,0.07);
            --dim: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            padding-bottom: 40px;
            min-height: 100vh;
        }

        /* ── HEADER ── */
        .app-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            background: rgba(15, 17, 22, 0.95);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .back-btn-header {
            width: 36px; height: 36px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 11px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: white;
            flex-shrink: 0;
            transition: 0.2s;
        }
        .back-btn-header:active { background: var(--primary); transform: scale(0.9); }

        .logo {
            font-size: 20px;
            font-weight: 900;
            color: white;
            letter-spacing: -0.3px;
        }
        .logo span { color: var(--primary-light); }

        /* ── CONTAINER ── */
        .container { padding: 16px 14px; }

        /* ── SEARCH ── */
        .search-wrap {
            position: relative;
            margin-bottom: 22px;
        }
        .search-wrap i {
            position: absolute;
            left: 16px; top: 50%;
            transform: translateY(-50%);
            color: var(--dim);
            font-size: 13px;
            pointer-events: none;
            transition: color 0.3s;
        }
        .search-box {
            width: 100%;
            background: var(--card2);
            border: 1.5px solid var(--border);
            padding: 14px 48px 14px 44px;
            border-radius: 16px;
            color: white;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: 0.3s;
        }
        .search-box::placeholder { color: rgba(255,255,255,0.2); }
        .search-box:focus {
            border-color: rgba(87, 56, 176, 0.7);
            background: rgba(87, 56, 176, 0.06);
            box-shadow: 0 0 0 4px rgba(87, 56, 176, 0.1);
        }
        .search-box:focus ~ i { color: var(--primary-light); }

        .search-enter-btn {
            position: absolute;
            right: 10px; top: 50%;
            transform: translateY(-50%);
            width: 32px; height: 32px;
            background: var(--primary);
            border: none; border-radius: 10px;
            color: white; font-size: 12px;
            cursor: pointer; display: flex;
            align-items: center; justify-content: center;
            transition: 0.2s;
        }
        .search-enter-btn:active { transform: translateY(-50%) scale(0.9); }

        /* ── SECTION HEADER ── */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .section-label-tag {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tag-dot {
            width: 8px; height: 8px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--primary-glow);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        .section-title-text {
            font-size: 15px;
            font-weight: 800;
            color: white;
        }
        .section-title-text span { color: var(--primary-light); }

        .back-pill {
            display: flex; align-items: center; gap: 6px;
            background: rgba(87, 56, 176, 0.12);
            border: 1px solid rgba(87, 56, 176, 0.25);
            color: var(--primary-light);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .back-pill:active { background: rgba(87, 56, 176, 0.25); transform: scale(0.96); }

        /* ── NEWS LIST CARDS ── */
        .grid-container { display: flex; flex-direction: column; gap: 10px; }

        .news-item-card {
            background: var(--card);
            border-radius: 18px;
            display: flex;
            gap: 13px;
            padding: 13px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: 0.2s;
            overflow: hidden;
            position: relative;
            animation: fadeUp 0.4s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .news-item-card:active {
            transform: scale(0.985);
            border-color: rgba(87, 56, 176, 0.4);
            background: rgba(87, 56, 176, 0.06);
        }

        /* Rank number badge on image */
        .img-wrap {
            position: relative;
            flex-shrink: 0;
        }
        .news-item-card img {
            width: 80px; height: 80px;
            object-fit: cover;
            border-radius: 13px;
            display: block;
        }
        .rank-badge {
            position: absolute;
            top: -5px; left: -5px;
            background: var(--primary);
            color: white;
            font-size: 10px;
            font-weight: 900;
            width: 20px; height: 20px;
            border-radius: 7px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 8px var(--primary-glow);
        }

        .news-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 0;
            padding: 2px 0;
        }

        .news-headline {
            font-size: 13.5px;
            font-weight: 700;
            line-height: 1.45;
            color: white;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .news-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
        }

        .news-meta {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: var(--primary-light);
            font-weight: 600;
        }

        .news-arrow {
            width: 26px; height: 26px;
            background: rgba(87, 56, 176, 0.15);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            color: var(--primary-light);
            font-size: 10px;
            flex-shrink: 0;
        }

        /* ── ARTICLE CARDS ── */
        .article-card {
            background: var(--card);
            border-radius: 18px;
            padding: 18px;
            border: 1px solid var(--border);
            margin-bottom: 10px;
            animation: fadeUp 0.4s ease both;
            position: relative;
            overflow: hidden;
        }

        /* top glow line */
        .article-card::before {
            content: '';
            position: absolute;
            top: 0; left: 15%; right: 15%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            border-radius: 2px;
        }

        .article-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .article-source {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(87, 56, 176, 0.15);
            border: 1px solid rgba(87, 56, 176, 0.25);
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 10px;
            font-weight: 800;
            color: var(--primary-light);
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .article-date {
            font-size: 11px;
            color: var(--dim);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .article-title {
            font-size: 15px;
            font-weight: 800;
            color: white;
            line-height: 1.45;
            margin-bottom: 10px;
        }

        .article-excerpt {
            font-size: 13px;
            color: #a8b2c0;
            line-height: 1.65;
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .article-link {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: white;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            text-decoration: none;
            font-size: 12px;
            font-weight: 800;
            padding: 9px 16px;
            border-radius: 12px;
            box-shadow: 0 4px 14px var(--primary-glow);
            transition: 0.2s;
        }
        .article-link:active { opacity: 0.85; transform: scale(0.97); }

        /* ── LOADER ── */
        #loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 60px 0;
        }
        .loader-wrap {
            position: relative;
            width: 52px; height: 52px;
        }
        .loader-ring {
            width: 52px; height: 52px;
            border: 3px solid rgba(87, 56, 176, 0.15);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading p { font-size: 13px; color: var(--dim); font-weight: 600; }

        .hidden { display: none !important; }

        /* ── EMPTY STATE ── */
        .empty-state {
            text-align: center;
            padding: 70px 20px;
        }
        .empty-icon {
            width: 70px; height: 70px;
            background: rgba(87, 56, 176, 0.1);
            border: 1px solid rgba(87, 56, 176, 0.2);
            border-radius: 22px;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px;
            color: var(--primary-light);
            margin: 0 auto 16px;
        }
        .empty-state p { font-size: 14px; font-weight: 700; color: var(--dim); }
        .empty-state span { font-size: 12px; color: #444; margin-top: 4px; display: block; }
    </style>
</head>
<body>

<!-- HEADER -->
<header class="app-header">
    <div class="back-btn-header" onclick="window.location.href='index.html'">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" style="width:17px;height:17px;">
            <path fill-rule="evenodd" d="M7.72 12.53a.75.75 0 0 1 0-1.06l7.5-7.5a.75.75 0 1 1 1.06 1.06L9.31 12l6.97 6.97a.75.75 0 1 1-1.06 1.06l-7.5-7.5Z" clip-rule="evenodd"/>
        </svg>
    </div>
    <span class="logo">Anime <span>News</span></span>
</header>

<!-- CONTENT -->
<div class="container">

    <!-- SEARCH -->
    <div id="searchSection">
        <div class="search-wrap">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="newsSearchInput" class="search-box" placeholder="Search anime for news...">
            <button class="search-enter-btn" id="searchBtn">
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <!-- SECTION HEADER -->
    <div class="section-header">
        <div class="section-label-tag">
            <div class="tag-dot"></div>
            <span class="section-title-text" id="newsTitle"><span>Trending</span> Updates</span>
        </div>
        <div id="backBtn" class="back-pill hidden" onclick="loadInitialList()">
            <i class="fa-solid fa-arrow-left"></i> Back
        </div>
    </div>

    <!-- LOADER -->
    <div id="loading" class="hidden">
        <div class="loader-wrap">
            <div class="loader-ring"></div>
        </div>
        <p>Fetching news...</p>
    </div>

    <!-- GRID -->
    <div id="newsGrid" class="grid-container"></div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDLd3TW-y89lwShUmcIHw3YGzDjo4cg3y4",
        authDomain: "animea2z.firebaseapp.com",
        projectId: "animea2z",
        storageBucket: "animea2z.firebasestorage.app",
        messagingSenderId: "673605765684",
        appId: "1:673605765684:web:a6f851e0d79836b79b1861"
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
        if (!user) { window.location.href = "login.html"; return; }
        try {
            const snap = await getDoc(doc(db, "users", user.uid));
            if (snap.exists() && String(snap.data().customId) === "1000000001") {
                const adminTab = document.getElementById('adminTab');
                if (adminTab) adminTab.style.display = "flex";
            }
        } catch (_) {}
        loadInitialList();
    });

    const newsGrid      = document.getElementById('newsGrid');
    const loader        = document.getElementById('loading');
    const searchInput   = document.getElementById('newsSearchInput');
    const newsTitle     = document.getElementById('newsTitle');
    const backBtn       = document.getElementById('backBtn');
    const searchSection = document.getElementById('searchSection');
    const searchBtn     = document.getElementById('searchBtn');

    function showLoader() { loader.classList.remove('hidden'); newsGrid.innerHTML = ''; }
    function hideLoader() { loader.classList.add('hidden'); }

    async function fetchDetailedNews(id, title) {
        showLoader();
        newsTitle.innerHTML = `<span>${title}</span> News`;
        backBtn.classList.remove('hidden');
        searchSection.classList.add('hidden');

        try {
            const res  = await fetch(`https://api.jikan.moe/v4/anime/${id}/news`);
            const data = await res.json();

            if (!data.data || data.data.length === 0) {
                newsGrid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon"><i class="fa-solid fa-newspaper"></i></div>
                        <p>No articles found</p>
                        <span>Try another anime</span>
                    </div>`;
            } else {
                data.data.forEach((art, i) => {
                    const card = document.createElement('div');
                    card.className = 'article-card';
                    card.style.animationDelay = `${i * 0.05}s`;
                    card.innerHTML = `
                        <div class="article-top">
                            <div class="article-source"><i class="fa-solid fa-newspaper"></i> MAL News</div>
                            <div class="article-date"><i class="fa-regular fa-calendar"></i> ${art.date.split('T')[0]}</div>
                        </div>
                        <div class="article-title">${art.title}</div>
                        <div class="article-excerpt">${art.excerpt}</div>
                        <a href="${art.url}" target="_blank" class="article-link">
                            Read Full Story <i class="fa-solid fa-arrow-up-right-from-square"></i>
                        </a>`;
                    newsGrid.appendChild(card);
                });
            }
        } catch (e) { console.error(e); }
        hideLoader();
    }

    window.fetchDetailedNews = fetchDetailedNews;

    async function loadInitialList(query = '') {
        showLoader();
        backBtn.classList.add('hidden');
        searchSection.classList.remove('hidden');
        newsTitle.innerHTML = query
            ? `Results for <span>${query}</span>`
            : `<span>Trending</span> Updates`;

        const url = query
            ? `https://api.jikan.moe/v4/anime?q=${encodeURIComponent(query)}&limit=15`
            : `https://api.jikan.moe/v4/top/anime?filter=airing&limit=15`;

        try {
            const res  = await fetch(url);
            const data = await res.json();

            if (!data.data || data.data.length === 0) {
                newsGrid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon"><i class="fa-solid fa-magnifying-glass"></i></div>
                        <p>No results found</p>
                        <span>Try a different search</span>
                    </div>`;
            } else {
                data.data.forEach((anime, i) => {
                    const card = document.createElement('div');
                    card.className = 'news-item-card';
                    card.style.animationDelay = `${i * 0.04}s`;
                    card.onclick = () => fetchDetailedNews(anime.mal_id, anime.title);
                    card.innerHTML = `
                        <div class="img-wrap">
                            <img src="${anime.images.jpg.image_url}" alt="${anime.title}" loading="lazy">
                            <div class="rank-badge">${i + 1}</div>
                        </div>
                        <div class="news-info">
                            <div class="news-headline">${anime.title}</div>
                            <div class="news-footer">
                                <div class="news-meta">
                                    <i class="fa-solid fa-newspaper"></i> View Articles
                                </div>
                                <div class="news-arrow">
                                    <i class="fa-solid fa-chevron-right"></i>
                                </div>
                            </div>
                        </div>`;
                    newsGrid.appendChild(card);
                });
            }
        } catch (e) { console.error(e); }
        hideLoader();
    }

    window.loadInitialList = loadInitialList;

    searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') loadInitialList(searchInput.value.trim());
    });
    searchBtn.addEventListener('click', () => loadInitialList(searchInput.value.trim()));
</script>
</body>
</html>
