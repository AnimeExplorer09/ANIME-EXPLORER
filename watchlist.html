<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My List</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7c4dff">
    <style>
        :root{--primary:#5738B0;--primary-glow:rgba(87,56,176,.35);--bg:#0f1014;--card:#16181f;--card2:#1e2029;--border:rgba(255,255,255,.06);--dim:#64748b;}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
        @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

        /* ── TYPE SWITCHER ── */
        .type-switcher{display:flex;background:#1a1c22;margin:14px;padding:4px;border-radius:14px;border:1px solid #2a2a35;position:relative;}
        .type-btn{flex:1;padding:10px;border:none;background:transparent;color:#666;font-size:13px;font-weight:700;z-index:2;cursor:pointer;transition:.3s;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;}
        .type-btn.active{color:white;}
        .type-indicator{position:absolute;top:4px;left:4px;width:calc(50% - 4px);height:calc(100% - 8px);background:var(--primary);border-radius:10px;transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:1;}
        .type-switcher[data-active="manga"] .type-indicator{transform:translateX(100%);}

        /* ── FILTERS ── */
        .filter-container{display:flex;gap:8px;padding:0 14px 14px;overflow-x:auto;scrollbar-width:none;}
        .filter-container::-webkit-scrollbar{display:none;}
        .filter-btn{display:flex;align-items:center;gap:6px;padding:7px 16px;background:rgba(255,255,255,.05);color:#666;border-radius:30px;font-size:12px;font-weight:700;white-space:nowrap;border:1px solid transparent;cursor:pointer;transition:.25s;flex-shrink:0;}
        .filter-btn.active{color:white;border-color:rgba(255,255,255,.12);}
        .filter-btn[data-filter="all"].active{background:#2a2a35;}
        .filter-btn[data-filter="watching"].active{background:#1565c0;}
        .filter-btn[data-filter="completed"].active{background:#1b5e20;color:#4ade80;}
        .filter-btn[data-filter="plan"].active{background:#e65100;color:#ffcc80;}

        /* ── BOOK CARD ── */
        .book-card{margin:10px 12px;border-radius:20px;background:var(--card);border:1px solid var(--border);overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.5);position:relative;animation:fadeUp .3s ease both;}
        .book-banner{position:relative;height:130px;overflow:hidden;}
        .book-banner-bg{position:absolute;inset:-10px;background-size:cover;background-position:center;filter:blur(18px) brightness(.35) saturate(1.4);transform:scale(1.1);transition:background-image 0.4s ease;}
        .book-banner-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.1) 0%,rgba(0,0,0,.75) 100%);}
        .book-banner-content{position:absolute;inset:0;display:flex;align-items:flex-end;padding:12px 14px;gap:12px;}
        .active-thumb{width:62px;height:88px;border-radius:10px;object-fit:cover;flex-shrink:0;box-shadow:0 4px 16px rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.15);cursor:pointer;transition:opacity .2s ease;}
        .book-banner-info{flex:1;min-width:0;padding-bottom:2px;}
        .book-series-title{font-size:16px;font-weight:900;color:white;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;margin-bottom:4px;}
        .active-season-label{font-size:10px;font-weight:800;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;display:flex;align-items:center;flex-wrap:wrap;gap:3px;}
        .banner-ep-row{display:flex;align-items:center;gap:8px;}
        .banner-ep-track{flex:1;height:5px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden;}
        .banner-ep-fill{height:100%;border-radius:3px;transition:width .4s ease;}
        .banner-ep-text{font-size:11px;font-weight:800;color:rgba(255,255,255,.85);white-space:nowrap;}
        .book-rate-btn{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(255,215,0,.4);background:rgba(0,0,0,.5);backdrop-filter:blur(8px);color:#ffd700;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;cursor:pointer;transition:.2s;z-index:5;}
        .book-rate-btn:active{transform:scale(.88);}
        .book-ep-controls{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 8px;border-bottom:1px solid var(--border);gap:8px;}
        .ep-ctrl-label{font-size:10px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:5px;flex:1;flex-wrap:wrap;}
        .ep-ctrl-box{display:flex;align-items:center;background:var(--bg);border-radius:12px;border:1px solid rgba(255,255,255,.1);height:38px;overflow:hidden;flex-shrink:0;}
        .ep-ctrl-btn{width:36px;height:100%;background:transparent;color:white;border:none;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:background .15s;}
        .ep-ctrl-btn:active{background:rgba(87,56,176,.3);}
        .ep-num-display{min-width:70px;text-align:center;font-size:14px;font-weight:900;color:white;cursor:pointer;padding:0 6px;}
        .ep-num-edit{width:70px;height:100%;background:var(--primary);color:white;border:none;text-align:center;font-size:14px;font-weight:900;outline:none;}
        .ep-num-edit::-webkit-outer-spin-button,.ep-num-edit::-webkit-inner-spin-button{-webkit-appearance:none;}
        .season-chips-wrap{display:flex;align-items:center;gap:7px;padding:10px 14px;overflow-x:auto;scrollbar-width:none;}
        .season-chips-wrap::-webkit-scrollbar{display:none;}
        .season-chip{flex-shrink:0;padding:6px 14px;border-radius:20px;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.08);color:#666;font-size:11px;font-weight:800;cursor:pointer;transition:.2s;white-space:nowrap;display:flex;align-items:center;gap:4px;}
        .season-chip.active{background:var(--primary);border-color:var(--primary);color:white;box-shadow:0 0 12px var(--primary-glow);}
        .season-chip.done{border-color:rgba(74,222,128,.3);color:#4ade80;}
        .season-chip.done.active{background:#166534;border-color:#4ade80;color:#4ade80;}
        .new-ep-badge{background:#ef4444;color:white;font-size:9px;font-weight:900;padding:2px 7px;border-radius:20px;animation:pulse 1.5s infinite;}
        .airing-dot{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:800;color:#4ade80;}
        .airing-dot span{width:6px;height:6px;background:#4ade80;border-radius:50%;display:inline-block;animation:pulse 1.5s infinite;}

        /* ── SIMPLE CARD ── */
        .simple-card{margin:10px 12px;border-radius:16px;background:var(--card);border:1px solid var(--border);display:flex;align-items:stretch;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.35);position:relative;min-height:105px;animation:fadeUp .3s ease both;}
        .simple-status-bar{width:4px;flex-shrink:0;}
        .simple-cover{width:72px;object-fit:cover;flex-shrink:0;cursor:pointer;}
        .simple-info{flex:1;padding:11px 12px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;}
        .simple-title{font-size:14px;font-weight:800;color:white;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;}
        .simple-status-pill{display:inline-flex;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;padding:2px 8px;border-radius:20px;margin-top:5px;width:fit-content;}
        .simple-controls{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;background:rgba(0,0,0,.2);border-left:1px solid var(--border);flex-shrink:0;}
        .simple-rate-btn{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,215,0,.3);background:rgba(255,215,0,.08);color:#ffd700;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;}
        .simple-ep-box{display:flex;align-items:center;background:var(--bg);border-radius:9px;border:1px solid rgba(255,255,255,.08);height:30px;width:100px;overflow:hidden;}
        .simple-ctrl-btn{flex:1;background:transparent;color:white;border:none;cursor:pointer;font-size:11px;}
        .simple-ep-display{flex:1.5;font-size:10px;font-weight:800;color:white;text-align:center;cursor:pointer;}
        .simple-progress{position:absolute;bottom:0;left:0;height:3px;transition:width .4s ease;}

        /* ── EP RATE STAR BUTTON (on cards) ── */
        .ep-rate-star-btn{background:rgba(255,215,0,.08);border:1px solid rgba(255,215,0,.22);color:#FFD700;padding:4px 10px;border-radius:20px;font-size:9px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:3px;flex-shrink:0;line-height:1;transition:.15s;}
        .ep-rate-star-btn:active{transform:scale(.9);background:rgba(255,215,0,.16);}

        /* ── EP RATING PANEL (main bottom sheet) ── */
        .ep-panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:2500;display:flex;justify-content:center;align-items:flex-end;visibility:hidden;opacity:0;transition:.22s;backdrop-filter:blur(12px);}
        .ep-panel-overlay.show{visibility:visible;opacity:1;}
        .ep-panel-sheet{background:#1a1c24;width:100%;border-radius:24px 24px 0 0;padding:0;border-top:1px solid rgba(87,56,176,.3);transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;}
        .ep-panel-overlay.show .ep-panel-sheet{transform:translateY(0);}
        .ep-panel-handle{width:36px;height:4px;background:#333;border-radius:2px;margin:12px auto 0;flex-shrink:0;}
        .ep-panel-header{padding:14px 16px 10px;flex-shrink:0;}
        .ep-panel-body{flex:1;overflow-y:auto;padding:0 16px 8px;}
        .ep-panel-footer{padding:10px 16px 36px;flex-shrink:0;border-top:1px solid var(--border);}

        /* Season tabs in panel */
        .ep-panel-season-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:12px;}
        .ep-panel-season-tabs::-webkit-scrollbar{display:none;}
        .ep-season-tab{flex-shrink:0;padding:5px 14px;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:#666;font-size:11px;font-weight:700;cursor:pointer;transition:.2s;}
        .ep-season-tab.active{background:var(--primary);border-color:var(--primary);color:white;}

        /* Episode cells */
        .ep-cell{border-radius:9px;padding:6px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:.15s;border:1px solid rgba(0,0,0,.15);min-height:46px;}
        .ep-cell:active{transform:scale(.92);filter:brightness(1.2);}
        .ep-cell-num{font-size:8px;font-weight:700;color:rgba(255,255,255,.55);line-height:1;}
        .ep-cell-score{font-size:13px;font-weight:900;color:white;line-height:1;}
        .ep-cell-score.no-score{font-size:17px;color:rgba(255,255,255,.18);}
        .ep-cell.ep-empty{background:rgba(255,255,255,.03);border:1px dashed rgba(255,255,255,.08);}
        .r-awesome{background:linear-gradient(135deg,#21a453,#1a7d40);}
        .r-great{background:linear-gradient(135deg,#57c26e,#43a857);}
        .r-good{background:linear-gradient(135deg,#d4b84a,#b89a35);}
        .r-regular{background:linear-gradient(135deg,#e07b39,#c5642a);}
        .r-bad{background:linear-gradient(135deg,#c94040,#a52e2e);}

        /* Legend */
        .ep-legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
        .legend-item{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--dim);}
        .legend-dot{width:9px;height:9px;border-radius:2px;}

        /* ── SINGLE EP RATE MODAL ── */
        .single-ep-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:3000;display:flex;justify-content:center;align-items:flex-end;visibility:hidden;opacity:0;transition:.2s;backdrop-filter:blur(8px);}
        .single-ep-overlay.show{visibility:visible;opacity:1;}
        .single-ep-sheet{background:#1e2029;width:100%;border-radius:22px 22px 0 0;padding:20px 20px 44px;border-top:1px solid rgba(87,56,176,.3);transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);}
        .single-ep-overlay.show .single-ep-sheet{transform:translateY(0);}
        .single-ep-handle{width:36px;height:4px;background:#333;border-radius:2px;margin:0 auto 16px;}
        .ep-score-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px;}
        .ep-score-btn{background:var(--bg);border:1px solid #2a2a35;padding:12px 0;border-radius:10px;font-size:15px;font-weight:800;color:#666;cursor:pointer;text-align:center;transition:.2s;font-family:inherit;}
        .ep-score-btn.sel{background:var(--primary);color:white;border-color:var(--primary);transform:scale(1.05);}
        .ep-score-btn:active{opacity:.8;}

        /* ── COMMON MODALS ── */
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:2000;display:flex;justify-content:center;align-items:center;visibility:hidden;opacity:0;transition:.22s;backdrop-filter:blur(8px);}
        .modal-overlay.show{visibility:visible;opacity:1;}
        .modal-box{background:#1e2029;width:88%;max-width:320px;border-radius:22px;padding:24px 20px;text-align:center;border:1px solid rgba(255,255,255,.08);transform:scale(.9);transition:transform .22s;}
        .modal-overlay.show .modal-box{transform:scale(1);}
        .modal-box h3{color:white;font-size:17px;font-weight:900;margin-bottom:6px;}
        .modal-box p{color:#888;font-size:13px;margin-bottom:16px;}
        .rating-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0;}
        .rating-item{background:var(--bg);border:1px solid #2a2a35;padding:10px 0;border-radius:10px;color:#666;cursor:pointer;font-weight:800;font-size:14px;transition:.2s;}
        .rating-item.selected{background:var(--primary);color:white;border-color:var(--primary);}
        .btn-modal-primary{background:var(--primary);color:white;border:none;padding:14px;border-radius:12px;font-weight:900;width:100%;cursor:pointer;font-size:14px;font-family:inherit;}
        .btn-modal-danger{background:#c62828;color:white;border:none;padding:14px;border-radius:12px;font-weight:900;cursor:pointer;font-size:14px;flex:1;font-family:inherit;}
        .btn-modal-cancel{background:transparent;color:#888;border:1px solid #2a2a35;padding:14px;border-radius:12px;cursor:pointer;font-size:14px;flex:1;font-family:inherit;}
        .modal-btn-row{display:flex;gap:10px;}

        /* ── TOAST ── */
        .fetch-toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(87,56,176,.95);color:white;font-size:11px;font-weight:700;padding:8px 18px;border-radius:20px;backdrop-filter:blur(10px);opacity:0;transition:.3s;pointer-events:none;z-index:100;white-space:nowrap;}
        .fetch-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

        /* ── NAV ── */
        .bottom-nav{background:#161c24!important;border-radius:25px 25px 0 0;height:80px;border-top:1px solid rgba(255,255,255,.05)!important;box-shadow:0 -10px 30px rgba(0,0,0,.5);}
        .nav-item{text-decoration:none;color:#94a3b8;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:4px;transition:.2s ease;}
        .nav-item i{font-size:20px;}
        .nav-item span{font-size:10px;font-weight:600;}
        .nav-item.active{color:#5738B0;}
        .nav-item:active{transform:scale(.9);}
        .hidden{display:none!important;}
        .text-center{text-align:center;}
    </style>
</head>
<body>
    <header class="app-header"><div class="logo">My List</div></header>
    <div class="container" style="padding-bottom:100px;">
        <div class="type-switcher" id="typeSwitcher" data-active="anime">
            <div class="type-indicator"></div>
            <button class="type-btn active" onclick="switchType('anime')"><i class="fa-solid fa-tv"></i> Anime</button>
            <button class="type-btn" onclick="switchType('manga')"><i class="fa-solid fa-book-open"></i> Manga</button>
        </div>
        <div class="filter-container">
            <button class="filter-btn active" data-filter="all"       onclick="filterList('all',this)"><i class="fa-solid fa-layer-group"></i> All</button>
            <button class="filter-btn" data-filter="watching"         onclick="filterList('watching',this)"><i class="fa-solid fa-eye"></i> Watching</button>
            <button class="filter-btn" data-filter="completed"        onclick="filterList('completed',this)"><i class="fa-solid fa-check-circle"></i> Completed</button>
            <button class="filter-btn" data-filter="plan"             onclick="filterList('plan',this)"><i class="fa-solid fa-clock"></i> Plan</button>
        </div>
        <div id="loadingSpinner" class="text-center" style="margin-top:60px;">
            <i class="fa-solid fa-circle-notch fa-spin" style="font-size:32px;color:#5738B0;"></i>
        </div>
        <div id="listContainer"></div>
        <div id="emptyState" class="hidden text-center" style="margin-top:70px;">
            <i class="fa-solid fa-book-open" style="font-size:44px;color:#2a2a35;margin-bottom:14px;display:block;"></i>
            <p style="color:#444;font-size:14px;font-weight:700;">Your list is empty</p>
            <p style="color:#333;font-size:12px;margin-top:6px;">Search anime and add them!</p>
        </div>
    </div>

    <!-- FETCH TOAST -->
    <div class="fetch-toast" id="fetchToast">
        <i class="fa-solid fa-circle-notch fa-spin" style="margin-right:6px;"></i>
        <span id="fetchToastMsg">Updating...</span>
    </div>

    <!-- RATE MODAL (series score) -->
    <div id="rateModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="rateTitle">Rate Anime</h3><p>Tap your score</p>
            <input type="hidden" id="rateId">
            <div class="rating-grid" id="ratingOptions"></div>
            <button class="btn-modal-primary" onclick="saveRating()">Save Rating</button>
            <button onclick="closeModal('rateModal')" style="margin-top:10px;background:none;border:none;color:#555;cursor:pointer;width:100%;padding:8px;font-family:inherit;">Cancel</button>
        </div>
    </div>

    <!-- COMPLETED MODAL -->
    <div id="completedModal" class="modal-overlay">
        <div class="modal-box">
            <div style="font-size:36px;margin-bottom:10px;">🎉</div>
            <h3 id="completedTitle">Done!</h3>
            <p id="completedSubtitle">Mark as completed?</p>
            <input type="hidden" id="pendingCompId">
            <input type="hidden" id="pendingCompVal">
            <input type="hidden" id="pendingCompSeason">
            <div class="modal-btn-row">
                <button class="btn-modal-primary" style="background:#166534;color:#4ade80;" onclick="confirmCompletion()"><i class="fa-solid fa-check"></i> Yes!</button>
                <button class="btn-modal-cancel" onclick="closeModal('completedModal')">Not yet</button>
            </div>
        </div>
    </div>

    <!-- DELETE MODAL -->
    <div id="deleteModal" class="modal-overlay">
        <div class="modal-box">
            <div style="font-size:32px;margin-bottom:10px;">🗑️</div>
            <h3>Remove from list?</h3>
            <p id="deleteTitle"></p>
            <input type="hidden" id="deleteId">
            <div class="modal-btn-row">
                <button class="btn-modal-danger" onclick="confirmDelete()">Remove</button>
                <button class="btn-modal-cancel" onclick="closeModal('deleteModal')">Cancel</button>
            </div>
        </div>
    </div>

    <!-- ══════════════════════════════════════════════════
         EPISODE RATING PANEL (main bottom sheet)
    ══════════════════════════════════════════════════ -->
    <div class="ep-panel-overlay" id="epRatePanel">
        <div class="ep-panel-sheet">
            <div class="ep-panel-handle"></div>

            <!-- Header -->
            <div class="ep-panel-header">
                <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;">
                    <div style="flex:1;min-width:0;">
                        <div style="font-size:10px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;">
                            <i class="fa-solid fa-star" style="color:#FFD700;font-size:9px;"></i> Episode Ratings
                        </div>
                        <div id="epPanelTitle" style="font-size:15px;font-weight:900;color:white;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></div>
                    </div>
                    <div style="text-align:right;flex-shrink:0;margin-left:12px;">
                        <div id="epPanelAvg" style="font-size:24px;font-weight:900;color:#FFD700;line-height:1;">—</div>
                        <div style="font-size:9px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.4px;">My Avg</div>
                    </div>
                </div>
                <!-- Legend -->
                <div class="ep-legend">
                    <div class="legend-item"><div class="legend-dot r-awesome"></div>9-10</div>
                    <div class="legend-item"><div class="legend-dot r-great"></div>8+</div>
                    <div class="legend-item"><div class="legend-dot r-good"></div>7+</div>
                    <div class="legend-item"><div class="legend-dot r-regular"></div>6+</div>
                    <div class="legend-item"><div class="legend-dot r-bad"></div>&lt;6</div>
                </div>
                <!-- Season tabs -->
                <div class="ep-panel-season-tabs hidden" id="epPanelSeasonTabs"></div>
            </div>

            <!-- Scrollable grid body -->
            <div class="ep-panel-body" id="epPanelGrid">
                <div style="text-align:center;padding:32px;color:var(--dim);font-size:13px;">
                    <i class="fa-solid fa-circle-notch fa-spin"></i>
                </div>
            </div>

            <!-- Footer close -->
            <div class="ep-panel-footer">
                <button onclick="closeEpPanel()"

async function loadList(uid){
    try{
        const snap=await getDocs(collection(db,"users",uid,"watchlist"));
        allAnime=[];
        snap.forEach(d=>allAnime.push({...d.data(),_docId:d.id}));
        allAnime.sort((a,b)=>(b.addedAt?.seconds||0)-(a.addedAt?.seconds||0));
        document.getElementById('loadingSpinner').classList.add('hidden');
        renderList('all');
    }catch(e){
        document.getElementById('loadingSpinner').classList.add('hidden');
        console.error(e);
    }
}

/* ══════════════════════════════════════════════════════
   AUTO FETCH EPISODES via Gemini AI
══════════════════════════════════════════════════════ */
async function autoFetchEpisodes(uid,isNewAnime=false,specificMalId=null){
    const now=Date.now();
    let anyUpdate=false;

    for(const anime of allAnime){
        if(!anime.isSeriesCard||!Array.isArray(anime.seasons))continue;
        if(specificMalId&&String(anime.malId)!==String(specificMalId))continue;

        const staleSeasons=anime.seasons.filter(sn=>{
            if(isNewAnime)return true;
            if(sn.episodes===0)return true;
            const lastUp=sn.episodesLastUpdated||0;
            const ongoing=sn.isAiring;
            return (now-lastUp)>(ongoing?THREE_HOURS:THREE_DAYS);
        });
        if(staleSeasons.length===0)continue;

        showToast(`Updating ${anime.seriesName||anime.title}...`);
        try{
            const res=await fetch('/api/gemini-episodes',{
                method:'POST',headers:{'Content-Type':'application/json'},
                body:JSON.stringify({seasons:staleSeasons.map(s=>({num:s.num,title:s.title,malId:s.malId,isAiring:s.isAiring||false}))})
            });
            if(!res.ok)continue;
            const {results}=await res.json();
            let changed=false;
            anime.seasons=anime.seasons.map(sn=>{
                const found=results?.find(r=>r.num===sn.num);
                if(!found)return sn;
                const u={...sn,episodesLastUpdated:now};
                if(found.episodes>0)u.episodes=found.episodes;
                if(typeof found.isAiring==='boolean')u.isAiring=found.isAiring;
                if(found.latestEpisode>0)u.latestEpisode=found.latestEpisode;
                changed=true;
                return u;
            });
            if(changed){
                anyUpdate=true;
                await updateDoc(doc(db,"users",uid,"watchlist",String(anime.malId)),{seasons:anime.seasons});
            }
        }catch(e){console.warn('Gemini ep fetch error:',anime.seriesName,e);}
        await new Promise(r=>setTimeout(r,300));
    }

    hideToast();
    if(anyUpdate)renderList(document.querySelector('.filter-btn.active')?.dataset.filter||'all');
    if(!isNewAnime&&!specificMalId)setTimeout(()=>autoFetchEpisodes(uid,false),THREE_HOURS);
}

window.switchType=type=>{
    currentType=type;
    document.getElementById('typeSwitcher').setAttribute('data-active',type);
    document.querySelectorAll('.type-btn').forEach(btn=>
        btn.classList.toggle('active',
            (type==='anime'&&btn.innerText.includes('Anime'))||
            (type==='manga'&&btn.innerText.includes('Manga'))
        )
    );
    renderList(document.querySelector('.filter-btn.active')?.dataset.filter||'all');
};

function renderList(filter){
    container.innerHTML='';
    const filtered=allAnime.filter(a=>{
        const tm=(a.type||'anime')===currentType;
        const sl=(a.status||'').toLowerCase();
        const sm=filter==='all'||(filter==='completed'&&sl.includes('complet'))||
            (filter==='watching'&&sl.includes('watch')&&!sl.includes('plan'))||
            (filter==='plan'&&sl.includes('plan'));
        return tm&&sm;
    });
    document.getElementById('emptyState').classList.toggle('hidden',filtered.length!==0);
    filtered.forEach(anime=>{
        if(anime.isSeriesCard&&Array.isArray(anime.seasons)&&anime.seasons.length>0){
            renderBookCard(anime);
        }else{
            renderSimpleCard(anime);
        }
    });
}

/* ══════════════ BOOK CARD ══════════════ */
function getStatusColor(sl){
    if(sl.includes('complet'))return '#4ade80';
    if(sl.includes('plan'))return '#fb923c';
    if(sl.includes('drop'))return '#f87171';
    return '#60a5fa';
}

function renderBookCard(anime){
    const card=document.createElement('div');
    card.className='book-card';
    card.dataset.mid=anime.malId;
    attachLongPress(card,()=>openDeleteModal(anime.malId,anime.seriesName||anime.title));
    rebuildBookCard(card,anime);
    container.appendChild(card);
}

function rebuildBookCard(card,anime){
    const seasons=anime.seasons;
    const activeNum=anime.activeSeason||seasons[0].num;
    const activeSn=seasons.find(s=>s.num===activeNum)||seasons[0];
    const sl=(anime.status||'').toLowerCase();
    const sc=getStatusColor(sl);
    const ep=activeSn.watchedEpisodes||0;
    const total=activeSn.episodes||0;
    const latest=activeSn.latestEpisode||total;
    const isOngoing=activeSn.isAiring===true;
    const score=anime.userScore||0;
    const pct=total>0?Math.min(100,Math.round((ep/total)*100)):(sl.includes('complet')?100:0);
    const epText=total>0?`${ep}/${total}`:`${ep}/?`;
    const hasNewEp=isOngoing&&latest>0&&ep<latest;
    const airingDot=isOngoing?`<span class="airing-dot"><span></span>AIRING</span>`:'';
    const newEpBadge=hasNewEp?`<span class="new-ep-badge">EP ${latest} OUT</span>`:'';

    const chipsHTML=seasons.map(sn=>{
        const snDone=sn.episodes>0&&(sn.watchedEpisodes||0)>=sn.episodes;
        const snHasNew=sn.isAiring&&(sn.latestEpisode||0)>(sn.watchedEpisodes||0);
        const isAct=sn.num===activeSn.num;
        const cls=['season-chip',isAct?'active':'',snDone?'done':''].filter(Boolean).join(' ');
        const dot=snDone&&!isAct
            ?`<i class="fa-solid fa-check" style="font-size:8px;"></i>`
            :snHasNew&&!isAct
                ?`<span style="width:5px;height:5px;background:#ef4444;border-radius:50%;display:inline-block;"></span>`
                :'';
        return `<div class="${cls}" onclick="selectSeason('${anime.malId}',${sn.num})">S${sn.num}${dot}</div>`;
    }).join('');

    card.innerHTML=`
        <div class="book-banner">
            <div class="book-banner-bg" style="background-image:url('${activeSn.image}')"></div>
            <div class="book-banner-overlay"></div>
            <button class="book-rate-btn" onclick="event.stopPropagation();openRateModal('${anime.malId}')">
                ${score>0?score:'<i class="fa-regular fa-star" style="font-size:12px;"></i>'}
            </button>
            <div class="book-banner-content">
                <img class="active-thumb" src="${activeSn.image}"
                     onclick="location.href='details.html?id=${activeSn.malId}&type=anime'">
                <div class="book-banner-info">
                    <div class="book-series-title"
                         onclick="location.href='details.html?id=${anime.malId}&type=anime'">
                        ${anime.seriesName||anime.title}
                    </div>
                    <div class="active-season-label">
                        S${activeSn.num} of ${seasons.length} &nbsp;·&nbsp;
                        <span style="color:${sc};">${anime.status}</span>
                        ${airingDot}
                    </div>
                    <div class="banner-ep-row">
                        <div class="banner-ep-track">
                            <div class="banner-ep-fill" style="width:${pct}%;background:${sc};"></div>
                        </div>
                        <span class="banner-ep-text">${epText} ep</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="book-ep-controls">
            <span class="ep-ctrl-label">
                <i class="fa-solid fa-play" style="font-size:8px;color:var(--primary);"></i>
                Episodes ${newEpBadge}
            </span>
            <!-- ⭐ Rate Episodes button -->
            <button class="ep-rate-star-btn"
                    onclick="event.stopPropagation();openEpRatePanel('${anime.malId}')">
                <i class="fa-solid fa-star" style="font-size:8px;"></i> Rate Eps
            </button>
            <div class="ep-ctrl-box">
                <button class="ep-ctrl-btn" onclick="updateBookEp('${anime.malId}',${activeSn.num},-1)">
                    <i class="fa-solid fa-minus" style="font-size:10px;"></i>
                </button>
                <div class="ep-num-display"
                     onclick="startBookEdit('${anime.malId}',${activeSn.num},${total},this)">
                    ${epText}
                </div>
                <button class="ep-ctrl-btn" onclick="updateBookEp('${anime.malId}',${activeSn.num},1)">
                    <i class="fa-solid fa-plus" style="font-size:10px;"></i>
                </button>
            </div>
        </div>
        <div class="season-chips-wrap">
            <span style="font-size:10px;font-weight:800;color:var(--dim);flex-shrink:0;">
                <i class="fa-solid fa-layer-group" style="font-size:9px;"></i> Seasons
            </span>
            ${chipsHTML}
        </div>`;
}

window.selectSeason=async(rootId,seasonNum)=>{
    vib();
    const anime=allAnime.find(a=>String(a.malId)===String(rootId));
    if(!anime)return;
    anime.activeSeason=seasonNum;
    updateDoc(doc(db,"users",currentUid,"watchlist",String(rootId)),{activeSeason:seasonNum}).catch(console.error);
    const card=container.querySelector(`[data-mid="${rootId}"]`);
    if(!card)return;
    const activeSn=anime.seasons.find(s=>s.num===seasonNum)||anime.seasons[0];
    const bannerBg=card.querySelector('.book-banner-bg');
    if(bannerBg){
        bannerBg.style.opacity='0';
        setTimeout(()=>{bannerBg.style.backgroundImage=`url('${activeSn.image}')`;bannerBg.style.opacity='1';},200);
    }
    const thumb=card.querySelector('.active-thumb');
    if(thumb){
        thumb.style.opacity='0';
        setTimeout(()=>{thumb.src=activeSn.image;thumb.onclick=()=>location.href=`details.html?id=${activeSn.malId}&type=anime`;thumb.style.opacity='1';},200);
    }
    rebuildBookCard(card,anime);
};

window.updateBookEp=async(rootId,seasonNum,change)=>{
    vib();
    const anime=allAnime.find(a=>String(a.malId)===String(rootId));
    if(!anime)return;
    const sn=anime.seasons.find(s=>s.num===seasonNum);
    if(!sn)return;
    const total=sn.episodes||0;
    let newVal=Math.max(0,(sn.watchedEpisodes||0)+change);
    if(total>0&&newVal>total)return;
    sn.watchedEpisodes=newVal;
    if(total>0&&newVal>=total){
        const nextSn=anime.seasons.find(s=>s.num>seasonNum);
        document.getElementById('pendingCompId').value=rootId;
        document.getElementById('pendingCompVal').value=newVal;
        document.getElementById('pendingCompSeason').value=seasonNum;
        document.getElementById('completedTitle').innerText=`Season ${seasonNum} complete! 🎉`;
        document.getElementById('completedSubtitle').innerText=nextSn
            ?`Switch to Season ${nextSn.num}?`
            :`Mark "${anime.seriesName||anime.title}" as Completed?`;
        document.getElementById('completedModal').classList.add('show');
    }else{
        await saveAndRerender(anime);
    }
};

window.startBookEdit=(rootId,seasonNum,totalEps,el)=>{
    vib();
    const anime=allAnime.find(a=>String(a.malId)===String(rootId));
    const sn=anime?.seasons?.find(s=>s.num===seasonNum);
    if(!sn)return;
    const input=document.createElement('input');
    input.type='number';input.className='ep-num-edit';
    input.value=sn.watchedEpisodes||0;
    el.replaceWith(input);input.focus();input.select();
    const commit=async()=>{
        let val=parseInt(input.value);
        if(isNaN(val)||val<0)val=sn.watchedEpisodes||0;
        if(totalEps>0&&val>totalEps)val=totalEps;
        sn.watchedEpisodes=val;
        await saveAndRerender(anime);
    };
    input.onblur=commit;
    input.onkeydown=e=>{if(e.key==='Enter')input.blur();};
};

window.confirmCompletion=async()=>{
    const rootId=document.getElementById('pendingCompId').value;
    const newVal=parseInt(document.getElementById('pendingCompVal').value);
    const seasonNum=parseInt(document.getElementById('pendingCompSeason').value);
    const anime=allAnime.find(a=>String(a.malId)===String(rootId));
    closeModal('completedModal');
    if(!anime)return;
    if(anime.isSeriesCard){
        const sn=anime.seasons?.find(s=>s.num===seasonNum);
        if(sn)sn.watchedEpisodes=newVal;
        const nextSn=anime.seasons.find(s=>s.num>seasonNum);
        if(nextSn){
            anime.activeSeason=nextSn.num;
        }else{
            const allDone=anime.seasons.every(s=>s.episodes>0&&(s.watchedEpisodes||0)>=s.episodes);
            if(allDone)anime.status='Completed';
        }
        await saveAndRerender(anime,true);
    }else{
        anime.watchedEpisodes=newVal;anime.status='completed';
        await updateDoc(doc(db,"users",currentUid,"watchlist",String(rootId)),{watchedEpisodes:newVal,status:'completed'});
        renderList(document.querySelector('.filter-btn.active')?.dataset.filter||'all');
    }
};

async function saveAndRerender(anime,saveStatus=false){
    try{
        const p={seasons:anime.seasons,activeSeason:anime.activeSeason||anime.seasons[0].num};
        if(saveStatus)p.status=anime.status;
        await updateDoc(doc(db,"users",currentUid,"watchlist",String(anime.malId)),p);
    }catch(e){console.error(e);}
    const card=container.querySelector(`[data-mid="${anime.malId}"]`);
    if(card)rebuildBookCard(card,anime);
}

/* ══════════════ SIMPLE CARD ══════════════ */
function renderSimpleCard(anime){

    const score=anime.userScore||0;
    const season=anime.season||1;
    const sl=(anime.status||'').toLowerCase();
    const sc=getStatusColor(sl);
    const pct=sl.includes('complet')?100:total>0?(watched/total)*100:0;
    const epText=total>0?`${watched}/${total}`:`${watched}/?`;
    const label=currentType==='manga'?'V':'S';
    const div=document.createElement('div');
    div.className='simple-card';div.dataset.mid=anime.malId;
    attachLongPress(div,()=>openDeleteModal(anime.malId,anime.title));
    div.innerHTML=`
        <div class="simple-status-bar" style="background:${sc};"></div>
        <img src="${anime.image}" class="simple-cover"
             onclick="location.href='details.html?id=${anime.malId}&type=${anime.type||'anime'}'">
        <div class="simple-info"
             onclick="location.href='details.html?id=${anime.malId}&type=${anime.type||'anime'}'">
            <div class="simple-title">${anime.title}</div>
            <div style="display:flex;align-items:center;gap:6px;margin-top:5px;">
                <span class="simple-status-pill" style="background:${sc}20;color:${sc};">${anime.status}</span>
                <button class="ep-rate-star-btn"
                        style="font-size:8px;padding:2px 8px;"
                        onclick="event.stopPropagation();openEpRatePanel('${anime.malId}')">
                    <i class="fa-solid fa-star" style="font-size:7px;"></i> Rate
                </button>
            </div>
        </div>
        <div class="simple-controls">
            <div class="simple-rate-btn" onclick="event.stopPropagation();openRateModal('${anime.malId}')">
                ${score>0?score:'<i class="fa-regular fa-star"></i>'}
            </div>
            <div class="simple-ep-box" style="width:90px;">
                <button class="simple-ctrl-btn" onclick="simpleUpdateSeason('${anime.malId}',-1)">
                    <i class="fa-solid fa-minus" style="font-size:9px;"></i>
                </button>
                <div class="simple-ep-display" onclick="simpleStartEdit('${anime.malId}','season',this)">${label}${season}</div>
                <button class="simple-ctrl-btn" onclick="simpleUpdateSeason('${anime.malId}',1)">
                    <i class="fa-solid fa-plus" style="font-size:9px;"></i>
                </button>
            </div>
            <div class="simple-ep-box">
                <button class="simple-ctrl-btn" onclick="simpleUpdateEp('${anime.malId}',-1)">
                    <i class="fa-solid fa-minus" style="font-size:9px;"></i>
                </button>
                <div class="simple-ep-display" onclick="simpleStartEdit('${anime.malId}','watchedEpisodes',this)">${epText}</div>
                <button class="simple-ctrl-btn" onclick="simpleUpdateEp('${anime.malId}',1)">
                    <i class="fa-solid fa-plus" style="font-size:9px;"></i>
                </button>
            </div>
        </div>
        <div class="simple-progress" style="width:${pct}%;background:${sc};"></div>`;
    container.appendChild(div);
}

window.simpleUpdateSeason=async(id,change)=>{
    vib();
    const anime=allAnime.find(a=>String(a.malId)===String(id));
    const nv=Math.max(1,(anime.season||1)+change);
    anime.season=nv;
    await updateDoc(doc(db,"users",currentUid,"watchlist",String(id)),{season:nv});
    renderList(document.querySelector('.filter-btn.active')?.dataset.filter||'all');
};

window.simpleUpdateEp=async(id,change)=>{
    vib();
    const anime=allAnime.find(a=>String(a.malId)===String(id));
    const total=anime.totalEpisodes||anime.episodes||0;
    let nv=Math.max(0,(anime.watchedEpisodes||0)+change);
    if(total>0&&nv>total)return;
    if(total>0&&nv===total){
        document.getElementById('pendingCompId').value=id;
        document.getElementById('pendingCompVal').value=nv;
        document.getElementById('pendingCompSeason').value='';
        document.getElementById('completedTitle').innerText=`${anime.title} — Done!`;
        document.getElementById('completedSubtitle').innerText='Mark as Completed?';
        document.getElementById('completedModal').classList.add('show');
        anime.watchedEpisodes=nv;return;
    }
    anime.watchedEpisodes=nv;
    await updateDoc(doc(db,"users",currentUid,"watchlist",String(id)),{watchedEpisodes:nv});
    renderList(document.querySelector('.filter-btn.active')?.dataset.filter||'all');
};

window.simpleStartEdit=function(id,field,el){
    vib();
    const anime=allAnime.find(a=>String(a.malId)===String(id));
    const curr=field==='season'?(anime.season||1):(anime.watchedEpisodes||0);
    const input=document.createElement('input');
    input.type='number';input.className='ep-num-edit';
    input.style.cssText='width:60px;height:100%;border-radius:0;';
    input.value=curr;el.replaceWith(input);input.focus();
    input.onblur=async()=>{
        const val=parseInt(input.value)||curr;
        anime[field]=val;
        await updateDoc(doc(db,"users",currentUid,"watchlist",String(id)),{[field]:val});
        renderList(document.querySelector('.filter-btn.active')?.dataset.filter||'all');
    };
    input.onkeydown=e=>{if(e.key==='Enter')input.blur();};
};

/* ══════════════ COMMON LIST ACTIONS ══════════════ */
window.filterList=(filter,btn)=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');renderList(filter);
};

window.openRateModal=id=>{
    const anime=allAnime.find(a=>String(a.malId)===String(id));
    document.getElementById('rateId').value=id;
    document.getElementById('rateTitle').innerText=anime.seriesName||anime.title;
    tempScore=anime.userScore||0;
    const grid=document.getElementById('ratingOptions');grid.innerHTML='';
    for(let i=1;i<=10;i++){
        const item=document.createElement('div');
        item.className=`rating-item${i===tempScore?' selected':''}`;
        item.innerText=i;
        item.onclick=()=>{tempScore=i;document.querySelectorAll('.rating-item').forEach(el=>el.classList.remove('selected'));item.classList.add('selected');};
        grid.appendChild(item);
    }
    document.getElementById('rateModal').classList.add('show');
};

window.saveRating=async()=>{
    const id=document.getElementById('rateId').value;
    const anime=allAnime.find(a=>String(a.malId)===String(id));
    if(anime)anime.userScore=tempScore;
    await updateDoc(doc(db,"users",currentUid,"watchlist",String(id)),{userScore:tempScore});
    closeModal('rateModal');
    renderList(document.querySelector('.filter-btn.active')?.dataset.filter||'all');
};

window.openDeleteModal=(id,title)=>{
    document.getElementById('deleteId').value=id;
    document.getElementById('deleteTitle').innerText=`"${title}" will be removed.`;
    document.getElementById('deleteModal').classList.add('show');
};

window.confirmDelete=async()=>{
    const id=document.getElementById('deleteId').value;
    await deleteDoc(doc(db,"users",currentUid,"watchlist",String(id)));
    allAnime=allAnime.filter(a=>String(a.malId)!==String(id));
    closeModal('deleteModal');
    renderList(document.querySelector('.filter-btn.active')?.dataset.filter||'all');
};

window.closeModal=id=>document.getElementById(id).classList.remove('show');

function attachLongPress(el,cb){
    let timer,startY=0;
    el.ontouchstart=e=>{startY=e.touches[0].clientY;timer=setTimeout(cb,800);};
    el.ontouchmove=e=>{if(Math.abs(e.touches[0].clientY-startY)>12)clearTimeout(timer);};
    el.ontouchend=()=>clearTimeout(timer);
}
function showToast(msg){document.getElementById('fetchToastMsg').innerText=msg;document.getElementById('fetchToast').classList.add('show');}
function hideToast(){document.getElementById('fetchToast').classList.remove('show');}

/* ════════════════════════════════════════════════════════════════
   EPISODE RATING SYSTEM
   ─────────────────────────────────────────────────────────────
   - Har anime/season ke liye episode grid dikhaata hai
   - User har episode ko 1-10 rate kar sakta hai
   - Ratings same Firebase collection use karti hain jaise details.html
   - episode_cache se titles bhi load hoti hain (shared cache)
════════════════════════════════════════════════════════════════ */
const RATING_LABELS={1:'😞 Appalling',2:'😑 Horrible',3:'😕 Very Bad',4:'🙁 Bad',5:'😐 Average',6:'🙂 Fine',7:'😊 Good',8:'😃 Very Good',9:'🤩 Great',10:'⚡ Masterpiece'};
const COLS=6;

let panelAnime=null;           // currently open anime object
let panelSeasonMalId=null;     // malId of currently shown season
let panelSeasonNum=1;          // season number currently shown
let panelEpRatings={};         // { [epNum]: myRating (0 = not rated) }
let panelEpisodes=[];          // episode list for current season
let panelUnsubscribe=null;     // onSnapshot cleanup
let singleEpNum=null;          // episode being rated in single modal
let singleEpSeasonMalId=null;
let selectedSingleScore=0;

function getRatingClass(score){
    if(!score||score===0)return'';
    if(score>=9)return'r-awesome';
    if(score>=8)return'r-great';
    if(score>=7)return'r-good';
    if(score>=6)return'r-regular';
    return'r-bad';
}

// ── Open panel ──
window.openEpRatePanel=async(rootId)=>{
    vib();
    const anime=allAnime.find(a=>String(a.malId)===String(rootId));
    if(!anime)return;
    panelAnime=anime;

    // Build season list — series card has seasons[], simple card gets a fake single season
    const seasons=anime.isSeriesCard&&Array.isArray(anime.seasons)
        ?anime.seasons
        :[{num:1,malId:anime.malId,episodes:anime.totalEpisodes||anime.episodes||0,title:anime.title}];

    // Title
    document.getElementById('epPanelTitle').innerText=anime.seriesName||anime.title;

    // Season tabs — show only if more than 1 season
    const tabsEl=document.getElementById('epPanelSeasonTabs');
    if(seasons.length>1){
        tabsEl.classList.remove('hidden');
        tabsEl.innerHTML=seasons.map(s=>
            `<div class="ep-season-tab${s.num===(anime.activeSeason||1)?' active':''}"
                  onclick="switchPanelSeason(${s.num})">S${s.num}</div>`
        ).join('');
    }else{
        tabsEl.classList.add('hidden');
    }

    // Open panel
    document.getElementById('epRatePanel').classList.add('show');

    // Load the active/first season
    const startSeason=seasons.find(s=>s.num===(anime.activeSeason||1))||seasons[0];
    panelSeasonNum=startSeason.num;
    await loadPanelSeason(startSeason);
};

// ── Switch season in panel ──
window.switchPanelSeason=async(num)=>{
    vib();
    const seasons=panelAnime.isSeriesCard&&Array.isArray(panelAnime.seasons)?panelAnime.seasons:[];
    const sn=seasons.find(s=>s.num===num);
    if(!sn)return;
    panelSeasonNum=num;
    document.querySelectorAll('.ep-season-tab').forEach(t=>
        t.classList.toggle('active',parseInt(t.innerText.replace('S',''))===num)
    );
    await loadPanelSeason(sn);
};

// ── Load season data + ratings ──
async function loadPanelSeason(sn){
    panelSeasonMalId=sn.malId;
    panelEpRatings={};

    // Show spinner
    document.getElementById('epPanelGrid').innerHTML=
        '<div style="text-align:center;padding:40px;color:#444;"><i class="fa-solid fa-circle-notch fa-spin" style="font-size:24px;"></i></div>';

    // Unsubscribe old listener
    if(panelUnsubscribe){panelUnsubscribe();panelUnsubscribe=null;}

    // Load episodes
    panelEpisodes=await getPanelEpisodes(sn.malId,sn.episodes||0);

    // Live ratings listener
    panelUnsubscribe=onSnapshot(
        collection(db,"anime_ep_ratings",String(sn.malId),"episodes"),
        snap=>{
            panelEpRatings={};
            snap.forEach(d=>{
                const epNum=parseInt(d.id);
                const myR=currentUid?(d.data()[`user_${currentUid}`]||0):0;
                panelEpRatings[epNum]=myR;
            });
            updatePanelAvg();
            renderPanelGrid();
        }
    );
}

// ── Get episodes (from cache or placeholders) ──
async function getPanelEpisodes(seasonMalId,totalEps){
    try{
        const snap=await getDoc(doc(db,"episode_cache",String(seasonMalId)));
        if(snap.exists()&&Array.isArray(snap.data().episodes)&&snap.data().episodes.length>0){
            console.log('[EP Panel] Cache hit for malId:',seasonMalId);
            return snap.data().episodes;
        }
    }catch(e){console.warn('[EP Panel] Cache read error:',e);}

    // Fallback: generate placeholder titles
    const count=Math.min(totalEps||12,2000);
    if(count===0)return[];
    return Array.from({length:count},(_,i)=>({num:i+1,title:`Episode ${i+1}`}));
}

// ── Render episode grid ──
function renderPanelGrid(){
    const eps=panelEpisodes;
    if(!eps.length){
        document.getElementById('epPanelGrid').innerHTML=
            '<p style="color:var(--dim);font-size:13px;text-align:center;padding:20px;">No episode data available.</p>';
        return;
    }
    let html='<div style="padding:2px 0 8px;">';
    for(let i=0;i<eps.length;i+=COLS){
        html+='<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:5px;">';
        for(let j=i;j<i+COLS;j++){
            const ep=eps[j];
            if(!ep){html+='<div></div>';continue;}
            const myR=panelEpRatings[ep.num]||0;
            const cls=myR>0?getRatingClass(myR):'ep-empty';
            const scoreHtml=myR>0
                ?`<span class="ep-cell-score">${myR}</span>`
                :`<span class="ep-cell-score no-score">+</span>`;
            html+=`<div class="ep-cell ${cls}"
                title="E${ep.num}: ${ep.title}"
                onclick="openSingleEpSheet(${ep.num},'${ep.title.replace(/'/g,"\\'")}')">
                <span class="ep-cell-num">E${ep.num}</span>
                ${scoreHtml}
            </div>`;
        }
        html+='</div>';
    }
    html+='</div>';
    document.getElementById('epPanelGrid').innerHTML=html;
}

// ── Update avg score display ──
function updatePanelAvg(){
    const rated=Object.values(panelEpRatings).filter(v=>v>0);
    document.getElementById('epPanelAvg').innerText=rated.length
        ?(rated.reduce((s,v)=>s+v,0)/rated.length).toFixed(1)
        :'—';
}

// ── Close panel ──
window.closeEpPanel=()=>{
    document.getElementById('epRatePanel').classList.remove('show');
    if(panelUnsubscribe){panelUnsubscribe();panelUnsubscribe=null;}
    panelAnime=null;panelEpisodes=[];panelEpRatings={};
};

/* ── Single Episode Rate Modal ── */
window.openSingleEpSheet=(epNum,epTitle)=>{
    if(!currentUid){alert("Please login to rate episodes");return;}
    singleEpNum=epNum;
    singleEpSeasonMalId=panelSeasonMalId;
    selectedSingleScore=panelEpRatings[epNum]||0;

    document.getElementById('singleEpLabel').innerText=`Season ${panelSeasonNum} · Episode ${epNum}`;
    document.getElementById('singleEpTitle').innerText=epTitle;

    // Build 1–10 grid
    const grid=document.getElementById('singleEpScoreGrid');
    grid.innerHTML='';
    for(let i=1;i<=10;i++){
        const btn=document.createElement('button');
        btn.className=`ep-score-btn${i===selectedSingleScore?' sel':''}`;
        btn.innerText=i;btn.title=RATING_LABELS[i]||'';
        btn.onclick=()=>{
            selectedSingleScore=i;
            document.querySelectorAll('.ep-score-btn').forEach((b,idx)=>
                b.classList.toggle('sel',idx+1===i)
            );
        };
        grid.appendChild(btn);
    }
    document.getElementById('singleEpModal').classList.add('show');
};

window.closeSingleEpModal=()=>{
    document.getElementById('singleEpModal').classList.remove('show');
    singleEpNum=null;selectedSingleScore=0;
};

window.saveSingleEpRating=async()=>{
    if(!currentUid||!singleEpNum||!selectedSingleScore)return;
    const epRef=doc(db,"anime_ep_ratings",String(singleEpSeasonMalId),"episodes",String(singleEpNum));
    try{
        await runTransaction(db,async tx=>{
            const snap=await tx.get(epRef);
            const prevKey=`user_${currentUid}`;
            const prev=snap.exists()?(snap.data()[prevKey]||0):0;
            const isNew=prev===0;
            let tv=snap.exists()?(snap.data().totalVotes||0):0;
            let ts=snap.exists()?(snap.data().totalSum  ||0):0;
            if(isNew){tv+=1;}else{ts-=prev;}
            ts+=selectedSingleScore;
            tx.set(epRef,{totalVotes:tv,totalSum:ts,[prevKey]:selectedSingleScore,lastUpdated:serverTimestamp()},{merge:true});
        });
        closeSingleEpModal();
        // panelEpRatings update onSnapshot se automatically ho jaayega
    }catch(e){console.error(e);alert("Failed. Try again.");}
};

</script>
