<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My List</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
       
        .type-switcher {
            display: flex;
            background: #1a1c22;
            margin: 15px;
            padding: 4px;
            border-radius: 14px;
            border: 1px solid #333;
            position: relative;
        }
        .type-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: #888;
            font-size: 13px;
            font-weight: 700;
            z-index: 2;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .type-btn.active { color: white; }
        .type-indicator {
            position: absolute;
            top: 4px; left: 4px;
            width: calc(50% - 4px);
            height: calc(100% - 8px);
            background: #5738B0;
            border-radius: 10px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1;
        }
        .type-switcher[data-active="manga"] .type-indicator { transform: translateX(100%); }


        .filter-container { display: flex; gap: 12px; padding: 0 15px 15px; overflow-x: auto; scrollbar-width: none; }
        .filter-container::-webkit-scrollbar { display: none; }
        .filter-btn { display: flex; align-items: center; gap: 8px; padding: 8px 18px; background: rgba(255, 255, 255, 0.08); color: #aaa; border-radius: 30px; font-size: 13px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; cursor: pointer; transition: 0.3s; }
        .filter-btn.active { color: white; border-color: rgba(255,255,255,0.2); }
        .filter-btn[data-filter="all"].active { background: #444; }
        .filter-btn[data-filter="watching"].active { background: #2979ff; }
        .filter-btn[data-filter="completed"].active { background: #00e676; color: black; }
        .filter-btn[data-filter="plan"].active { background: #ffab00; color: black; }

  
        .mal-card {
            display: flex; 
            align-items: stretch; 
            background: var(--bg-card);
            margin: 10px 8px; 
            border-radius: 12px; 
            border-left: 5px solid var(--primary);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4); 
            position: relative; 
            overflow: hidden;
            min-height: 110px; 
            transition: 0.2s;
            width: calc(100% - 2px); 
        }

        .mal-img { 
            width: 80px; 
            height: auto; 
            object-fit: cover; 
            flex-shrink: 0; 
        }

        .mal-info { 
            flex: 2; 
            padding: 12px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            min-width: 0;
        }

        .mal-title { 
            font-size: 15px; 
            font-weight: 700; 
            color: white; 
            line-height: 1.3;
            display: -webkit-box; 
            -webkit-line-clamp: 2; 
            -webkit-box-orient: vertical; 
            overflow: hidden; 
        }

        .mal-meta { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            margin-top: 8px;
        }

        .status-label {
            font-weight: 800;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-rate { 
            width: 32px; 
            height: 32px; 
            flex-shrink: 0; 
            border-radius: 50%; 
            border: 1px solid rgba(255, 215, 0, 0.4); 
            background: rgba(255, 215, 0, 0.1); 
            color: #ffd700; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin: 0 auto; /* Center in the column */
        }
        .controls-wrapper { 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            gap: 6px; 
            padding: 8px;
            background: rgba(0,0,0,0.2);
            border-left: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
            align-items: center;
        }

        .ep-control-box { 
            display: flex; 
            align-items: center; 
            background: #0f1014; 
            border-radius: 8px; 
            border: 1px solid #333; 
            height: 32px;
            width: 100px; 
        }

        .ctrl-btn { 
            flex: 1;
            background: transparent; 
            color: #fff; 
            border: none; 
            cursor: pointer;
            font-size: 12px;
        }

        .ep-display, .sn-display { 
            flex: 1.5;
            font-size: 11px; 
            font-weight: bold; 
            color: white; 
            text-align: center; 
        }

        .progress-line { 
            position: absolute; 
            bottom: 0; 
            left: 0; 
            height: 4px; 
            background: var(--primary);
        }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; display: flex; justify-content: center; align-items: center; visibility: hidden; opacity: 0; transition: 0.2s; backdrop-filter: blur(5px); }
        .modal-overlay.show { visibility: visible; opacity: 1; }
        .modal-box { background: #1e1e24; width: 85%; max-width: 320px; border-radius: 15px; padding: 25px; text-align: center; border: 1px solid #333; }
        .rating-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 20px 0; }
        .rating-item { background: #0f1014; border: 1px solid #333; padding: 10px 0; border-radius: 8px; color: #888; cursor: pointer; }
        .rating-item.selected { background: #5738B0; color: white; }
        .btn-primary-gold { background: #5738B0; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; width: 100%; }
        
        .bottom-nav {
        background: #161c24 !important;
        border-radius: 25px 25px 0 0;
        height: 80px;
        border-top: 1px solid rgba(255,255,255,0.05) !important;
        box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
    }

.nav-item {
    text-decoration: none;
    color: #94a3b8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    gap: 4px;
    transition: 0.2s ease;
}

.nav-item i {
    font-size: 20px; /* Standard Icon Size */
}

.nav-item span {
    font-size: 10px; /* Standard Text Size */
    font-weight: 600;
}
.nav-item.active {
    color: #5738B0; /* Your Brand Purple */
}

.nav-item:active {
    transform: scale(0.9);
}
.edit-input {
    width: 100%;
    height: 100%;
    background: #5738B0;
    color: white;
    border: none;
    border-radius: 6px;
    text-align: center;
    font-size: 13px;
    font-weight: 800;
    outline: none;
    box-shadow: 0 0 12px rgba(87, 56, 176, 0.7);
    animation: bounceIn 0.2s ease-out;
}
.edit-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="logo">My List</div>
    </header>

    <div class="container" style="padding-bottom: 90px;">
        <div class="type-switcher" id="typeSwitcher" data-active="anime">
            <div class="type-indicator"></div>
            <button class="type-btn active" onclick="switchType('anime')"><i class="fa-solid fa-tv"></i> Anime</button>
            <button class="type-btn" onclick="switchType('manga')"><i class="fa-solid fa-book-open"></i> Manga</button>
        </div>

        <div class="filter-container">
            <button class="filter-btn active" data-filter="all" onclick="filterList('all', this)"><i class="fa-solid fa-layer-group"></i> All</button>
            <button class="filter-btn" data-filter="watching" onclick="filterList('watching', this)"><i class="fa-solid fa-eye"></i> Watching</button>
            <button class="filter-btn" data-filter="completed" onclick="filterList('completed', this)"><i class="fa-solid fa-check-circle"></i> Completed</button>
            <button class="filter-btn" data-filter="plan" onclick="filterList('plan', this)"><i class="fa-solid fa-clock"></i> Plan</button>
        </div>

        <div id="loading" class="text-center" style="margin-top:50px;"><i class="fa-solid fa-circle-notch fa-spin" style="font-size:30px; color:#5738B0;"></i></div>
        <div id="listContainer"></div>
        <div id="emptyState" class="hidden text-center" style="margin-top:50px; color:#555;"><i class="fa-solid fa-box-open" style="font-size:40px; margin-bottom:10px;"></i><p>List is empty</p></div>
    </div>

    <div id="rateModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="rateTitle" style="color:white; font-size:16px;">Title</h3>
            <input type="hidden" id="rateId">
            <div class="rating-grid" id="ratingOptions"></div>
            <button class="btn-primary-gold" onclick="saveRating()">Save Rating</button>
            <button onclick="closeModal('rateModal')" style="margin-top:10px; background:none; border:none; color:#aaa;">Close</button>
        </div>
    </div>

    <div id="completedModal" class="modal-overlay">
        <div class="modal-box">
            <h3 style="color: white;">Finished?</h3>
            <p id="completedTitle" style="color: #aaa; font-size: 13px; margin: 15px 0;"></p>
            <input type="hidden" id="pendingCompId"><input type="hidden" id="pendingCompVal">
            <div style="display: flex; gap: 10px;">
                <button onclick="confirmCompletion()" style="flex:1; padding: 12px; border-radius: 8px; background: #00e676; border: none; font-weight: bold;">Yes</button>
                <button onclick="closeModal('completedModal')" style="flex:1; background: transparent; color: #aaa; border: 1px solid #333; border-radius: 8px;">No</button>
            </div>
        </div>
    </div>

    <div id="deleteModal" class="modal-overlay">
        <div class="modal-box">
            <h3 style="color: white;">Remove?</h3>
            <p id="deleteTitle" style="color: #aaa; font-size: 13px; margin: 15px 0;"></p>
            <input type="hidden" id="deleteId">
            <div style="display: flex; gap: 10px;">
                <button onclick="confirmDelete()" style="flex:1; padding: 12px; border-radius: 8px; background: #ff5252; color: white; border: none; font-weight: bold;">Delete</button>
                <button onclick="closeModal('deleteModal')" style="flex:1; background: transparent; color: #aaa; border: 1px solid #333; border-radius: 8px;">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDLd3TW-y89lwShUmcIHw3YGzDjo4cg3y4",
            authDomain: "animea2z.firebaseapp.com",
            projectId: "animea2z",
            storageBucket: "animea2z.firebasestorage.app",
            messagingSenderId: "673605765684",
            appId: "1:673605765684:web:a6f851e0d79836b79b1861"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
const triggerFeedback = () => {
    if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate(90); // 20ms ka light vibration
    }
};

        let allAnime = [];
        let currentType = 'anime';
        let tempSelectedScore = 0;
        const container = document.getElementById('listContainer');

        onAuthStateChanged(auth, async (user) => {
            if (user) await fetchList(user.uid);
            else window.location.href = "login.html";
        });

        async function fetchList(uid) {
            try {
                const snapshot = await getDocs(collection(db, "users", uid, "watchlist"));
                allAnime = [];
                snapshot.forEach(doc => allAnime.push(doc.data()));
               allAnime.sort((a, b) => (b.addedAt?.seconds || 0) - (a.addedAt?.seconds || 0)); document.getElementById('loading').classList.add('hidden');
                renderList('all');
            } catch (error) { 
                document.getElementById('loading').classList.add('hidden');
            }
        }

        window.switchType = (type) => {
            currentType = type;
            document.getElementById('typeSwitcher').setAttribute('data-active', type);
            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.toLowerCase().includes(type));
            });
            const activeFilter = document.querySelector('.filter-btn.active').dataset.filter;
            renderList(activeFilter);
        };

        function renderList(filter) {
            container.innerHTML = '';                 
            const filtered = allAnime.filter(a => {
                const typeMatch = (a.type || 'anime') === currentType;
                const sl = (a.status || '').toLowerCase();
const statusMatch = filter === 'all' 
    || (filter === 'completed' && sl.includes('complet'))
    || (filter === 'watching'  && sl.includes('watch') && !sl.includes('plan'))
    || (filter === 'plan'      && sl.includes('plan'));
                return typeMatch && statusMatch;
            });

            if(filtered.length === 0) {
                document.getElementById('emptyState').classList.remove('hidden');
                return;
            }
            document.getElementById('emptyState').classList.add('hidden');

            filtered.forEach(anime => {
                const watched = anime.watchedEpisodes || 0;
                const total = anime.totalEpisodes || anime.episodes || 0;
                const score = anime.userScore || 0;
                const season = anime.season || 1;
                const labelText = currentType === 'manga' ? 'V' : 'S';
                
                const s = (anime.status || '').toLowerCase();
let statusColor = '#2979ff'; // Watching — blue
if(s.includes('complet')) { statusColor = '#00e676'; } // Completed — green
if(s.includes('plan'))    { statusColor = '#ffab00'; } // Plan to Watch — orange

// Completed ho to progress 100%
let progressWidth = 0;
if(s.includes('complet')) {
    progressWidth = 100;
} else if(total > 0) {
    progressWidth = (watched / total) * 100;
}

                const div = document.createElement('div');
                div.className = 'mal-card';
                div.style.borderLeftColor = statusColor;
                
                
                let touchStartY = 0;
                let pressTimer;
                div.ontouchstart = (e) => {
    touchStartY = e.touches[0].clientY;
    pressTimer = setTimeout(() => { openDeleteModal(anime.malId, anime.title); }, 800);
                };
                div.ontouchmove = (e) => {
                    if (Math.abs(e.touches[0].clientY - touchStartY) > 10) clearTimeout(pressTimer);
                };
                div.ontouchend = () => clearTimeout(pressTimer);

                div.innerHTML = `
                   <img src="${anime.image}" class="mal-img" onclick="window.location.href='details.html?id=${anime.malId}&type=${anime.type||`anime`}'">
<div class="mal-info" onclick="window.location.href='details.html?id=${anime.malId}&type=${anime.type||`anime`}'">
                        <div class="mal-title">${anime.title}</div>
                        <div class="mal-meta">
                            <span class="status-label" style="color:${statusColor};">${anime.status}</span>
                        </div>
                    </div>
                    <div class="controls-wrapper">
                        <div class="btn-rate" onclick="event.stopPropagation(); openRateModal('${anime.malId}')">
    ${score > 0 ? score : '<i class="fa-regular fa-star"></i>'}
</div>
<div class="ep-control-box" style="border-color: #444;">
    <button class="ctrl-btn" onclick="updateSeason('${anime.malId}', -1)"><i class="fa-solid fa-minus"></i></button>
    <div class="sn-display" onclick="startEdit('${anime.malId}', 'season', this)"><span class="label-tiny">${labelText}</span>${season}</div>
    <button class="ctrl-btn" onclick="updateSeason('${anime.malId}', 1)"><i class="fa-solid fa-plus"></i></button>
</div>
<div class="ep-control-box">
    <button class="ctrl-btn" onclick="updateEp('${anime.malId}', -1)"><i class="fa-solid fa-minus"></i></button>
    <div class="ep-display" onclick="startEdit('${anime.malId}', 'watchedEpisodes', this)">${watched}/${total || '?'}</div>
    <button class="ctrl-btn" onclick="updateEp('${anime.malId}', 1)"><i class="fa-solid fa-plus"></i></button>
</div>
                    </div>
                    <div class="progress-line" style="width: ${progressWidth}%; background:${statusColor};"></div>
                `;
                container.appendChild(div);
            });
        };

       
        window.filterList = (status, btn) => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderList(status);
        };

window.updateSeason = async (id, change) => {
    triggerFeedback();
    const anime = allAnime.find(a => String(a.malId) === String(id));
    let newVal = (anime.season || 1) + change;
    if(newVal < 1) return;
    // Agar plan to watch tha aur ep badhaya toh watching kar do
const isPlan = (anime.status || '').toLowerCase().includes('plan');
const updateData = { watchedEpisodes: newVal };
if (isPlan && newVal > 0) {
    updateData.status = 'Watching';
    anime.status = 'Watching';
}

await updateDoc(doc(db, "users", auth.currentUser.uid, "watchlist", String(id)), updateData);
anime.watchedEpisodes = newVal;
    renderList(document.querySelector('.filter-btn.active').dataset.filter);
};

window.updateEp = async (id, change) => {
    triggerFeedback();
    const anime = allAnime.find(a => String(a.malId) === String(id));
    const total = anime.totalEpisodes || anime.episodes || 0;
    let newVal = (anime.watchedEpisodes || 0) + change;
    if(newVal < 0 || (total > 0 && newVal > total)) return;
    
    if (total > 0 && newVal === total && anime.status !== 'completed') {
        document.getElementById('pendingCompId').value = id;
        document.getElementById('pendingCompVal').value = newVal;
        document.getElementById('completedTitle').innerText = `Mark "${anime.title}" as Completed?`;
        document.getElementById('completedModal').classList.add('show');
        return;
    }
    await updateDoc(doc(db, "users", auth.currentUser.uid, "watchlist", String(id)), { watchedEpisodes: newVal });
    anime.watchedEpisodes = newVal;
    renderList(document.querySelector('.filter-btn.active').dataset.filter);
};
        window.confirmCompletion = async () => {
            const id = document.getElementById('pendingCompId').value;
            const newVal = parseInt(document.getElementById('pendingCompVal').value);
            const anime = allAnime.find(a => String(a.malId) === String(id));
            await updateDoc(doc(db, "users", auth.currentUser.uid, "watchlist", String(id)), { watchedEpisodes: newVal, status: 'completed' });
            anime.watchedEpisodes = newVal; anime.status = 'completed';
            closeModal('completedModal'); renderList(document.querySelector('.filter-btn.active').dataset.filter);
        };
        window.openRateModal = (id) => {
    const anime = allAnime.find(a => String(a.malId) === String(id));
            document.getElementById('rateId').value = id;
            document.getElementById('rateTitle').innerText = anime.title;
            tempSelectedScore = anime.userScore || 0;
            const grid = document.getElementById('ratingOptions');
            grid.innerHTML = '';
            for(let i=1; i<=10; i++) {
                const item = document.createElement('div');
                item.className = `rating-item ${i === tempSelectedScore ? 'selected' : ''}`;
                item.innerText = i;
                item.onclick = () => {
                    tempSelectedScore = i;
                    document.querySelectorAll('.rating-item').forEach(el => el.classList.remove('selected'));
                    item.classList.add('selected');
                };
                grid.appendChild(item);
            }
            document.getElementById('rateModal').classList.add('show');
        };

        window.saveRating = async () => {
            const id = document.getElementById('rateId').value;
            await updateDoc(doc(db, "users", auth.currentUser.uid, "watchlist", String(id)), { userScore: tempSelectedScore });
            allAnime.find(a => String(a.malId) === String(id)).userScore = tempSelectedScore;
            closeModal('rateModal'); renderList(document.querySelector('.filter-btn.active').dataset.filter);
        };

        window.openDeleteModal = (id, title) => {
            document.getElementById('deleteId').value = id;
            document.getElementById('deleteTitle').innerText = `Remove "${title}"?`;
            document.getElementById('deleteModal').classList.add('show');
        };

        window.confirmDelete = async () => {
            const id = document.getElementById('deleteId').value;
            await deleteDoc(doc(db, "users", auth.currentUser.uid, "watchlist", String(id)));
            allAnime = allAnime.filter(a => String(a.id) !== String(id));
            closeModal('deleteModal'); renderList('all');
        };
        window.closeModal = (id) => document.getElementById(id).classList.remove('show');
        
        window.startEdit = function(id, field, element) {
        triggerFeedback();
            const anime = allAnime.find(a => String(a.id) === String(id));
            const currentVal = field === 'season' ? (anime.season || 1) : (anime.watchedEpisodes || 0);
            const input = document.createElement('input');
            input.type = 'number'; input.className = 'edit-input'; input.value = currentVal;
            element.innerHTML = ''; element.appendChild(input);
            input.focus();
            input.onblur = async () => {
                let newVal = parseInt(input.value) || currentVal;
                await updateDoc(doc(db, "users", auth.currentUser.uid, "watchlist", String(id)), { [field]: newVal });
                anime[field] = newVal;
                renderList(document.querySelector('.filter-btn.active').dataset.filter);
            };
        };
    </script>
</body>
</html>
