<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My List</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7c4dff">
    <style>
        :root {
            --primary: #5738B0;
            --primary-glow: rgba(87,56,176,0.35);
            --bg: #0f1014;
            --card: #16181f;
            --card2: #1e2029;
            --border: rgba(255,255,255,0.06);
            --dim: #64748b;
        }

        /* ══════════════════════════════
           TYPE SWITCHER
        ══════════════════════════════ */
        .type-switcher {
            display: flex; background: #1a1c22;
            margin: 14px; padding: 4px;
            border-radius: 14px; border: 1px solid #2a2a35;
            position: relative;
        }
        .type-btn {
            flex: 1; padding: 10px; border: none;
            background: transparent; color: #666;
            font-size: 13px; font-weight: 700;
            z-index: 2; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center;
            justify-content: center; gap: 8px; border-radius: 10px;
        }
        .type-btn.active { color: white; }
        .type-indicator {
            position: absolute; top: 4px; left: 4px;
            width: calc(50% - 4px); height: calc(100% - 8px);
            background: var(--primary); border-radius: 10px;
            transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
            z-index: 1;
        }
        .type-switcher[data-active="manga"] .type-indicator { transform: translateX(100%); }

        /* ══════════════════════════════
           FILTER TABS
        ══════════════════════════════ */
        .filter-container {
            display: flex; gap: 8px; padding: 0 14px 14px;
            overflow-x: auto; scrollbar-width: none;
        }
        .filter-container::-webkit-scrollbar { display: none; }
        .filter-btn {
            display: flex; align-items: center; gap: 6px;
            padding: 7px 16px;
            background: rgba(255,255,255,0.05);
            color: #666; border-radius: 30px;
            font-size: 12px; font-weight: 700;
            white-space: nowrap; border: 1px solid transparent;
            cursor: pointer; transition: 0.25s; flex-shrink: 0;
        }
        .filter-btn.active { color: white; border-color: rgba(255,255,255,0.12); }
        .filter-btn[data-filter="all"].active      { background: #2a2a35; }
        .filter-btn[data-filter="watching"].active { background: #1565c0; }
        .filter-btn[data-filter="completed"].active{ background: #1b5e20; color: #4ade80; }
        .filter-btn[data-filter="plan"].active     { background: #e65100; color: #ffcc80; }

        /* ══════════════════════════════
           SERIES BOOK CARD (new premium)
        ══════════════════════════════ */
        .book-card {
            margin: 10px 12px;
            border-radius: 20px;
            background: var(--card);
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            position: relative;
        }

        /* ── Banner (blurred active season image) ── */
        .book-banner {
            position: relative;
            height: 130px;
            overflow: hidden;
        }
        .book-banner-bg {
            position: absolute; inset: -10px;
            background-size: cover; background-position: center;
            filter: blur(18px) brightness(0.35) saturate(1.4);
            transform: scale(1.1);
            transition: background-image 0.4s ease;
        }
        .book-banner-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.7) 100%);
        }
        .book-banner-content {
            position: absolute; inset: 0;
            display: flex; align-items: flex-end;
            padding: 12px 14px; gap: 12px;
        }

        /* Active season thumbnail */
        .active-thumb {
            width: 62px; height: 88px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.15);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .active-thumb:active { transform: scale(0.95); }

        .book-banner-info {
            flex: 1; min-width: 0;
            padding-bottom: 2px;
        }
        .book-series-title {
            font-size: 16px; font-weight: 900;
            color: white; line-height: 1.25;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            cursor: pointer;
            margin-bottom: 4px;
        }
        .active-season-label {
            font-size: 10px; font-weight: 800;
            color: rgba(255,255,255,0.6);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 6px;
        }

        /* Episode progress inside banner */
        .banner-ep-row {
            display: flex; align-items: center; gap: 8px;
        }
        .banner-ep-track {
            flex: 1; height: 5px;
            background: rgba(255,255,255,0.15);
            border-radius: 3px; overflow: hidden;
        }
        .banner-ep-fill {
            height: 100%; border-radius: 3px;
            transition: width 0.4s ease;
        }
        .banner-ep-text {
            font-size: 11px; font-weight: 800;
            color: rgba(255,255,255,0.85);
            white-space: nowrap;
        }

        /* Rate button (top-right) */
        .book-rate-btn {
            position: absolute; top: 10px; right: 10px;
            width: 36px; height: 36px;
            border-radius: 50%;
            border: 1.5px solid rgba(255,215,0,0.4);
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            color: #ffd700;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 800;
            cursor: pointer; transition: 0.2s; z-index: 5;
            flex-shrink: 0;
        }
        .book-rate-btn:active { transform: scale(0.88); background: rgba(255,215,0,0.2); }

        /* ── Episode Controls Row ── */
        .book-ep-controls {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 14px 8px;
            border-bottom: 1px solid var(--border);
            gap: 12px;
        }
        .ep-ctrl-label {
            font-size: 10px; font-weight: 800;
            color: var(--dim); text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .ep-ctrl-box {
            display: flex; align-items: center;
            background: var(--bg); border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            height: 38px; overflow: hidden;
        }
        .ep-ctrl-btn {
            width: 36px; height: 100%;
            background: transparent; color: white;
            border: none; cursor: pointer; font-size: 12px;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s;
        }
        .ep-ctrl-btn:active { background: rgba(87,56,176,0.3); }
        .ep-num-display {
            min-width: 70px; text-align: center;
            font-size: 14px; font-weight: 900;
            color: white; cursor: pointer;
            padding: 0 6px;
        }
        .ep-num-edit {
            width: 70px; height: 100%;
            background: var(--primary); color: white;
            border: none; text-align: center;
            font-size: 14px; font-weight: 900;
            outline: none;
        }
        .ep-num-edit::-webkit-outer-spin-button,
        .ep-num-edit::-webkit-inner-spin-button { -webkit-appearance: none; }

        /* ── Season Chips ── */
        .season-chips-wrap {
            display: flex; align-items: center;
            gap: 7px; padding: 10px 14px;
            overflow-x: auto; scrollbar-width: none;
        }
        .season-chips-wrap::-webkit-scrollbar { display: none; }
        .season-chip {
            flex-shrink: 0;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            border: 1.5px solid rgba(255,255,255,0.08);
            color: #666;
            font-size: 11px; font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
            white-space: nowrap;
        }
        .season-chip.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 0 12px var(--primary-glow);
        }
        .season-chip.done {
            border-color: rgba(74,222,128,0.3);
            color: #4ade80;
        }
        .season-chip.done.active {
            background: #166534;
            border-color: #4ade80;
            color: #4ade80;
            box-shadow: 0 0 12px rgba(74,222,128,0.25);
        }
        .chip-check {
            font-size: 8px;
            margin-left: 4px;
        }

        /* ══════════════════════════════
           SINGLE / LEGACY CARD (clean)
        ══════════════════════════════ */
        .simple-card {
            margin: 10px 12px;
            border-radius: 16px;
            background: var(--card);
            border: 1px solid var(--border);
            display: flex; align-items: stretch;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,0.35);
            position: relative;
            min-height: 105px;
        }
        .simple-status-bar {
            width: 4px; flex-shrink: 0;
        }
        .simple-cover {
            width: 72px; object-fit: cover;
            flex-shrink: 0; cursor: pointer;
        }
        .simple-info {
            flex: 1; padding: 11px 12px;
            display: flex; flex-direction: column;
            justify-content: space-between; min-width: 0;
        }
        .simple-title {
            font-size: 14px; font-weight: 800;
            color: white; line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden; cursor: pointer;
        }
        .simple-status-pill {
            display: inline-flex; align-items: center;
            font-size: 9px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 0.5px;
            padding: 2px 8px; border-radius: 20px;
            margin-top: 5px; width: fit-content;
        }
        .simple-controls {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 6px; padding: 10px 10px;
            background: rgba(0,0,0,0.2);
            border-left: 1px solid var(--border);
            flex-shrink: 0;
        }
        .simple-rate-btn {
            width: 32px; height: 32px;
            border-radius: 50%;
            border: 1px solid rgba(255,215,0,0.3);
            background: rgba(255,215,0,0.08);
            color: #ffd700; font-size: 11px; font-weight: 800;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s;
        }
        .simple-rate-btn:active { transform: scale(0.88); }
        .simple-ep-box {
            display: flex; align-items: center;
            background: var(--bg); border-radius: 9px;
            border: 1px solid rgba(255,255,255,0.08);
            height: 30px; width: 100px; overflow: hidden;
        }
        .simple-ctrl-btn {
            flex: 1; background: transparent;
            color: white; border: none; cursor: pointer; font-size: 11px;
        }
        .simple-ep-display {
            flex: 1.5; font-size: 10px; font-weight: 800;
            color: white; text-align: center; cursor: pointer;
        }
        .simple-progress {
            position: absolute; bottom: 0; left: 0;
            height: 3px; transition: width 0.4s ease;
        }

        /* ══════════════════════════════
           MODALS
        ══════════════════════════════ */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.88); z-index: 2000;
            display: flex; justify-content: center; align-items: center;
            visibility: hidden; opacity: 0; transition: 0.22s;
            backdrop-filter: blur(8px);
        }
        .modal-overlay.show { visibility: visible; opacity: 1; }
        .modal-box {
            background: #1e2029; width: 88%; max-width: 320px;
            border-radius: 22px; padding: 24px 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.08);
            transform: scale(0.9); transition: transform 0.22s;
        }
        .modal-overlay.show .modal-box { transform: scale(1); }
        .modal-box h3 { color: white; font-size: 17px; font-weight: 900; margin-bottom: 6px; }
        .modal-box p  { color: #888; font-size: 13px; margin-bottom: 18px; }
        .rating-grid  { display: grid; grid-template-columns: repeat(5,1fr); gap: 8px; margin: 16px 0; }
        .rating-item  { background: var(--bg); border: 1px solid #2a2a35; padding: 10px 0; border-radius: 10px; color: #666; cursor: pointer; font-weight: 800; font-size: 14px; transition: 0.2s; }
        .rating-item.selected { background: var(--primary); color: white; border-color: var(--primary); }
        .btn-modal-primary  { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 900; width: 100%; cursor: pointer; font-size: 14px; font-family: inherit; }
        .btn-modal-danger   { background: #c62828; color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 900; cursor: pointer; font-size: 14px; flex: 1; font-family: inherit; }
        .btn-modal-cancel   { background: transparent; color: #888; border: 1px solid #2a2a35; padding: 14px; border-radius: 12px; cursor: pointer; font-size: 14px; flex: 1; font-family: inherit; }
        .modal-btn-row { display: flex; gap: 10px; }

        /* ══════════════════════════════
           FETCH STATUS TOAST
        ══════════════════════════════ */
        .fetch-toast {
            position: fixed; bottom: 90px; left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(87,56,176,0.95);
            color: white; font-size: 11px; font-weight: 700;
            padding: 8px 18px; border-radius: 20px;
            backdrop-filter: blur(10px);
            opacity: 0; transition: 0.3s;
            pointer-events: none; z-index: 100;
            white-space: nowrap;
        }
        .fetch-toast.show {
            opacity: 1; transform: translateX(-50%) translateY(0);
        }

        /* ══════════════════════════════
           NAV
        ══════════════════════════════ */
        .bottom-nav {
            background: #161c24 !important;
            border-radius: 25px 25px 0 0;
            height: 80px;
            border-top: 1px solid rgba(255,255,255,0.05) !important;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
        }
        .nav-item {
            text-decoration: none; color: #94a3b8;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            flex: 1; gap: 4px; transition: 0.2s ease;
        }
        .nav-item i { font-size: 20px; }
        .nav-item span { font-size: 10px; font-weight: 600; }
        .nav-item.active { color: #5738B0; }
        .nav-item:active { transform: scale(0.9); }

        /* misc */
        .hidden { display: none !important; }
        .text-center { text-align: center; }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="logo">My List</div>
    </header>

    <div class="container" style="padding-bottom: 100px;">

        <div class="type-switcher" id="typeSwitcher" data-active="anime">
            <div class="type-indicator"></div>
            <button class="type-btn active" onclick="switchType('anime')">
                <i class="fa-solid fa-tv"></i> Anime
            </button>
            <button class="type-btn" onclick="switchType('manga')">
                <i class="fa-solid fa-book-open"></i> Manga
            </button>
        </div>

        <div class="filter-container">
            <button class="filter-btn active" data-filter="all" onclick="filterList('all',this)">
                <i class="fa-solid fa-layer-group"></i> All
            </button>
            <button class="filter-btn" data-filter="watching" onclick="filterList('watching',this)">
                <i class="fa-solid fa-eye"></i> Watching
            </button>
            <button class="filter-btn" data-filter="completed" onclick="filterList('completed',this)">
                <i class="fa-solid fa-check-circle"></i> Completed
            </button>
            <button class="filter-btn" data-filter="plan" onclick="filterList('plan',this)">
                <i class="fa-solid fa-clock"></i> Plan
            </button>
        </div>

        <div id="loadingSpinner" class="text-center" style="margin-top:60px;">
            <i class="fa-solid fa-circle-notch fa-spin" style="font-size:32px; color:#5738B0;"></i>
            <p style="color:#444; font-size:12px; margin-top:12px; font-weight:600;">Loading your list...</p>
        </div>

        <div id="listContainer"></div>

        <div id="emptyState" class="hidden text-center" style="margin-top:70px;">
            <i class="fa-solid fa-book-open" style="font-size:44px; color:#2a2a35; margin-bottom:14px; display:block;"></i>
            <p style="color:#444; font-size:14px; font-weight:700;">Your list is empty</p>
            <p style="color:#333; font-size:12px; margin-top:6px;">Search anime and add them!</p>
        </div>
    </div>

    <!-- Fetch toast -->
    <div class="fetch-toast" id="fetchToast">
        <i class="fa-solid fa-circle-notch fa-spin" style="margin-right:6px;"></i>
        <span id="fetchToastMsg">Updating episode counts...</span>
    </div>

    <!-- Rate Modal -->
    <div id="rateModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="rateTitle">Rate Anime</h3>
            <p>Tap your score</p>
            <input type="hidden" id="rateId">
            <div class="rating-grid" id="ratingOptions"></div>
            <button class="btn-modal-primary" onclick="saveRating()">Save Rating</button>
            <button onclick="closeModal('rateModal')"
                style="margin-top:10px;background:none;border:none;color:#555;cursor:pointer;width:100%;padding:8px;font-family:inherit;">
                Cancel
            </button>
        </div>
    </div>

    <!-- Completed confirm Modal -->
    <div id="completedModal" class="modal-overlay">
        <div class="modal-box">
            <div style="font-size:36px; margin-bottom:10px;">🎉</div>
            <h3 id="completedTitle">Season Done!</h3>
            <p id="completedSubtitle">Mark as completed?</p>
            <input type="hidden" id="pendingCompId">
            <input type="hidden" id="pendingCompVal">
            <input type="hidden" id="pendingCompSeason">
            <div class="modal-btn-row">
                <button class="btn-modal-primary" style="background:#166534; color:#4ade80;"
                    onclick="confirmCompletion()">
                    <i class="fa-solid fa-check"></i> Yes!
                </button>
                <button class="btn-modal-cancel" onclick="closeModal('completedModal')">Not yet</button>
            </div>
        </div>
    </div>

    <!-- Delete Modal -->
    <div id="deleteModal" class="modal-overlay">
        <div class="modal-box">
            <div style="font-size:32px; margin-bottom:10px;">🗑️</div>
            <h3>Remove from list?</h3>
            <p id="deleteTitle"></p>
            <input type="hidden" id="deleteId">
            <div class="modal-btn-row">
                <button class="btn-modal-danger" onclick="confirmDelete()">Remove</button>
                <button class="btn-modal-cancel" onclick="closeModal('deleteModal')">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-house"></i><span>Home</span>
        </a>
        <a href="watchlist.html" class="nav-item active">
            <i class="fa-solid fa-bookmark"></i><span>List</span>
        </a>
        <a href="poll.html" class="nav-item">
            <i class="fa-solid fa-chart-bar"></i><span>Polls</span>
        </a>
        <a href="chat.html" class="nav-item">
            <i class="fa-solid fa-comments"></i><span>Chat</span>
        </a>
        <a href="profile.html" class="nav-item">
            <i class="fa-solid fa-user"></i><span>Profile</span>
        </a>
    </nav>

    <script type="module">
        import { initializeApp }   from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import {
            getFirestore, collection, getDocs,
            doc, updateDoc, deleteDoc
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDLd3TW-y89lwShUmcIHw3YGzDjo4cg3y4",
            authDomain: "animea2z.firebaseapp.com",
            projectId: "animea2z",
            storageBucket: "animea2z.firebasestorage.app",
            messagingSenderId: "673605765684",
            appId: "1:673605765684:web:a6f851e0d79836b79b1861"
        };

        const app  = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db   = getFirestore(app);

        /* ── Haptic ── */
        const vib = () => navigator.vibrate?.(50);

        /* ── Constants ── */
        const THREE_DAYS = 3 * 24 * 60 * 60 * 1000;

        let allAnime     = [];
        let currentType  = 'anime';
        let tempScore    = 0;
        let currentUid   = null;

        const container  = document.getElementById('listContainer');

        /* ═══════════════════════════════════════
           AUTH + LOAD
        ═══════════════════════════════════════ */
        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "login.html"; return; }
            currentUid = user.uid;
            await loadList(user.uid);
            // Background: auto-fetch missing/stale episode counts
            autoFetchEpisodes(user.uid);
        });

        async function loadList(uid) {
            try {
                const snap = await getDocs(collection(db, "users", uid, "watchlist"));
                allAnime   = [];
                snap.forEach(d => allAnime.push({ ...d.data(), _docId: d.id }));
                allAnime.sort((a, b) => (b.addedAt?.seconds || 0) - (a.addedAt?.seconds || 0));
                document.getElementById('loadingSpinner').classList.add('hidden');
                renderList('all');
            } catch (e) {
                document.getElementById('loadingSpinner').classList.add('hidden');
                console.error(e);
            }
        }

        /* ═══════════════════════════════════════════════════════
   AUTO FETCH EPISODE COUNTS via Gemini AI
   - Runs silently in background after list loads
   - Fetches counts for seasons where episodes === 0
     OR episodesLastUpdated is older than 3 days
   - One Gemini call per series card (batched per card)
═══════════════════════════════════════════════════════ */
async function autoFetchEpisodes(uid) {
    const THREE_DAYS = 3 * 24 * 60 * 60 * 1000;
    const now = Date.now();
    let anyUpdate = false;

    for (const anime of allAnime) {
        if (!anime.isSeriesCard || !Array.isArray(anime.seasons)) continue;

        // Collect only the seasons that need updating
        const staleSeasons = anime.seasons.filter(sn => {
            const lastUp = sn.episodesLastUpdated || 0;
            return sn.episodes === 0 || (now - lastUp > THREE_DAYS);
        });

        if (staleSeasons.length === 0) continue;

        showToast(`Updating ${anime.seriesName || anime.title}...`);

        try {
            // Send all stale seasons in one Gemini call
            const res = await fetch('/api/gemini-episodes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    seasons: staleSeasons.map(s => ({
                        num:   s.num,
                        title: s.title,
                        malId: s.malId
                    }))
                })
            });

            if (!res.ok) { console.warn('gemini-episodes failed'); continue; }

            const { results } = await res.json();

            // Apply results back to anime.seasons
            let changed = false;
            anime.seasons = anime.seasons.map(sn => {
                const found = results.find(r => r.num === sn.num);
                if (found && found.episodes > 0) {
                    changed = true;
                    return { ...sn, episodes: found.episodes, episodesLastUpdated: now };
                }
                return sn;
            });

            if (changed) {
                anyUpdate = true;
                await updateDoc(
                    doc(db, "users", uid, "watchlist", String(anime.malId)),
                    { seasons: anime.seasons }
                );
            }

        } catch (e) {
            console.warn('Episode fetch error for', anime.seriesName, e);
        }

        // Small gap between series to be polite
        await new Promise(r => setTimeout(r, 300));
    }

    hideToast();

    if (anyUpdate) {
        renderList(document.querySelector('.filter-btn.active')?.dataset.filter || 'all');
    }
}


        /* ═══════════════════════════════════════
           TYPE SWITCH
        ═══════════════════════════════════════ */
        window.switchType = (type) => {
            currentType = type;
            document.getElementById('typeSwitcher').setAttribute('data-active', type);
            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.classList.toggle('active',
                    (type === 'anime' && btn.innerText.includes('Anime')) ||
                    (type === 'manga' && btn.innerText.includes('Manga'))
                );
            });
            renderList(document.querySelector('.filter-btn.active')?.dataset.filter || 'all');
        };

        /* ═══════════════════════════════════════
           RENDER LIST
        ═══════════════════════════════════════ */
        function renderList(filter) {
            container.innerHTML = '';
            const filtered = allAnime.filter(a => {
                const typeMatch   = (a.type || 'anime') === currentType;
                const sl          = (a.status || '').toLowerCase();
                const statusMatch =
                    filter === 'all'
                    || (filter === 'completed' && sl.includes('complet'))
                    || (filter === 'watching'  && sl.includes('watch') && !sl.includes('plan'))
                    || (filter === 'plan'      && sl.includes('plan'));
                return typeMatch && statusMatch;
            });

            document.getElementById('emptyState').classList.toggle('hidden', filtered.length !== 0);

            filtered.forEach(anime => {
                if (anime.isSeriesCard && Array.isArray(anime.seasons) && anime.seasons.length > 0) {
                    renderBookCard(anime);
                } else {
                    renderSimpleCard(anime);
                }
            });
        }

        /* ═══════════════════════════════════════
           BOOK CARD (multi-season)
        ═══════════════════════════════════════ */
        function renderBookCard(anime) {
            const seasons     = anime.seasons;
            const activeNum   = anime.activeSeason || seasons[0].num;
            const activeSn    = seasons.find(s => s.num === activeNum) || seasons[0];
            const sl          = (anime.status || '').toLowerCase();
            const statusColor = getStatusColor(sl);

            const card = document.createElement('div');
            card.className = 'book-card';
            card.dataset.id = anime.malId;

            /* Long-press → delete */
            attachLongPress(card, () => openDeleteModal(anime.malId, anime.seriesName || anime.title));

            card.innerHTML = buildBookCardHTML(anime, seasons, activeSn, statusColor);
            container.appendChild(card);
        }

        function buildBookCardHTML(anime, seasons, activeSn, statusColor) {
            const sl         = (anime.status || '').toLowerCase();
            const ep         = activeSn.watchedEpisodes || 0;
            const total      = activeSn.episodes || 0;
            const pct        = total > 0 ? Math.min(100, Math.round((ep / total) * 100)) : (sl.includes('complet') ? 100 : 0);
            const score      = anime.userScore || 0;
            const epText     = total > 0 ? `${ep}/${total}` : `${ep}/?`;
            const seriesTitle = anime.seriesName || anime.title;

            /* Season chips */
            const chipsHTML = seasons.map(sn => {
                const snDone    = sn.episodes > 0 && (sn.watchedEpisodes || 0) >= sn.episodes;
                const isActive  = sn.num === activeSn.num;
                const classes   = ['season-chip',
                    isActive ? 'active' : '',
                    snDone   ? 'done'   : ''
                ].filter(Boolean).join(' ');
                const checkmark = snDone && !isActive
                    ? '<i class="fa-solid fa-check chip-check"></i>' : '';
                return `<div class="${classes}"
                    onclick="selectSeason('${anime.malId}', ${sn.num})">
                    S${sn.num}${checkmark}
                </div>`;
            }).join('');

            return `
                <!-- Banner -->
                <div class="book-banner">
                    <div class="book-banner-bg"
                         style="background-image:url('${activeSn.image}')"></div>
                    <div class="book-banner-overlay"></div>

                    <!-- Rate btn -->
                    <button class="book-rate-btn"
                        onclick="openRateModal('${anime.malId}')">
                        ${score > 0 ? score : '<i class="fa-regular fa-star" style="font-size:12px;"></i>'}
                    </button>

                    <div class="book-banner-content">
                        <img class="active-thumb" src="${activeSn.image}"
                             onclick="location.href='details.html?id=${activeSn.malId}&type=anime'">
                        <div class="book-banner-info">
                            <div class="book-series-title"
                                 onclick="location.href='details.html?id=${anime.malId}&type=anime'">
                                ${seriesTitle}
                            </div>
                            <div class="active-season-label">
                                Season ${activeSn.num} of ${seasons.length}
                                &nbsp;·&nbsp;
                                <span style="color:${statusColor};">${anime.status}</span>
                            </div>
                            <div class="banner-ep-row">
                                <div class="banner-ep-track">
                                    <div class="banner-ep-fill"
                                         style="width:${pct}%; background:${statusColor};"></div>
                                </div>
                                <span class="banner-ep-text">${epText} ep</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Episode controls -->
                <div class="book-ep-controls">
                    <span class="ep-ctrl-label">
                        <i class="fa-solid fa-play" style="font-size:8px; color:var(--primary); margin-right:4px;"></i>
                        Episodes
                    </span>
                    <div class="ep-ctrl-box">
                        <button class="ep-ctrl-btn"
                            onclick="updateBookEp('${anime.malId}', ${activeSn.num}, -1)">
                            <i class="fa-solid fa-minus" style="font-size:10px;"></i>
                        </button>
                        <div class="ep-num-display"
                             id="epdisp_${anime.malId}_${activeSn.num}"
                             onclick="startBookEdit('${anime.malId}', ${activeSn.num}, ${activeSn.episodes || 0}, this)">
                            ${epText}
                        </div>
                        <button class="ep-ctrl-btn"
                            onclick="updateBookEp('${anime.malId}', ${activeSn.num}, 1)">
                            <i class="fa-solid fa-plus" style="font-size:10px;"></i>
                        </button>
                    </div>
                </div>

                <!-- Season chips -->
                <div class="season-chips-wrap">
                    <span style="font-size:10px; font-weight:800; color:var(--dim); flex-shrink:0;">
                        <i class="fa-solid fa-layer-group" style="font-size:9px;"></i>
                        Seasons
                    </span>
                    ${chipsHTML}
                </div>
            `;
        }

        /* ── Select active season ── */
        window.selectSeason = async (rootId, seasonNum) => {
            vib();
            const anime = allAnime.find(a => String(a.malId) === String(rootId));
            if (!anime) return;
            anime.activeSeason = seasonNum;

            // Update Firestore silently
            updateDoc(doc(db, "users", currentUid, "watchlist", String(rootId)),
                { activeSeason: seasonNum }).catch(console.error);

            // Re-render just this card
            rerenderCard(anime);
        };

        /* ── Update episode for active season of book card ── */
        window.updateBookEp = async (rootId, seasonNum, change) => {
            vib();
            const anime = allAnime.find(a => String(a.malId) === String(rootId));
            if (!anime) return;
            const sn    = anime.seasons.find(s => s.num === seasonNum);
            if (!sn) return;

            const total  = sn.episodes || 0;
            let newVal   = Math.max(0, (sn.watchedEpisodes || 0) + change);
            if (total > 0 && newVal > total) return;

            sn.watchedEpisodes = newVal;

            // Check if season just finished
            if (total > 0 && newVal >= total) {
                document.getElementById('pendingCompId').value     = rootId;
                document.getElementById('pendingCompVal').value    = newVal;
                document.getElementById('pendingCompSeason').value = seasonNum;

                const nextSn = anime.seasons.find(s => s.num > seasonNum);
                document.getElementById('completedTitle').innerText =
                    `Season ${seasonNum} complete! 🎉`;
                document.getElementById('completedSubtitle').innerText =
                    nextSn
                        ? `Move to Season ${nextSn.num}?`
                        : `Mark "${anime.seriesName || anime.title}" as Completed?`;

                document.getElementById('completedModal').classList.add('show');
            } else {
                await saveAndRerender(anime);
            }
        };

        /* ── Inline edit for episode number ── */
        window.startBookEdit = (rootId, seasonNum, totalEps, el) => {
            vib();
            const anime = allAnime.find(a => String(a.malId) === String(rootId));
            const sn    = anime?.seasons?.find(s => s.num === seasonNum);
            if (!sn) return;

            const input = document.createElement('input');
            input.type  = 'number';
            input.className = 'ep-num-edit';
            input.value = sn.watchedEpisodes || 0;
            el.replaceWith(input);
            input.focus(); input.select();

            const commit = async () => {
                let val = parseInt(input.value);
                if (isNaN(val) || val < 0) val = sn.watchedEpisodes || 0;
                if (totalEps > 0 && val > totalEps) val = totalEps;
                sn.watchedEpisodes = val;
                await saveAndRerender(anime);
            };
            input.onblur   = commit;
            input.onkeydown = e => { if (e.key === 'Enter') input.blur(); };
        };

        /* ── Completion confirm ── */
        window.confirmCompletion = async () => {
            const rootId    = document.getElementById('pendingCompId').value;
            const newVal    = parseInt(document.getElementById('pendingCompVal').value);
            const seasonNum = parseInt(document.getElementById('pendingCompSeason').value);
            const anime     = allAnime.find(a => String(a.malId) === String(rootId));
            closeModal('completedModal');
            if (!anime) return;

            if (anime.isSeriesCard) {
                const sn = anime.seasons.find(s => s.num === seasonNum);
                if (sn) sn.watchedEpisodes = newVal;

                // Auto-advance to next season
                const nextSn = anime.seasons.find(s => s.num > seasonNum);
                if (nextSn) {
                    anime.activeSeason = nextSn.num;
                } else {
                    // All seasons done → mark whole series completed
                    anime.status = 'Completed';
                }
                await saveAndRerender(anime, true);
            } else {
                // Legacy single card
                anime.watchedEpisodes = newVal;
                anime.status = 'completed';
                await updateDoc(
                    doc(db, "users", currentUid, "watchlist", String(rootId)),
                    { watchedEpisodes: newVal, status: 'completed' }
                );
                renderList(document.querySelector('.filter-btn.active')?.dataset.filter || 'all');
            }
        };

        /* Save season data + re-render card */
        async function saveAndRerender(anime, saveStatus = false) {
            try {
                const payload = {
                    seasons:       anime.seasons,
                    activeSeason:  anime.activeSeason || anime.seasons[0].num
                };
                if (saveStatus) payload.status = anime.status;
                await updateDoc(
                    doc(db, "users", currentUid, "watchlist", String(anime.malId)),
                    payload
                );
            } catch (e) { console.error(e); }
            rerenderCard(anime);
        }

        /* Re-render only one card in-place */
        function rerenderCard(anime) {
            const existing = container.querySelector(`[data-id="${anime.malId}"]`);
            if (!existing) return;

            const seasons     = anime.seasons;
            const activeNum   = anime.activeSeason || seasons[0].num;
            const activeSn    = seasons.find(s => s.num === activeNum) || seasons[0];
            const sl          = (anime.status || '').toLowerCase();
            const statusColor = getStatusColor(sl);

            existing.innerHTML = buildBookCardHTML(anime, seasons, activeSn, statusColor);
            attachLongPress(existing, () => openDeleteModal(anime.malId, anime.seriesName || anime.title));
        }

        /* ═══════════════════════════════════════
           SIMPLE CARD (legacy / manga / single ep)
        ═══════════════════════════════════════ */
        function renderSimpleCard(anime) {
            const watched = anime.watchedEpisodes || 0;
            const total   = anime.totalEpisodes || anime.episodes || 0;
            const score   = anime.userScore || 0;
            const sl      = (anime.status || '').toLowerCase();
            const statusColor = getStatusColor(sl);
            const pct     = sl.includes('complet') ? 100 : total > 0 ? (watched / total) * 100 : 0;
            const epText  = total > 0 ? `${watched}/${total}` : `${watched}/?`;
            const labelLetter = currentType === 'manga' ? 'V' : 'S';
            const seasonVal   = anime.season || 1;

            const div = document.createElement('div');
            div.className  = 'simple-card';
            div.dataset.id = anime.malId;

            attachLongPress(div, () => openDeleteModal(anime.malId, anime.title));

            div.innerHTML = `
                <div class="simple-status-bar" style="background:${statusColor};"></div>
                <img src="${anime.image}" class="simple-cover"
                     onclick="location.href='details.html?id=${anime.malId}&type=${anime.type||'anime'}'">
                <div class="simple-info"
                     onclick="location.href='details.html?id=${anime.malId}&type=${anime.type||'anime'}'">
                    <div class="simple-title">${anime.title}</div>
                    <span class="simple-status-pill"
                        style="background:${statusColor}20; color:${statusColor};">
                        ${anime.status}
                    </span>
                </div>
                <div class="simple-controls">
                    <div class="simple-rate-btn"
                         onclick="event.stopPropagation(); openRateModal('${anime.malId}')">
                        ${score > 0 ? score : '<i class="fa-regular fa-star"></i>'}
                    </div>
                    <div class="simple-ep-box" style="width:90px;">
                        <button class="simple-ctrl-btn"
                            onclick="simpleUpdateSeason('${anime.malId}', -1)">
                            <i class="fa-solid fa-minus" style="font-size:9px;"></i>
                        </button>
                        <div class="simple-ep-display"
                             onclick="simpleStartEdit('${anime.malId}','season',this)">
                            ${labelLetter}${seasonVal}
                        </div>
                        <button class="simple-ctrl-btn"
                            onclick="simpleUpdateSeason('${anime.malId}', 1)">
                            <i class="fa-solid fa-plus" style="font-size:9px;"></i>
                        </button>
                    </div>
                    <div class="simple-ep-box">
                        <button class="simple-ctrl-btn"
                            onclick="simpleUpdateEp('${anime.malId}', -1)">
                            <i class="fa-solid fa-minus" style="font-size:9px;"></i>
                        </button>
                        <div class="simple-ep-display"
                             onclick="simpleStartEdit('${anime.malId}','watchedEpisodes',this)">
                            ${epText}
                        </div>
                        <button class="simple-ctrl-btn"
                            onclick="simpleUpdateEp('${anime.malId}', 1)">
                            <i class="fa-solid fa-plus" style="font-size:9px;"></i>
                        </button>
                    </div>
                </div>
                <div class="simple-progress"
                     style="width:${pct}%; background:${statusColor};"></div>
            `;
            container.appendChild(div);
        }

        window.simpleUpdateSeason = async (id, change) => {
            vib();
            const anime = allAnime.find(a => String(a.malId) === String(id));
            let newVal  = Math.max(1, (anime.season || 1) + change);
            anime.season = newVal;
            await updateDoc(doc(db, "users", currentUid, "watchlist", String(id)), { season: newVal });
            renderList(document.querySelector('.filter-btn.active')?.dataset.filter || 'all');
        };

        window.simpleUpdateEp = async (id, change) => {
            vib();
            const anime = allAnime.find(a => String(a.malId) === String(id));
            const total = anime.totalEpisodes || anime.episodes || 0;
            let newVal  = Math.max(0, (anime.watchedEpisodes || 0) + change);
            if (total > 0 && newVal > total) return;

            if (total > 0 && newVal === total) {
                document.getElementById('pendingCompId').value     = id;
                document.getElementById('pendingCompVal').value    = newVal;
                document.getElementById('pendingCompSeason').value = '';
                document.getElementById('completedTitle').innerText = `${anime.title} — Done!`;
                document.getElementById('completedSubtitle').innerText = 'Mark as Completed?';
                document.getElementById('completedModal').classList.add('show');
                anime.watchedEpisodes = newVal;
                return;
            }
            anime.watchedEpisodes = newVal;
            await updateDoc(doc(db, "users", currentUid, "watchlist", String(id)),
                { watchedEpisodes: newVal });
            renderList(document.querySelector('.filter-btn.active')?.dataset.filter || 'all');
        };

        window.simpleStartEdit = function(id, field, el) {
            vib();
            const anime = allAnime.find(a => String(a.malId) === String(id));
            const curr  = field === 'season' ? (anime.season || 1) : (anime.watchedEpisodes || 0);
            const input = document.createElement('input');
            input.type  = 'number'; input.className = 'ep-num-edit';
            input.style.cssText = 'width:60px; height:100%; border-radius:0;';
            input.value = curr;
            el.replaceWith(input); input.focus();
            input.onblur = async () => {
                const val = parseInt(input.value) || curr;
                anime[field] = val;
                await updateDoc(doc(db, "users", currentUid, "watchlist", String(id)), { [field]: val });
                renderList(document.querySelector('.filter-btn.active')?.dataset.filter || 'all');
            };
            input.onkeydown = e => { if (e.key === 'Enter') input.blur(); };
        };

        /* ═══════════════════════════════════════
           FILTER + COMMON
        ═══════════════════════════════════════ */
        window.filterList = (filter, btn) => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderList(filter);
        };

        window.openRateModal = (id) => {
            const anime = allAnime.find(a => String(a.malId) === String(id));
            document.getElementById('rateId').value        = id;
            document.getElementById('rateTitle').innerText = anime.seriesName || anime.title;
            tempScore = anime.userScore || 0;
            const grid = document.getElementById('ratingOptions');
            grid.innerHTML = '';
            for (let i = 1; i <= 10; i++) {
                const item = document.createElement('div');
                item.className = `rating-item${i === tempScore ? ' selected' : ''}`;
                item.innerText = i;
                item.onclick   = () => {
                    tempScore = i;
                    document.querySelectorAll('.rating-item').forEach(el => el.classList.remove('selected'));
                    item.classList.add('selected');
                };
                grid.appendChild(item);
            }
            document.getElementById('rateModal').classList.add('show');
        };

        window.saveRating = async () => {
            const id    = document.getElementById('rateId').value;
            const anime = allAnime.find(a => String(a.malId) === String(id));
            if (anime) anime.userScore = tempScore;
            await updateDoc(doc(db, "users", currentUid, "watchlist", String(id)),
                { userScore: tempScore });
            closeModal('rateModal');
            renderList(document.querySelector('.filter-btn.active')?.dataset.filter || 'all');
        };

        window.openDeleteModal = (id, title) => {
            document.getElementById('deleteId').value    = id;
            document.getElementById('deleteTitle').innerText = `"${title}" will be removed from your list.`;
            document.getElementById('deleteModal').classList.add('show');
        };

        window.confirmDelete = async () => {
            const id = document.getElementById('deleteId').value;
            await deleteDoc(doc(db, "users", currentUid, "watchlist", String(id)));
            allAnime = allAnime.filter(a => String(a.malId) !== String(id));
            closeModal('deleteModal');
            renderList(document.querySelector('.filter-btn.active')?.dataset.filter || 'all');
        };

        window.closeModal = id => document.getElementById(id).classList.remove('show');

        /* ═══════════════════════════════════════
           HELPERS
        ═══════════════════════════════════════ */
        function getStatusColor(sl) {
            if (sl.includes('complet')) return '#4ade80';
            if (sl.includes('plan'))    return '#fb923c';
            if (sl.includes('drop'))    return '#f87171';
            return '#60a5fa'; // watching
        }

        function attachLongPress(el, callback) {
            let timer, startY = 0;
            el.ontouchstart = e => {
                startY = e.touches[0].clientY;
                timer  = setTimeout(callback, 800);
            };
            el.ontouchmove  = e => {
                if (Math.abs(e.touches[0].clientY - startY) > 12) clearTimeout(timer);
            };
            el.ontouchend   = () => clearTimeout(timer);
        }

        function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

        function showToast(msg) {
            const t = document.getElementById('fetchToast');
            document.getElementById('fetchToastMsg').innerText = msg;
            t.classList.add('show');
        }
        function hideToast() {
            document.getElementById('fetchToast').classList.remove('show');
        }
    </script>
</body>
</html>
