<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My List</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7c4dff">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <style>

        /* ══════════════════════════════
           TYPE SWITCHER
        ══════════════════════════════ */
        .type-switcher {
            display: flex;
            background: #1a1c22;
            margin: 15px;
            padding: 4px;
            border-radius: 14px;
            border: 1px solid #333;
            position: relative;
        }
        .type-btn {
            flex: 1; padding: 10px; border: none;
            background: transparent; color: #888;
            font-size: 13px; font-weight: 700;
            z-index: 2; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center;
            justify-content: center; gap: 8px;
        }
        .type-btn.active { color: white; }
        .type-indicator {
            position: absolute;
            top: 4px; left: 4px;
            width: calc(50% - 4px);
            height: calc(100% - 8px);
            background: #5738B0;
            border-radius: 10px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1;
        }
        .type-switcher[data-active="manga"] .type-indicator { transform: translateX(100%); }

        /* ══════════════════════════════
           FILTER TABS
        ══════════════════════════════ */
        .filter-container {
            display: flex; gap: 10px; padding: 0 15px 15px;
            overflow-x: auto; scrollbar-width: none;
        }
        .filter-container::-webkit-scrollbar { display: none; }
        .filter-btn {
            display: flex; align-items: center; gap: 6px;
            padding: 7px 16px;
            background: rgba(255,255,255,0.07);
            color: #888; border-radius: 30px;
            font-size: 12px; font-weight: 700;
            white-space: nowrap; border: 1px solid transparent;
            cursor: pointer; transition: 0.25s; flex-shrink: 0;
        }
        .filter-btn.active { color: white; border-color: rgba(255,255,255,0.15); }
        .filter-btn[data-filter="all"].active      { background: #444; }
        .filter-btn[data-filter="watching"].active { background: #2979ff; }
        .filter-btn[data-filter="completed"].active{ background: #00e676; color: #000; }
        .filter-btn[data-filter="plan"].active     { background: #ffab00; color: #000; }

        /* ══════════════════════════════
           ── BOOK CARD (New AI Card) ──
        ══════════════════════════════ */
        .book-card {
            margin: 10px 12px;
            border-radius: 18px;
            background: #1b1d24;
            border: 1px solid rgba(255,255,255,0.07);
            box-shadow: 0 6px 28px rgba(0,0,0,0.45);
            overflow: hidden;
            transition: box-shadow 0.2s;
            position: relative;
        }

        /* Coloured status stripe at top */
        .book-stripe {
            height: 3px;
            width: 100%;
        }

        /* Header: cover + info */
        .book-header {
            display: flex;
            gap: 0;
        }
        .book-cover {
            width: 82px;
            min-height: 115px;
            object-fit: cover;
            flex-shrink: 0;
            cursor: pointer;
        }
        .book-info {
            flex: 1;
            padding: 11px 12px 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 0;
        }
        .book-title {
            font-size: 15px; font-weight: 800;
            color: #fff; line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            cursor: pointer;
            margin-bottom: 6px;
        }
        .book-sub-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 7px;
        }
        .book-status-pill {
            font-size: 10px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.4px;
            padding: 3px 9px; border-radius: 20px;
        }
        .book-season-tag {
            font-size: 10px; color: #888;
            display: flex; align-items: center; gap: 4px;
        }
        .book-season-tag i { font-size: 9px; color: #5738B0; }

        /* Progress row */
        .book-progress-row {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 4px;
        }
        .book-progress-track {
            flex: 1; height: 5px;
            background: rgba(255,255,255,0.08);
            border-radius: 3px; overflow: hidden;
        }
        .book-progress-fill {
            height: 100%; border-radius: 3px;
            transition: width 0.4s ease;
        }
        .book-progress-pct {
            font-size: 10px; font-weight: 800;
            color: #888; white-space: nowrap; flex-shrink: 0;
        }

        /* Rating button (top-right corner) */
        .book-rate-btn {
            position: absolute;
            top: 10px; right: 10px;
            width: 34px; height: 34px;
            border-radius: 50%;
            border: 1px solid rgba(255,215,0,0.35);
            background: rgba(255,215,0,0.1);
            color: #ffd700;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 800;
            cursor: pointer; transition: 0.2s;
            z-index: 5;
        }
        .book-rate-btn:active { transform: scale(0.88); }

        /* Expand toggle button */
        .book-toggle-btn {
            display: flex; align-items: center; justify-content: center;
            gap: 7px; padding: 9px 14px;
            font-size: 11px; font-weight: 800;
            color: #7c5fd4; cursor: pointer;
            border-top: 1px solid rgba(255,255,255,0.05);
            user-select: none; transition: background 0.2s;
            letter-spacing: 0.2px;
        }
        .book-toggle-btn:active { background: rgba(255,255,255,0.03); }
        .book-toggle-btn .chev {
            font-size: 10px;
            transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        .book-toggle-btn.open .chev { transform: rotate(180deg); }

        /* ══════════════════════════════
           SEASON ACCORDION
        ══════════════════════════════ */
        .seasons-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.42s cubic-bezier(0.4,0,0.2,1);
            background: rgba(0,0,0,0.18);
            border-top: 1px solid rgba(255,255,255,0.04);
        }
        .seasons-body.open { max-height: 2400px; }

        .season-row {
            display: flex; align-items: center; gap: 11px;
            padding: 9px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            transition: background 0.15s;
        }
        .season-row:last-child { border-bottom: none; }
        .season-row:active { background: rgba(255,255,255,0.025); }

        .season-thumb {
            width: 38px; height: 52px;
            border-radius: 7px; object-fit: cover;
            flex-shrink: 0; cursor: pointer;
            background: #111;
        }
        .season-label-area {
            flex: 1; min-width: 0;
        }
        .season-num {
            font-size: 9px; font-weight: 800;
            color: #7c5fd4; text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .season-title {
            font-size: 12px; font-weight: 700; color: #fff;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            margin: 1px 0;
        }
        .season-ep-count {
            font-size: 10px; color: #666;
        }

        /* Episode counter inside season row */
        .ep-box {
            display: flex; align-items: center;
            background: #0f1014; border-radius: 9px;
            border: 1px solid #2a2a2a; height: 32px;
            flex-shrink: 0; overflow: hidden;
        }
        .ep-ctrl {
            width: 28px; height: 100%;
            background: transparent; color: #fff;
            border: none; cursor: pointer; font-size: 11px;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s;
        }
        .ep-ctrl:active { background: #5738B020; }
        .ep-num {
            min-width: 48px; text-align: center;
            font-size: 11px; font-weight: 800; color: #fff;
            cursor: pointer; padding: 0 4px;
            white-space: nowrap;
        }
        .ep-edit-input {
            width: 48px; height: 100%;
            background: #5738B0; color: white;
            border: none; text-align: center;
            font-size: 12px; font-weight: 800;
            outline: none;
        }
        .ep-edit-input::-webkit-outer-spin-button,
        .ep-edit-input::-webkit-inner-spin-button { -webkit-appearance: none; }

        /* ══════════════════════════════
           LEGACY CARD (old entries)
        ══════════════════════════════ */
        .mal-card {
            display: flex; align-items: stretch;
            background: var(--bg-card);
            margin: 10px 8px;
            border-radius: 12px;
            border-left: 5px solid var(--primary);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            position: relative; overflow: hidden;
            min-height: 110px; transition: 0.2s;
        }
        .mal-img { width: 80px; height: auto; object-fit: cover; flex-shrink: 0; }
        .mal-info {
            flex: 2; padding: 12px;
            display: flex; flex-direction: column;
            justify-content: space-between; min-width: 0;
        }
        .mal-title {
            font-size: 15px; font-weight: 700; color: white; line-height: 1.3;
            display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden;
        }
        .mal-meta { display: flex; align-items: center; gap: 15px; margin-top: 8px; }
        .status-label { font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn-rate {
            width: 32px; height: 32px; flex-shrink: 0;
            border-radius: 50%;
            border: 1px solid rgba(255,215,0,0.4);
            background: rgba(255,215,0,0.1); color: #ffd700;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: bold; cursor: pointer;
            transition: 0.2s; margin: 0 auto;
        }
        .controls-wrapper {
            display: flex; flex-direction: column;
            justify-content: center; gap: 6px; padding: 8px;
            background: rgba(0,0,0,0.2);
            border-left: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0; align-items: center;
        }
        .ep-control-box {
            display: flex; align-items: center;
            background: #0f1014; border-radius: 8px;
            border: 1px solid #333; height: 32px; width: 100px;
        }
        .ctrl-btn {
            flex: 1; background: transparent; color: #fff;
            border: none; cursor: pointer; font-size: 12px;
        }
        .ep-display, .sn-display {
            flex: 1.5; font-size: 11px; font-weight: bold;
            color: white; text-align: center;
        }
        .progress-line {
            position: absolute; bottom: 0; left: 0;
            height: 4px; background: var(--primary);
        }
        .label-tiny { font-size: 8px; color: #888; display: block; line-height: 1; }
        .edit-input {
            width: 100%; height: 100%;
            background: #5738B0; color: white;
            border: none; border-radius: 6px;
            text-align: center; font-size: 13px; font-weight: 800;
            outline: none;
            box-shadow: 0 0 12px rgba(87,56,176,0.7);
        }
        .edit-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        /* ══════════════════════════════
           MODALS
        ══════════════════════════════ */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.85); z-index: 2000;
            display: flex; justify-content: center; align-items: center;
            visibility: hidden; opacity: 0; transition: 0.2s;
            backdrop-filter: blur(5px);
        }
        .modal-overlay.show { visibility: visible; opacity: 1; }
        .modal-box {
            background: #1e1e24; width: 88%; max-width: 320px;
            border-radius: 18px; padding: 24px 20px;
            text-align: center; border: 1px solid #333;
        }
        .modal-box h3 { color: white; font-size: 16px; margin-bottom: 6px; }
        .modal-box p { color: #aaa; font-size: 13px; margin-bottom: 16px; }
        .rating-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 18px 0; }
        .rating-item {
            background: #0f1014; border: 1px solid #333;
            padding: 10px 0; border-radius: 9px;
            color: #888; cursor: pointer; font-weight: 700; font-size: 14px;
            transition: 0.2s;
        }
        .rating-item.selected { background: #5738B0; color: white; border-color: #5738B0; }
        .btn-modal-primary {
            background: #5738B0; color: white; border: none;
            padding: 13px; border-radius: 11px; font-weight: 800;
            width: 100%; cursor: pointer; font-size: 14px;
        }
        .btn-modal-danger {
            background: #ff5252; color: white; border: none;
            padding: 13px; border-radius: 11px; font-weight: 800;
            cursor: pointer; font-size: 14px; flex: 1;
        }
        .btn-modal-cancel {
            background: transparent; color: #aaa;
            border: 1px solid #333; padding: 13px;
            border-radius: 11px; cursor: pointer;
            font-size: 14px; flex: 1;
        }
        .modal-btn-row { display: flex; gap: 10px; }

        /* ══════════════════════════════
           NAV + MISC
        ══════════════════════════════ */
        .bottom-nav {
            background: #161c24 !important;
            border-radius: 25px 25px 0 0;
            height: 80px;
            border-top: 1px solid rgba(255,255,255,0.05) !important;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
        }
        .nav-item {
            text-decoration: none; color: #94a3b8;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            flex: 1; gap: 4px; transition: 0.2s ease;
        }
        .nav-item i { font-size: 20px; }
        .nav-item span { font-size: 10px; font-weight: 600; }
        .nav-item.active { color: #5738B0; }
        .nav-item:active { transform: scale(0.9); }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="logo">My List</div>
    </header>

    <div class="container" style="padding-bottom: 100px;">
        <div class="type-switcher" id="typeSwitcher" data-active="anime">
            <div class="type-indicator"></div>
            <button class="type-btn active" onclick="switchType('anime')">
                <i class="fa-solid fa-tv"></i> Anime
            </button>
            <button class="type-btn" onclick="switchType('manga')">
                <i class="fa-solid fa-book-open"></i> Manga
            </button>
        </div>

        <div class="filter-container">
            <button class="filter-btn active" data-filter="all" onclick="filterList('all',this)">
                <i class="fa-solid fa-layer-group"></i> All
            </button>
            <button class="filter-btn" data-filter="watching" onclick="filterList('watching',this)">
                <i class="fa-solid fa-eye"></i> Watching
            </button>
            <button class="filter-btn" data-filter="completed" onclick="filterList('completed',this)">
                <i class="fa-solid fa-check-circle"></i> Completed
            </button>
            <button class="filter-btn" data-filter="plan" onclick="filterList('plan',this)">
                <i class="fa-solid fa-clock"></i> Plan
            </button>
        </div>

        <div id="loading" class="text-center" style="margin-top:50px;">
            <i class="fa-solid fa-circle-notch fa-spin" style="font-size:30px; color:#5738B0;"></i>
        </div>
        <div id="listContainer"></div>
        <div id="emptyState" class="hidden text-center" style="margin-top:60px; color:#555;">
            <i class="fa-solid fa-book-open" style="font-size:40px; margin-bottom:12px; color:#333;"></i>
            <p style="font-size:14px;">Your list is empty</p>
            <p style="font-size:12px; margin-top:6px; color:#444;">Search anime and add them!</p>
        </div>
    </div>

    <!-- ══ RATE MODAL ══ -->
    <div id="rateModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="rateTitle">Rate Anime</h3>
            <input type="hidden" id="rateId">
            <div class="rating-grid" id="ratingOptions"></div>
            <button class="btn-modal-primary" onclick="saveRating()">Save Rating</button>
            <button onclick="closeModal('rateModal')"
                style="margin-top:10px;background:none;border:none;color:#aaa;cursor:pointer;width:100%;padding:8px;">
                Close
            </button>
        </div>
    </div>

    <!-- ══ COMPLETED CONFIRM MODAL ══ -->
    <div id="completedModal" class="modal-overlay">
        <div class="modal-box">
            <h3>🎉 Finished?</h3>
            <p id="completedTitle"></p>
            <input type="hidden" id="pendingCompId">
            <input type="hidden" id="pendingCompVal">
            <input type="hidden" id="pendingCompSeason">
            <div class="modal-btn-row">
                <button class="btn-modal-primary" style="background:#00e676;color:#000;"
                    onclick="confirmCompletion()">Yes, Completed!</button>
                <button class="btn-modal-cancel" onclick="closeModal('completedModal')">Not yet</button>
            </div>
        </div>
    </div>

    <!-- ══ DELETE MODAL ══ -->
    <div id="deleteModal" class="modal-overlay">
        <div class="modal-box">
            <h3>Remove from list?</h3>
            <p id="deleteTitle" style="color:#aaa; font-size:13px; margin:12px 0;"></p>
            <input type="hidden" id="deleteId">
            <div class="modal-btn-row">
                <button class="btn-modal-danger" onclick="confirmDelete()">Remove</button>
                <button class="btn-modal-cancel" onclick="closeModal('deleteModal')">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import {
            getFirestore, collection, getDocs,
            doc, updateDoc, deleteDoc, serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDLd3TW-y89lwShUmcIHw3YGzDjo4cg3y4",
            authDomain: "animea2z.firebaseapp.com",
            projectId: "animea2z",
            storageBucket: "animea2z.firebasestorage.app",
            messagingSenderId: "673605765684",
            appId: "1:673605765684:web:a6f851e0d79836b79b1861"
        };

        const app  = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db   = getFirestore(app);

        /* ── haptic feedback ── */
        const vibrate = () => navigator.vibrate?.(60);

        let allAnime = [];
        let currentType = 'anime';
        let tempSelectedScore = 0;
        const container = document.getElementById('listContainer');

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                await fetchList(user.uid);
            } else {
                window.location.href = "login.html";
            }
        });

        /* ─────────────────────────────────
           FETCH ALL WATCHLIST DOCS
        ───────────────────────────────── */
        async function fetchList(uid) {
            try {
                const snapshot = await getDocs(collection(db, "users", uid, "watchlist"));
                allAnime = [];
                snapshot.forEach(d => allAnime.push({ ...d.data(), _docId: d.id }));
                allAnime.sort((a, b) => (b.addedAt?.seconds || 0) - (a.addedAt?.seconds || 0));
                document.getElementById('loading').classList.add('hidden');
                renderList('all');
            } catch (e) {
                document.getElementById('loading').classList.add('hidden');
                console.error(e);
            }
        }

        /* ─────────────────────────────────
           TYPE SWITCHER
        ───────────────────────────────── */
        window.switchType = (type) => {
            currentType = type;
            document.getElementById('typeSwitcher').setAttribute('data-active', type);
            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.toLowerCase().includes(type));
            });
            renderList(document.querySelector('.filter-btn.active').dataset.filter);
        };

        /* ─────────────────────────────────
           RENDER LIST
        ───────────────────────────────── */
        function renderList(filter) {
            container.innerHTML = '';

            const filtered = allAnime.filter(a => {
                const typeMatch = (a.type || 'anime') === currentType;
                const sl = (a.status || '').toLowerCase();
                const statusMatch =
                    filter === 'all'
                    || (filter === 'completed' && sl.includes('complet'))
                    || (filter === 'watching'  && sl.includes('watch') && !sl.includes('plan'))
                    || (filter === 'plan'      && sl.includes('plan'));
                return typeMatch && statusMatch;
            });

            if (filtered.length === 0) {
                document.getElementById('emptyState').classList.remove('hidden');
                return;
            }
            document.getElementById('emptyState').classList.add('hidden');

            filtered.forEach(anime => {
                if (anime.isSeriesCard && Array.isArray(anime.seasons) && anime.seasons.length > 0) {
                    renderBookCard(anime);
                } else {
                    renderLegacyCard(anime);
                }
            });
        }

        /* ══════════════════════════════════════════
           BOOK CARD — new AI-grouped series card
        ══════════════════════════════════════════ */
        function renderBookCard(anime) {
            const sl = (anime.status || '').toLowerCase();
            let statusColor = '#2979ff';
            if (sl.includes('complet')) statusColor = '#00e676';
            if (sl.includes('plan'))    statusColor = '#ffab00';
            if (sl.includes('drop'))    statusColor = '#ff5252';

            const seasons   = anime.seasons || [];
            const totalEps  = seasons.reduce((s, sn) => s + (sn.episodes || 0), 0);
            const watchedEps= seasons.reduce((s, sn) => s + (sn.watchedEpisodes || 0), 0);
            const pct = totalEps > 0 ? Math.round((watchedEps / totalEps) * 100) : (sl.includes('complet') ? 100 : 0);
            const score = anime.userScore || 0;

            const card = document.createElement('div');
            card.className = 'book-card';

            /* Long-press to delete */
            let touchStartY = 0, pressTimer;
            card.ontouchstart = (e) => {
                touchStartY = e.touches[0].clientY;
                pressTimer = setTimeout(() => openDeleteModal(anime.malId, anime.seriesName || anime.title), 800);
            };
            card.ontouchmove = (e) => {
                if (Math.abs(e.touches[0].clientY - touchStartY) > 10) clearTimeout(pressTimer);
            };
            card.ontouchend = () => clearTimeout(pressTimer);

            card.innerHTML = `
                <!-- Status stripe -->
                <div class="book-stripe" style="background:${statusColor};"></div>

                <!-- Rating button (absolute top-right) -->
                <button class="book-rate-btn" onclick="event.stopPropagation(); openRateModal('${anime.malId}')">
                    ${score > 0 ? score : '<i class="fa-regular fa-star" style="font-size:13px;"></i>'}
                </button>

                <!-- Header -->
                <div class="book-header">
                    <img class="book-cover" src="${anime.image}"
                         onclick="location.href='details.html?id=${anime.malId}&type=${anime.type||'anime'}'">
                    <div class="book-info">
                        <div class="book-title"
                             onclick="location.href='details.html?id=${anime.malId}&type=${anime.type||'anime'}'">
                            ${anime.seriesName || anime.title}
                        </div>
                        <div class="book-sub-row">
                            <span class="book-status-pill"
                                style="background:${statusColor}22; color:${statusColor};">
                                ${anime.status}
                            </span>
                            <span class="book-season-tag">
                                <i class="fa-solid fa-layer-group"></i>
                                ${seasons.length} Season${seasons.length !== 1 ? 's' : ''}
                            </span>
                        </div>
                        <div class="book-progress-row">
                            <div class="book-progress-track">
                                <div class="book-progress-fill"
                                     style="width:${pct}%; background:${statusColor};"></div>
                            </div>
                            <span class="book-progress-pct">
                                ${watchedEps}/${totalEps || '?'} eps
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Expand toggle -->
                <div class="book-toggle-btn" id="toggle_${anime.malId}" onclick="toggleSeasons('${anime.malId}')">
                    <i class="fa-solid fa-list-ul" style="font-size:10px;"></i>
                    All Seasons (${seasons.length})
                    <i class="fa-solid fa-chevron-down chev"></i>
                </div>

                <!-- Seasons accordion -->
                <div class="seasons-body" id="seasons_${anime.malId}">
                    ${seasons.map(sn => buildSeasonRow(anime.malId, sn)).join('')}
                </div>
            `;

            container.appendChild(card);
        }

        function buildSeasonRow(rootId, sn) {
            const ep    = sn.watchedEpisodes || 0;
            const total = sn.episodes || 0;
            return `
                <div class="season-row">
                    <img class="season-thumb" src="${sn.image}"
                         onclick="location.href='details.html?id=${sn.malId}&type=anime'">
                    <div class="season-label-area">
                        <div class="season-num">Season ${sn.num}</div>
                        <div class="season-title">${sn.title}</div>
                        <div class="season-ep-count">${total || '?'} episodes</div>
                    </div>
                    <div class="ep-box">
                        <button class="ep-ctrl"
                            onclick="updateSeasonEp('${rootId}', ${sn.num}, -1)">
                            <i class="fa-solid fa-minus" style="font-size:9px;"></i>
                        </button>
                        <div class="ep-num" id="epnum_${rootId}_${sn.num}"
                             onclick="startSeasonEdit('${rootId}', ${sn.num}, ${total}, this)">
                            ${ep}/${total || '?'}
                        </div>
                        <button class="ep-ctrl"
                            onclick="updateSeasonEp('${rootId}', ${sn.num}, 1)">
                            <i class="fa-solid fa-plus" style="font-size:9px;"></i>
                        </button>
                    </div>
                </div>`;
        }

        /* ── Toggle season accordion ── */
        window.toggleSeasons = (id) => {
            const body   = document.getElementById('seasons_' + id);
            const toggle = document.getElementById('toggle_' + id);
            body.classList.toggle('open');
            toggle.classList.toggle('open');
        };

        /* ── Update episode count for a season inside a book card ── */
        window.updateSeasonEp = async (rootId, seasonNum, change) => {
            vibrate();
            const anime  = allAnime.find(a => String(a.malId) === String(rootId));
            if (!anime) return;
            const sn     = anime.seasons.find(s => s.num === seasonNum);
            if (!sn) return;

            const total  = sn.episodes || 0;
            let newVal   = (sn.watchedEpisodes || 0) + change;
            if (newVal < 0 || (total > 0 && newVal > total)) return;

            /* Check if season just completed → show confirmation */
            if (total > 0 && newVal === total) {
                document.getElementById('pendingCompId').value    = rootId;
                document.getElementById('pendingCompVal').value   = newVal;
                document.getElementById('pendingCompSeason').value= seasonNum;
                document.getElementById('completedTitle').innerText =
                    `Mark Season ${seasonNum} as finished?`;
                document.getElementById('completedModal').classList.add('show');
                return;
            }

            sn.watchedEpisodes = newVal;
            await saveSeasons(anime);
            refreshBookCard(anime);
        };

        /* ── Inline edit for episode number ── */
        window.startSeasonEdit = (rootId, seasonNum, total, el) => {
            vibrate();
            const anime = allAnime.find(a => String(a.malId) === String(rootId));
            const sn    = anime?.seasons?.find(s => s.num === seasonNum);
            if (!sn) return;

            const input = document.createElement('input');
            input.type  = 'number';
            input.className = 'ep-edit-input';
            input.value = sn.watchedEpisodes || 0;
            el.innerHTML = '';
            el.appendChild(input);
            input.focus();
            input.select();

            input.onblur = async () => {
                let val = parseInt(input.value);
                if (isNaN(val) || val < 0) val = sn.watchedEpisodes || 0;
                if (total > 0 && val > total) val = total;
                sn.watchedEpisodes = val;
                await saveSeasons(anime);
                refreshBookCard(anime);
            };
            input.onkeydown = (e) => { if (e.key === 'Enter') input.blur(); };
        };

        /* Save updated seasons array to Firestore */
        async function saveSeasons(anime) {
            try {
                const uid = auth.currentUser?.uid;
                if (!uid) return;
                await updateDoc(
                    doc(db, "users", uid, "watchlist", String(anime.malId)),
                    { seasons: anime.seasons }
                );
            } catch (e) { console.error(e); }
        }

        /* Re-render only the affected card (no full re-render needed) */
        function refreshBookCard(anime) {
            const existingCard = container.querySelector(`[data-cardid="${anime.malId}"]`);
            // Simple: re-render full list to keep it clean
            renderList(document.querySelector('.filter-btn.active').dataset.filter);
        }

        /* ── Season completion confirm ── */
        window.confirmCompletion = async () => {
            const rootId    = document.getElementById('pendingCompId').value;
            const newVal    = parseInt(document.getElementById('pendingCompVal').value);
            const seasonNum = parseInt(document.getElementById('pendingCompSeason').value);
            const anime     = allAnime.find(a => String(a.malId) === String(rootId));

            if (anime && anime.isSeriesCard) {
                const sn = anime.seasons?.find(s => s.num === seasonNum);
                if (sn) sn.watchedEpisodes = newVal;
                /* If all seasons done → mark overall as completed */
                const allDone = anime.seasons.every(s =>
                    (s.episodes > 0) && (s.watchedEpisodes >= s.episodes)
                );
                if (allDone) anime.status = 'Completed';
                await updateDoc(
                    doc(db, "users", auth.currentUser.uid, "watchlist", String(rootId)),
                    { seasons: anime.seasons, ...(allDone ? { status: 'Completed' } : {}) }
                );
            } else if (anime) {
                /* Legacy card */
                anime.watchedEpisodes = newVal;
                anime.status = 'completed';
                await updateDoc(
                    doc(db, "users", auth.currentUser.uid, "watchlist", String(rootId)),
                    { watchedEpisodes: newVal, status: 'completed' }
                );
            }

            closeModal('completedModal');
            renderList(document.querySelector('.filter-btn.active').dataset.filter);
        };

        /* ══════════════════════════════════════════
           LEGACY CARD — old entries without seasons
        ══════════════════════════════════════════ */
        function renderLegacyCard(anime) {
            const watched = anime.watchedEpisodes || 0;
            const total   = anime.totalEpisodes || anime.episodes || 0;
            const score   = anime.userScore || 0;
            const season  = anime.season || 1;
            const labelText = currentType === 'manga' ? 'V' : 'S';

            const sl = (anime.status || '').toLowerCase();
            let statusColor = '#2979ff';
            if (sl.includes('complet')) statusColor = '#00e676';
            if (sl.includes('plan'))    statusColor = '#ffab00';
            if (sl.includes('drop'))    statusColor = '#ff5252';

            let progressWidth = sl.includes('complet') ? 100
                : (total > 0 ? (watched / total) * 100 : 0);

            const div = document.createElement('div');
            div.className = 'mal-card';
            div.style.borderLeftColor = statusColor;

            let touchStartY = 0, pressTimer;
            div.ontouchstart = (e) => {
                touchStartY = e.touches[0].clientY;
                pressTimer = setTimeout(() => openDeleteModal(anime.malId, anime.title), 800);
            };
            div.ontouchmove = (e) => {
                if (Math.abs(e.touches[0].clientY - touchStartY) > 10) clearTimeout(pressTimer);
            };
            div.ontouchend = () => clearTimeout(pressTimer);

            div.innerHTML = `
                <img src="${anime.image}" class="mal-img"
                     onclick="location.href='details.html?id=${anime.malId}&type=${anime.type||'anime'}'">
                <div class="mal-info"
                     onclick="location.href='details.html?id=${anime.malId}&type=${anime.type||'anime'}'">
                    <div class="mal-title">${anime.title}</div>
                    <div class="mal-meta">
                        <span class="status-label" style="color:${statusColor};">${anime.status}</span>
                    </div>
                </div>
                <div class="controls-wrapper">
                    <div class="btn-rate"
                         onclick="event.stopPropagation(); openRateModal('${anime.malId}')">
                        ${score > 0 ? score : '<i class="fa-regular fa-star"></i>'}
                    </div>
                    <div class="ep-control-box" style="border-color:#444;">
                        <button class="ctrl-btn" onclick="legacyUpdateSeason('${anime.malId}',-1)">
                            <i class="fa-solid fa-minus"></i>
                        </button>
                        <div class="sn-display"
                             onclick="legacyStartEdit('${anime.malId}','season',this)">
                            <span class="label-tiny">${labelText}</span>${season}
                        </div>
                        <button class="ctrl-btn" onclick="legacyUpdateSeason('${anime.malId}',1)">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>
                    <div class="ep-control-box">
                        <button class="ctrl-btn" onclick="legacyUpdateEp('${anime.malId}',-1)">
                            <i class="fa-solid fa-minus"></i>
                        </button>
                        <div class="ep-display"
                             onclick="legacyStartEdit('${anime.malId}','watchedEpisodes',this)">
                            ${watched}/${total || '?'}
                        </div>
                        <button class="ctrl-btn" onclick="legacyUpdateEp('${anime.malId}',1)">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>
                </div>
                <div class="progress-line"
                     style="width:${progressWidth}%; background:${statusColor};"></div>
            `;
            container.appendChild(div);
        }

        window.legacyUpdateSeason = async (id, change) => {
            vibrate();
            const anime = allAnime.find(a => String(a.malId) === String(id));
            let newVal  = (anime.season || 1) + change;
            if (newVal < 1) return;
            await updateDoc(doc(db, "users", auth.currentUser.uid, "watchlist", String(id)),
                { season: newVal });
            anime.season = newVal;
            renderList(document.querySelector('.filter-btn.active').dataset.filter);
        };

        window.legacyUpdateEp = async (id, change) => {
            vibrate();
            const anime = allAnime.find(a => String(a.malId) === String(id));
            const total = anime.totalEpisodes || anime.episodes || 0;
            let newVal  = (anime.watchedEpisodes || 0) + change;
            if (newVal < 0 || (total > 0 && newVal > total)) return;

            if (total > 0 && newVal === total && !anime.status?.includes('complet')) {
                document.getElementById('pendingCompId').value    = id;
                document.getElementById('pendingCompVal').value   = newVal;
                document.getElementById('pendingCompSeason').value = '';
                document.getElementById('completedTitle').innerText = `Mark "${anime.title}" as Completed?`;
                document.getElementById('completedModal').classList.add('show');
                return;
            }
            await updateDoc(doc(db, "users", auth.currentUser.uid, "watchlist", String(id)),
                { watchedEpisodes: newVal });
            anime.watchedEpisodes = newVal;
            renderList(document.querySelector('.filter-btn.active').dataset.filter);
        };

        window.legacyStartEdit = function(id, field, element) {
            vibrate();
            const anime    = allAnime.find(a => String(a.malId) === String(id));
            const currentVal = field === 'season' ? (anime.season || 1) : (anime.watchedEpisodes || 0);
            const input    = document.createElement('input');
            input.type     = 'number';
            input.className = 'edit-input';
            input.value    = currentVal;
            element.innerHTML = '';
            element.appendChild(input);
            input.focus();
            input.onblur = async () => {
                let newVal = parseInt(input.value) || currentVal;
                await updateDoc(
                    doc(db, "users", auth.currentUser.uid, "watchlist", String(id)),
                    { [field]: newVal }
                );
                anime[field] = newVal;
                renderList(document.querySelector('.filter-btn.active').dataset.filter);
            };
        };

        /* ─────────────────────────────────
           FILTER + COMMON ACTIONS
        ───────────────────────────────── */
        window.filterList = (status, btn) => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderList(status);
        };

        window.openRateModal = (id) => {
            const anime = allAnime.find(a => String(a.malId) === String(id));
            document.getElementById('rateId').value  = id;
            document.getElementById('rateTitle').innerText = anime.seriesName || anime.title;
            tempSelectedScore = anime.userScore || 0;
            const grid = document.getElementById('ratingOptions');
            grid.innerHTML = '';
            for (let i = 1; i <= 10; i++) {
                const item = document.createElement('div');
                item.className = `rating-item ${i === tempSelectedScore ? 'selected' : ''}`;
                item.innerText = i;
                item.onclick   = () => {
                    tempSelectedScore = i;
                    document.querySelectorAll('.rating-item').forEach(el => el.classList.remove('selected'));
                    item.classList.add('selected');
                };
                grid.appendChild(item);
            }
            document.getElementById('rateModal').classList.add('show');
        };

        window.saveRating = async () => {
            const id    = document.getElementById('rateId').value;
            await updateDoc(
                doc(db, "users", auth.currentUser.uid, "watchlist", String(id)),
                { userScore: tempSelectedScore }
            );
            const anime = allAnime.find(a => String(a.malId) === String(id));
            if (anime) anime.userScore = tempSelectedScore;
            closeModal('rateModal');
            renderList(document.querySelector('.filter-btn.active').dataset.filter);
        };

        window.openDeleteModal = (id, title) => {
            document.getElementById('deleteId').value    = id;
            document.getElementById('deleteTitle').innerText = `"${title}" will be removed.`;
            document.getElementById('deleteModal').classList.add('show');
        };

        window.confirmDelete = async () => {
            const id = document.getElementById('deleteId').value;
            await deleteDoc(doc(db, "users", auth.currentUser.uid, "watchlist", String(id)));
            allAnime = allAnime.filter(a => String(a.malId) !== String(id));
            closeModal('deleteModal');
            renderList(document.querySelector('.filter-btn.active').dataset.filter);
        };

        window.closeModal = (id) => document.getElementById(id).classList.remove('show');
    </script>
</body>
</html>
